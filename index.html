// ══════════════════════════════════════════════════════════════════════════════

function ActivityAddModal({defaultDate="",onClose,onSave}){
  const today=new Date().toISOString().slice(0,10);
  const [form,setForm]=useState({date:defaultDate||today,name:"",activity:"",achievement:""});
  const [saving,setSaving]=useState(false);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  async function submit(){ if(!form.date||!form.name||!form.activity)return; setSaving(true); await onSave(form); setSaving(false); onClose(); }
  return (
    <Modal title="📋 Log Activity" onClose={onClose}>
      <Inp label="Date *" type="date" value={form.date} onChange={e=>f("date",e.target.value)}/>
      <Inp label="Name *" value={form.name} onChange={e=>f("name",e.target.value)} placeholder="Team member name..."/>
      <Inp label="Activity *" value={form.activity} onChange={e=>f("activity",e.target.value)} placeholder="What did they do today?"/>
      <Inp label="Achievement" value={form.achievement} onChange={e=>f("achievement",e.target.value)} placeholder="Notable win or result (optional)..."/>
      <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:16}}>
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn onClick={submit} disabled={saving||!form.date||!form.name||!form.activity}>{saving?"Saving...":"Save Entry"}</Btn>
      </div>
    </Modal>
  );
}

function ActivityLogTab({pipeline}){
  const [logs,setLogs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [subTab,setSubTab]=useState("Log");
  const [showAdd,setShowAdd]=useState(false);
  const [addDate,setAddDate]=useState("");
  const [dayModal,setDayModal]=useState(null);
  const [calMonth,setCalMonth]=useState(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;});
  const [filterFrom,setFilterFrom]=useState("");
  const [filterTo,setFilterTo]=useState("");
  const today=new Date().toISOString().slice(0,10);

  useEffect(()=>{
    setLoading(true);
    sbGetWhere("activity_log","pipeline",pipeline)
      .then(data=>{ if(Array.isArray(data))setLogs(data); setLoading(false); })
      .catch(()=>setLoading(false));
  },[pipeline]);

  const filteredLogs=useMemo(()=>{ let l=logs; if(filterFrom)l=l.filter(e=>e.date>=filterFrom); if(filterTo)l=l.filter(e=>e.date<=filterTo); return l; },[logs,filterFrom,filterTo]);
  const logsByDate=useMemo(()=>{ const m={}; logs.forEach(e=>{if(!m[e.date])m[e.date]=[];m[e.date].push(e);}); return m; },[logs]);

  async function addEntry(form){
    const row={pipeline,date:form.date,name:form.name,activity:form.activity,achievement:form.achievement||""};
    const res=await sbInsert("activity_log",row);
    if(Array.isArray(res)&&res[0])setLogs(p=>[res[0],...p]);
  }
  async function deleteEntry(id){ await sbDelete("activity_log",id); setLogs(p=>p.filter(e=>e.id!==id)); }

  function exportCSV(){
    const h=["Date","Name","Activity","Achievement"];
    const rows=filteredLogs.map(e=>[e.date,e.name,e.activity,e.achievement||""]);
    const csv=[h,...rows].map(r=>r.map(v=>`"${(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`activity_log_${pipeline.replace(/\s+/g,"_")}_${today}.csv`;a.click();URL.revokeObjectURL(url);
  }

  const calYear=parseInt(calMonth.split('-')[0]);
  const calMonthNum=parseInt(calMonth.split('-')[1])-1;
  const firstDay=new Date(calYear,calMonthNum,1).getDay();
  const daysInMonth=new Date(calYear,calMonthNum+1,0).getDate();
  const calLabel=new Date(calYear,calMonthNum,1).toLocaleString('default',{month:'long',year:'numeric'});
  function prevMo(){ const[y,m]=calMonth.split('-').map(Number);const pm=m===1?12:m-1;const py=m===1?y-1:y;setCalMonth(`${py}-${String(pm).padStart(2,'0')}`); }
  function nextMo(){ const[y,m]=calMonth.split('-').map(Number);const nm=m===12?1:m+1;const ny=m===12?y+1:y;setCalMonth(`${ny}-${String(nm).padStart(2,'0')}`); }

  if(loading)return <Spinner text="Loading Activity Log..."/>;

  return (
    <div>
      {/* Sub-tabs + toolbar */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",gap:6}}>
          {["Log","Calendar"].map(t=>(
            <button key={t} onClick={()=>setSubTab(t)} style={{background:subTab===t?"rgba(35,161,221,0.15)":"rgba(255,255,255,0.04)",color:subTab===t?"#04bee7":"rgba(174,220,255,0.55)",border:`1px solid ${subTab===t?"rgba(35,161,221,0.4)":"rgba(255,255,255,0.09)"}`,borderRadius:8,padding:"7px 16px",cursor:"pointer",fontWeight:subTab===t?600:500,fontSize:13,transition:"all .15s"}}>{t}</button>
          ))}
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          {subTab==="Log"&&(
            <>
              <input type="date" value={filterFrom} onChange={e=>setFilterFrom(e.target.value)} style={{...IS,width:"auto",padding:"6px 10px",fontSize:12}}/>
              <span style={{color:"rgba(174,220,255,0.38)",fontSize:12}}>to</span>
              <input type="date" value={filterTo} onChange={e=>setFilterTo(e.target.value)} style={{...IS,width:"auto",padding:"6px 10px",fontSize:12}}/>
              <button onClick={exportCSV} style={{background:"rgba(54,242,175,0.1)",color:"#36f2af",border:"1px solid #22c55e44",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:13,fontWeight:600}}>⬇ Export</button>
            </>
          )}
          <button onClick={()=>{setAddDate(today);setShowAdd(true);}} style={{background:"rgba(35,161,221,0.12)",color:"#23a1dd",border:"1px solid rgba(35,161,221,0.25)",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontWeight:600,fontSize:13}}>+ Add Entry</button>
        </div>
      </div>

      {/* Log Tab — Table */}
      {subTab==="Log"&&(
        <div style={{overflowX:"auto",borderRadius:12,border:"1px solid rgba(255,255,255,0.09)",background:"rgba(6,14,28,0.5)",backdropFilter:"blur(12px)"}}>
          {filteredLogs.length===0?(
            <div style={{color:"rgba(174,220,255,0.38)",fontSize:13,textAlign:"center",padding:40}}>No activity entries yet. Click "+ Add Entry" to start logging.</div>
          ):(
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead style={{background:"rgba(255,255,255,0.04)"}}>
                <tr>{["Date","Name","Activity","Achievement",""].map(h=><th key={h} style={{padding:"9px 12px",textAlign:"left",color:"rgba(174,220,255,0.38)",fontWeight:600,fontSize:11,borderBottom:"1px solid rgba(255,255,255,0.07)",whiteSpace:"nowrap",textTransform:"uppercase",letterSpacing:"0.05em"}}>{h}</th>)}</tr>
              </thead>
              <tbody>
                {filteredLogs.map(e=>(
                  <tr key={e.id} style={{borderBottom:"1px solid rgba(255,255,255,0.05)"}} onMouseEnter={ev=>ev.currentTarget.style.background="rgba(35,161,221,0.06)"} onMouseLeave={ev=>ev.currentTarget.style.background="transparent"}>
                    <td style={{padding:"9px 12px",color:"#23a1dd",fontWeight:600,whiteSpace:"nowrap"}}>{e.date}</td>
                    <td style={{padding:"9px 12px",color:"#daeeff",fontWeight:600}}>{e.name}</td>
                    <td style={{padding:"9px 12px",color:"rgba(174,220,255,0.7)"}}>{e.activity}</td>
                    <td style={{padding:"9px 12px",color:"#36f2af"}}>{e.achievement||"—"}</td>
                    <td style={{padding:"9px 12px"}}><button onClick={()=>deleteEntry(e.id)} style={{background:"rgba(239,68,68,0.1)",color:"#ef4444",border:"none",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:11}}>🗑</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {/* Calendar Tab */}
      {subTab==="Calendar"&&(
        <div>
          <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:18,justifyContent:"center"}}>
            <button onClick={prevMo} style={{background:"rgba(255,255,255,0.03)",color:"#daeeff",border:"1px solid rgba(255,255,255,0.09)",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:16}}>‹</button>
            <span style={{fontWeight:700,fontSize:18,color:"#daeeff"}}>{calLabel}</span>
            <button onClick={nextMo} style={{background:"rgba(255,255,255,0.03)",color:"#daeeff",border:"1px solid rgba(255,255,255,0.09)",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:16}}>›</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4,marginBottom:4}}>
            {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:600,color:"rgba(174,220,255,0.38)",padding:"4px 0"}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
            {Array.from({length:firstDay}).map((_,i)=><div key={"e"+i}/>)}
            {Array.from({length:daysInMonth}).map((_,i)=>{
              const day=i+1;
              const dateStr=`${calMonth}-${String(day).padStart(2,'0')}`;
              const dayLogs=logsByDate[dateStr]||[];
              const hasLogs=dayLogs.length>0;
              const isToday=dateStr===today;
              return (
                <div key={day} onClick={()=>setDayModal(dateStr)}
                  onMouseEnter={e=>e.currentTarget.style.background="rgba(35,161,221,0.18)"}
                  onMouseLeave={e=>e.currentTarget.style.background=hasLogs?"rgba(35,161,221,0.1)":"rgba(255,255,255,0.03)"}
                  style={{background:hasLogs?"rgba(35,161,221,0.1)":"rgba(255,255,255,0.03)",border:isToday?"1px solid #04bee7":hasLogs?"1px solid rgba(35,161,221,0.3)":"1px solid rgba(255,255,255,0.06)",borderRadius:10,padding:"8px 4px",minHeight:64,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,transition:"all .15s",boxSizing:"border-box"}}>
                  <span style={{fontWeight:isToday?700:500,fontSize:13,color:isToday?"#04bee7":"#daeeff"}}>{day}</span>
                  {hasLogs&&<span style={{background:"#23a1dd",color:"#fff",borderRadius:20,padding:"1px 8px",fontSize:11,fontWeight:700}}>{dayLogs.length}</span>}
                  {hasLogs&&dayLogs.slice(0,2).map((e,idx)=><span key={idx} style={{fontSize:10,color:"rgba(174,220,255,0.6)",textAlign:"center",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"100%",padding:"0 2px"}}>{e.name}</span>)}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {showAdd&&<ActivityAddModal defaultDate={addDate} onClose={()=>{setShowAdd(false);setAddDate("");}} onSave={addEntry}/>}

      {dayModal&&(
        <Modal title={`Activity Log — ${dayModal}`} onClose={()=>setDayModal(null)}>
          <div style={{marginBottom:12,maxHeight:360,overflowY:"auto"}}>
            {(logsByDate[dayModal]||[]).length===0?(
              <div style={{color:"rgba(174,220,255,0.38)",fontSize:13,textAlign:"center",padding:20}}>No entries for this day.</div>
            ):(
              (logsByDate[dayModal]||[]).map(e=>(
                <div key={e.id} style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:10,padding:"10px 14px",marginBottom:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:600,color:"#daeeff",fontSize:13}}>{e.name}</div>
                      <div style={{color:"rgba(174,220,255,0.7)",fontSize:12,marginTop:3}}>{e.activity}</div>
                      {e.achievement&&<div style={{color:"#36f2af",fontSize:12,marginTop:3}}>✓ {e.achievement}</div>}
                    </div>
                    <button onClick={()=>deleteEntry(e.id)} style={{background:"rgba(239,68,68,0.1)",color:"#ef4444",border:"none",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:11,flexShrink:0}}>🗑</button>
                  </div>
                </div>
              ))
            )}
          </div>

function PLUploadModal({stage,onClose,onImport}){

      <Inp label="Deal Date *" type="date" value={date} onChange={e=>setDate(e.target.value)} style={{colorScheme:"light"}}/>
      <div style={{marginBottom:12}}><label style={{display:"block",fontSize:12,color:"rgba(174,220,255,0.38)",marginBottom:4,fontWeight:600}}>Revenue * (USD)</label><div style={{position:"relative"}}><span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",color:"rgba(174,220,255,0.55)",fontWeight:700}}>$</span><input type="number" min="0" step="0.01" value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0.00" style={{...IS,paddingLeft:26}}/></div></div>
      {err&&<div style={{color:"#ef4444",fontSize:12,marginBottom:10}}>⚠ {err}</div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Btn variant="ghost" onClick={onClose}>Cancel</Btn><Btn onClick={submit} style={{background:"#36f2af",color:"#071525"}}>🏆 Mark as Won</Btn></div>
    </Modal>
  );
}

function PaidLeadsPipelineGate({search="",setSearch=()=>{},onRevenue=()=>{}}){
  const [leads,setLeads]=useState([]);const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState("Kanban");const [stageTab,setStageTab]=useState("All");
  const [modal,setModal]=useState(null);const [addModal,setAddModal]=useState(null);const [uploadModal,setUploadModal]=useState(null);
  const [fuPending,setFuPending]=useState(null);const [connectedPending,setConnectedPending]=useState(null);
  const [lostPending,setLostPending]=useState(null);const [trashPending,setTrashPending]=useState(null);
  const [apptPending,setApptPending]=useState(null);const [wonPending,setWonPending]=useState(null);
  const [dragId,setDragId]=useState(null);const [dragOver,setDragOver]=useState(null);
  const [saving,setSaving]=useState(false);
  const today=todayStr();

  useEffect(()=>{setLoading(true);sbGetAll("paid_leads").then(rows=>{if(Array.isArray(rows))setLeads(rows.map(rowToPL));setLoading(false);}).catch(()=>setLoading(false));},[]);

  const stageCounts=useMemo(()=>{const m={All:leads.length};PL_STAGES.forEach(s=>m[s]=leads.filter(l=>l.stage===s).length);return m;},[leads]);
  const filtered=useMemo(()=>{const q=search.toLowerCase();return leads.filter(l=>(stageTab==="All"||l.stage===stageTab)&&(!q||[l.firstName,l.lastName,l.companyName,l.industry,l.affiliateNetwork,l.phoneNumber,l.email].join(" ").toLowerCase().includes(q)));},[leads,search,stageTab]);
  const byStage=useMemo(()=>{const m={};PL_STAGES.forEach(s=>m[s]=filtered.filter(l=>l.stage===s));return m;},[filtered]);
  const stats=useMemo(()=>{const won=leads.filter(l=>l.stage==="WON");return{total:leads.length,won:won.length,lost:leads.filter(l=>l.stage==="Lost").length,trash:leads.filter(l=>l.stage==="Trash").length,active:leads.filter(l=>!["WON","Lost","Trash"].includes(l.stage)).length,revenue:won.reduce((s,l)=>s+(parseFloat(l.deal?.amount)||0),0)};},[leads]);
  useEffect(()=>{onRevenue({val:stats.revenue,label:"Paid Leads Revenue",color:"#ff6b35"});},[stats.revenue]);

  const overdueFU=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date&&l.followUp.date<today),[leads,today]);
  const todayFU=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date===today),[leads,today]);
  const overdueAppt=useMemo(()=>leads.filter(l=>l.stage==="Appointment Booked"&&l.appointment?.date&&l.appointment.date<today),[leads,today]);
  const todayAppt=useMemo(()=>leads.filter(l=>l.stage==="Appointment Booked"&&l.appointment?.date===today),[leads,today]);
  const reminderCount=overdueFU.length+todayFU.length+overdueAppt.length+todayAppt.length;

  const onDragStart=useCallback((e,id)=>{setDragId(id);e.dataTransfer.effectAllowed="move";},[]);
  const onDragOver=useCallback(stage=>setDragOver(stage),[]);
  const onDragLeave=useCallback(()=>setDragOver(null),[]);
  const updateLead=useCallback(async(id,patch)=>{const lead=leads.find(l=>l.id===id);if(!lead)return;const updated={...lead,...patch,source:lead.source};const res=await sbUpdate("paid_leads",id,plToRow(updated));if(Array.isArray(res)&&res[0])setLeads(p=>p.map(l=>l.id===id?rowToPL(res[0]):l));},[leads]);
  const onDrop=useCallback((e,stage)=>{
    e.preventDefault();setDragOver(null);if(dragId==null)return;
    const lead=leads.find(l=>l.id===dragId);if(!lead||lead.stage===stage){setDragId(null);return;}
    if(stage==="Follow Up")setFuPending(lead);
    else if(stage==="Connected")setConnectedPending(lead);
    else if(stage==="Lost")setLostPending(lead);
    else if(stage==="Trash")setTrashPending(lead);
    else if(stage==="Appointment Booked")setApptPending(lead);
    else if(stage==="WON")setWonPending(lead);
    else updateLead(dragId,{stage});
    setDragId(null);
  },[dragId,leads,updateLead]);

  async function saveLead(form){setSaving(true);const row=plToRow({...form,source:form.source});if(form.id){const res=await sbUpdate("paid_leads",form.id,row);if(Array.isArray(res)&&res[0])setLeads(p=>p.map(l=>l.id===form.id?rowToPL(res[0]):l));}else{const res=await sbInsert("paid_leads",row);if(Array.isArray(res)&&res[0])setLeads(p=>[...p,rowToPL(res[0])]);} setSaving(false);setModal(null);setAddModal(null);}
  async function deleteLead(id){await sbDelete("paid_leads",id);setLeads(p=>p.filter(l=>l.id!==id));setModal(null);}
  function saveFU(date,notes){if(!fuPending)return;const lead=fuPending;const nh=[...(lead.followUpHistory||[]),{date:lead.followUp?.date||date,notes:lead.followUp?.notes||"",attempt:(lead.followUpHistory||[]).length+1}];updateLead(lead.id,{stage:"Follow Up",followUp:{date,notes},followUpHistory:nh});setFuPending(null);}
  function saveConnected(date,notes){if(!connectedPending)return;updateLead(connectedPending.id,{stage:"Connected",connected:{date,notes}});setConnectedPending(null);}
  function saveLost(reason){if(!lostPending)return;updateLead(lostPending.id,{stage:"Lost",lost:{date:todayStr(),reason}});setLostPending(null);}
  function saveTrash(reason){if(!trashPending)return;updateLead(trashPending.id,{stage:"Trash",trash:{date:todayStr(),reason}});setTrashPending(null);}
  function saveAppt(date,time,notes){if(!apptPending)return;const lead=apptPending;const nh=[...(lead.appointmentHistory||[]),{date:lead.appointment?.date||date,time:lead.appointment?.time||"",notes:lead.appointment?.notes||"",attempt:(lead.appointmentHistory||[]).length+1}];updateLead(lead.id,{stage:"Appointment Booked",appointment:{date,time,notes},appointmentHistory:nh});setApptPending(null);}
  async function saveWon(date,amount){if(!wonPending)return;const lead=wonPending;updateLead(lead.id,{stage:"WON",deal:{date,amount:parseFloat(amount)||0}});await sbInsert("hot_pipeline",hpToRow({firstName:lead.firstName,lastName:lead.lastName,linkedinUrl:lead.linkedinUrl||"",website:lead.website||"",industry:lead.industry||"",email:lead.email||"",accountName:lead.companyName||lead.affiliateNetwork||"",source:"Paid Leads",stage:"Paid Leads",saleValue:parseFloat(amount)||0,tags:[],followUp:null,deal:null,followUpHistory:[]}));setWonPending(null);}
  async function importLeads(rows){const ins=[],sk=[];for(const row of rows){const dup=leads.some(l=>(row.phoneNumber&&l.phoneNumber&&l.phoneNumber===row.phoneNumber)||(row.email&&l.email&&l.email.toLowerCase()===row.email.toLowerCase())||(l.firstName?.toLowerCase()===row.firstName?.toLowerCase()&&l.lastName?.toLowerCase()===row.lastName?.toLowerCase()&&l.companyName?.toLowerCase()===row.companyName?.toLowerCase()));if(dup){sk.push(row);continue;}const res=await sbInsert("paid_leads",plToRow(row));if(Array.isArray(res)&&res[0])ins.push(rowToPL(res[0]));}if(ins.length)setLeads(p=>[...p,...ins]);setUploadModal(null);alert(`✅ ${ins.length} imported\n⚠️ ${sk.length} duplicates skipped`);}

  const calendarAppts=useMemo(()=>leads.filter(l=>l.appointment?.date).map(l=>({...l.appointment,leadId:l.id,name:`${l.firstName} ${l.lastName}`,company:l.companyName})),[leads]);

  if(loading)return <Spinner text="Loading Paid Leads Pipeline..."/>;

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{background:"rgba(6,14,28,0.6)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",gap:0,overflowX:"auto"}}>
          {["All",...PL_STAGES].map(s=>(
            <button key={s} onClick={()=>setStageTab(s)} style={{background:"none",color:stageTab===s?"#04bee7":"rgba(174,220,255,0.5)",border:"none",borderBottom:stageTab===s?"2px solid #23a1dd":"2px solid transparent",padding:"12px 10px",cursor:"pointer",fontWeight:stageTab===s?600:500,fontSize:12,transition:"all .15s",marginBottom:-1,display:"flex",alignItems:"center",gap:4,whiteSpace:"nowrap"}}>
              {s}<span style={{background:stageTab===s?"#eff6ff":"#f1f5f9",color:stageTab===s?"#3b82f6":"#94a3b8",borderRadius:20,padding:"1px 6px",fontSize:10,fontWeight:600}}>{stageCounts[s]||0}</span>
            </button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0,paddingLeft:10}}>
          <button style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:8,width:32,height:32,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,position:"relative"}}>🔔{reminderCount>0&&<span style={{position:"absolute",top:-3,right:-3,background:"#ef4444",color:"#fff",borderRadius:"50%",width:15,height:15,fontSize:8,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>{reminderCount}</span>}</button>
          <button onClick={()=>exportPLCSV(leads)} style={{background:"rgba(54,242,175,0.08)",color:"#36f2af",border:"1px solid rgba(54,242,175,0.2)",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>⬇ Export All</button>
        </div>
      </div>
      <div style={{background:"rgba(255,255,255,0.05)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"10px 20px",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        {[{label:"Total Leads",val:stats.total,c:"#ff6b35"},{label:"Active",val:stats.active,c:"#23a1dd"},{label:"Follow Up",val:stageCounts["Follow Up"]||0,c:"#a855f7"},{label:"Connected",val:stageCounts["Connected"]||0,c:"#04bee7"},{label:"Appointment",val:stageCounts["Appointment Booked"]||0,c:"#10b981"},{label:"WON",val:stats.won,c:"#36f2af"},{label:"Lost",val:stats.lost,c:"#ef4444"},{label:"Trash",val:stats.trash,c:"#64748b"}].map(s=>(
          <div key={s.label} style={{background:"rgba(255,255,255,0.04)",backdropFilter:"blur(10px)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"8px 14px",display:"flex",flexDirection:"column",gap:2,minWidth:90,boxShadow:"0 4px 16px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05)"}}>
            <div style={{fontWeight:700,fontSize:15,color:s.c}}>{s.val}</div>
            <div style={{fontSize:10,color:"rgba(174,220,255,0.38)",fontWeight:500}}>{s.label}</div>
          </div>
        ))}
        <div style={{background:"linear-gradient(135deg,rgba(255,107,53,0.15),rgba(255,107,53,0.05))",border:"2px solid rgba(255,107,53,0.4)",borderRadius:12,padding:"8px 18px",display:"flex",flexDirection:"column",gap:2,minWidth:140,boxShadow:"0 2px 8px rgba(255,107,53,0.2)"}}>
          <div style={{fontWeight:800,fontSize:20,color:"#ff6b35",lineHeight:1}}>${stats.revenue.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
          <div style={{fontSize:11,color:"rgba(174,220,255,0.55)",fontWeight:600}}>Revenue Won</div>
        </div>
        {reminderCount>0&&<div style={{background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.25)",borderRadius:10,padding:"8px 14px",display:"flex",flexDirection:"column",gap:2,minWidth:100}}><div style={{fontWeight:700,fontSize:15,color:"#f59e0b"}}>{reminderCount}</div><div style={{fontSize:10,color:"rgba(174,220,255,0.38)",fontWeight:500}}>Overdue / Today</div></div>}
      </div>
      <div style={{background:"rgba(255,255,255,0.05)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 20px",display:"flex",gap:0}}>
        {["Kanban","Contacts","Calendar","Analytics"].map(t=><button key={t} onClick={()=>setTab(t)} style={{background:"none",color:tab===t?"#04bee7":"rgba(174,220,255,0.5)",border:"none",borderBottom:tab===t?"2px solid #23a1dd":"2px solid transparent",padding:"10px 14px",cursor:"pointer",fontWeight:tab===t?600:500,fontSize:13,transition:"all .15s",marginBottom:-1}}>{t}</button>)}
      </div>
      <div style={{flex:1,overflow:"auto",padding:tab==="Kanban"?"12px 16px":"16px 20px",background:"rgba(174,251,102,0.025)"}}>
        {tab==="Kanban"&&(
          <div style={{display:"flex",gap:10,alignItems:"flex-start",height:"100%"}}>
            {PL_STAGES.map(stage=>(
              <PLKanbanCol key={stage} stage={stage} leads={byStage[stage]||[]} onDragStart={onDragStart} onDrop={onDrop} onDragOver={onDragOver} onDragLeave={onDragLeave} onClick={lead=>setModal(lead)} isDragOver={dragOver===stage} today={today} isSource={PL_SOURCE_STAGES.includes(stage)} onAdd={()=>setAddModal({stage})} onImport={()=>setUploadModal({stage})} onExport={()=>exportPLCSV(filtered.filter(l=>l.stage===stage))}/>
            ))}
          </div>
        )}
        {tab==="Contacts"&&(
          <div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead><tr style={{borderBottom:"1px solid rgba(255,255,255,0.1)"}}>{["Name","Company","Phone","Email","Source","Stage","Deal"].map(h=><th key={h} style={{textAlign:"left",padding:"8px 12px",color:"rgba(174,220,255,0.55)",fontWeight:600,fontSize:12}}>{h}</th>)}</tr></thead>
              <tbody>{filtered.map(l=><tr key={l.id} onClick={()=>setModal(l)} style={{borderBottom:"1px solid rgba(255,255,255,0.05)",cursor:"pointer",transition:"background .1s"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(255,255,255,0.03)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <td style={{padding:"8px 12px",color:"#daeeff",fontWeight:600}}>{l.firstName} {l.lastName}</td>
                <td style={{padding:"8px 12px",color:"rgba(174,220,255,0.7)"}}>{l.companyName||"—"}</td>
                <td style={{padding:"8px 12px",color:"rgba(174,220,255,0.7)"}}>{l.phoneNumber||"—"}</td>
                <td style={{padding:"8px 12px",color:"rgba(174,220,255,0.7)"}}>{l.email||"—"}</td>
                <td style={{padding:"8px 12px"}}><span style={{background:(PL_COLORS[l.source]||"#64748b")+"22",color:PL_COLORS[l.source]||"#64748b",borderRadius:20,padding:"2px 8px",fontSize:11,fontWeight:600}}>{l.source}</span></td>
                <td style={{padding:"8px 12px"}}><span style={{background:(PL_COLORS[l.stage]||"#64748b")+"22",color:PL_COLORS[l.stage]||"#64748b",borderRadius:20,padding:"2px 8px",fontSize:11,fontWeight:600}}>{l.stage}</span></td>
                <td style={{padding:"8px 12px",color:"#36f2af",fontWeight:600}}>{l.deal?.amount?`$${Number(l.deal.amount).toLocaleString()}`:"—"}</td>
              </tr>)}</tbody>
            </table>
            {!filtered.length&&<div style={{textAlign:"center",color:"rgba(174,220,255,0.3)",marginTop:40,fontSize:14}}>No contacts found</div>}
          </div>
        )}
        {tab==="Calendar"&&(
          <div>
            <div style={{marginBottom:16,fontWeight:700,fontSize:15,color:"#daeeff"}}>Appointments</div>
            {calendarAppts.length===0?<div style={{color:"rgba(174,220,255,0.3)",fontSize:13}}>No appointments booked yet.</div>:(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {[...calendarAppts].sort((a,b)=>a.date>b.date?1:-1).map((a,i)=>(
                  <div key={i} style={{background:"rgba(16,185,129,0.08)",border:"1px solid rgba(16,185,129,0.2)",borderRadius:10,padding:"12px 16px",display:"flex",gap:16,alignItems:"flex-start"}}>
                    <div style={{minWidth:90,textAlign:"center",background:"rgba(16,185,129,0.12)",borderRadius:8,padding:"6px 10px"}}>
                      <div style={{fontWeight:800,fontSize:18,color:"#10b981"}}>{a.date?.slice(8,10)}</div>
                      <div style={{fontSize:11,color:"rgba(174,220,255,0.55)"}}>{a.date?.slice(0,7)}</div>
                    </div>
                    <div>
                      <div style={{fontWeight:700,color:"#daeeff",fontSize:14}}>{a.name}</div>
                      {a.company&&<div style={{fontSize:12,color:"rgba(174,220,255,0.55)"}}>🏢 {a.company}</div>}
                      {a.time&&<div style={{fontSize:12,color:"#10b981"}}>🕐 {a.time}</div>}
                      {a.notes&&<div style={{fontSize:12,color:"rgba(174,220,255,0.7)",marginTop:4}}>📝 {a.notes}</div>}
                      {a.date<today&&<span style={{background:"#ef444422",color:"#ef4444",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>OVERDUE</span>}
                      {a.date===today&&<span style={{background:"rgba(54,242,175,0.12)",color:"#36f2af",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>TODAY</span>}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
        {tab==="Analytics"&&(
          <div style={{display:"flex",flexDirection:"column",gap:20}}>
            <div style={{fontWeight:700,fontSize:15,color:"#daeeff"}}>Stage Breakdown</div>
            {PL_STAGES.map(s=>{const cnt=leads.filter(l=>l.stage===s).length;const pct=leads.length?Math.round(cnt/leads.length*100):0;return(
              <div key={s} style={{display:"flex",alignItems:"center",gap:12}}>
                <div style={{minWidth:120,fontSize:12,color:"rgba(174,220,255,0.7)",fontWeight:600}}>{s}</div>
                <div style={{flex:1,height:8,background:"rgba(255,255,255,0.06)",borderRadius:20,overflow:"hidden"}}><div style={{height:"100%",width:pct+"%",background:PL_COLORS[s]||"#64748b",borderRadius:20,transition:"width .3s"}}/></div>
                <div style={{minWidth:60,fontSize:12,color:"rgba(174,220,255,0.55)",textAlign:"right"}}>{cnt} ({pct}%)</div>
              </div>
            );})}
            <div style={{marginTop:10,padding:"12px 16px",background:"rgba(255,107,53,0.08)",border:"1px solid rgba(255,107,53,0.2)",borderRadius:12}}>
              <div style={{fontSize:12,color:"rgba(174,220,255,0.55)",marginBottom:4}}>Total Revenue Won</div>
              <div style={{fontWeight:800,fontSize:24,color:"#ff6b35"}}>${stats.revenue.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
            </div>
          </div>
        )}
      </div>
      {addModal&&<PLAddModal stage={addModal.stage} onClose={()=>setAddModal(null)} onSave={f=>saveLead({...f,stage:addModal.stage,source:addModal.stage})}/>}
      {uploadModal&&<PLUploadModal stage={uploadModal.stage} onClose={()=>setUploadModal(null)} onImport={rows=>importLeads(rows)}/>}
      {modal&&<PLEditModal lead={modal} onClose={()=>setModal(null)} onSave={saveLead} onDelete={deleteLead} saving={saving}/>}
      {fuPending&&<PLFollowUpModal lead={fuPending} onClose={()=>setFuPending(null)} onSave={saveFU}/>}
      {connectedPending&&<PLConnectedModal lead={connectedPending} onClose={()=>setConnectedPending(null)} onSave={saveConnected}/>}
      {lostPending&&<PLLostModal lead={lostPending} title="Lost" onClose={()=>setLostPending(null)} onSave={saveLost}/>}
      {trashPending&&<PLLostModal lead={trashPending} title="Trash" onClose={()=>setTrashPending(null)} onSave={saveTrash}/>}
      {apptPending&&<PLAppointmentModal lead={apptPending} onClose={()=>setApptPending(null)} onSave={saveAppt}/>}
      {wonPending&&<PLWonModal lead={wonPending} onClose={()=>setWonPending(null)} onSave={saveWon}/>}
    </div>
  );
}

        {/* Logo */}
        <div style={{padding:"18px 16px 16px",borderBottom:"1px solid rgba(255,255,255,0.06)",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
          <div style={{background:"linear-gradient(135deg,#23a1dd,#04bee7)",borderRadius:10,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:16,flexShrink:0,boxShadow:"0 4px 12px rgba(35,161,221,0.4)"}}>N</div>
          <span style={{fontWeight:700,fontSize:14,color:"#daeeff",letterSpacing:"-0.01em"}}>Nexsol LLC</span>
        </div>
        {/* Nav */}
        <nav style={{padding:"12px 8px",flex:1}}>
          {NAV.map(sec=>(
            <div key={sec.section} style={{marginBottom:20}}>
              <div style={{fontSize:9,fontWeight:700,color:"rgba(174,220,255,0.35)",letterSpacing:"0.12em",padding:"0 8px",marginBottom:5,textTransform:"uppercase"}}>{sec.section}</div>
              {sec.items.map(item=>{
                const active=gate===item.key&&item.key!=="settings";
                return (
                  <button key={item.key} className="nav-btn" onClick={()=>{if(item.soon)return;if(item.key==="settings"){setShowSettings(true);return;}setGate(item.key);}}
                    style={{width:"100%",background:active?"linear-gradient(135deg,rgba(35,161,221,0.25),rgba(4,190,231,0.15))":"transparent",color:active?"#04bee7":item.soon?"rgba(174,220,255,0.2)":"rgba(200,230,255,0.6)",border:active?"1px solid rgba(35,161,221,0.25)":"1px solid transparent",borderRadius:9,padding:"7px 10px",cursor:item.soon?"default":"pointer",fontWeight:active?600:500,fontSize:13,display:"flex",alignItems:"center",gap:9,textAlign:"left",transition:"all .15s",marginBottom:2,boxShadow:active?"0 2px 12px rgba(35,161,221,0.15)":"none"}}>
                    <NavIcon name={item.key} active={active}/>
                    <span style={{flex:1}}>{item.label}</span>
                    {item.soon&&<span style={{background:"rgba(255,255,255,0.06)",color:"rgba(200,230,255,0.3)",borderRadius:20,padding:"1px 7px",fontSize:10,fontWeight:500}}>soon</span>}
                  </button>
                );
              })}
            </div>
          ))}
        </nav>
        <div style={{padding:"12px 16px",borderTop:"1px solid rgba(255,255,255,0.06)",fontSize:11,color:"#36f2af",display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
          <span style={{width:6,height:6,background:"#36f2af",borderRadius:"50%",display:"inline-block",flexShrink:0,boxShadow:"0 0 6px rgba(54,242,175,0.6)"}}/>Supabase Connected
        </div>
      </div>
      {/* Main */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {/* Top Header */}
        <div style={{background:"rgba(6,14,28,0.7)",backdropFilter:"blur(20px)",borderBottom:"1px solid rgba(35,161,221,0.1)",padding:"0 24px",height:58,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <h1 style={{fontWeight:700,fontSize:18,color:"#daeeff",margin:0,letterSpacing:"-0.02em"}}>{titles[gate]||"CRM"}</h1>
            {pipelineRevenue!=null&&(
              <div style={{background:`rgba(${pipelineRevenue.color==="Won"?"54,242,175":"35,161,221"},0.1)`,border:`1px solid ${pipelineRevenue.color}33`,borderRadius:10,padding:"5px 13px",display:"flex",flexDirection:"column",gap:1,backdropFilter:"blur(8px)"}}>
                <span style={{fontWeight:800,fontSize:15,color:pipelineRevenue.color,lineHeight:1}}>${pipelineRevenue.val.toLocaleString(undefined,{maximumFractionDigits:0})}</span>
                <span style={{fontSize:9,color:"rgba(174,220,255,0.5)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.05em"}}>{pipelineRevenue.label}</span>
              </div>
            )}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{position:"relative"}}>
              <svg style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(174,220,255,0.4)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" style={{...IS,width:190,padding:"7px 32px 7px 32px",transition:"border-color .15s"}} onFocus={e=>e.target.style.borderColor="rgba(35,161,221,0.5)"} onBlur={e=>e.target.style.borderColor="rgba(255,255,255,0.13)"}/>
              {search&&<span onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:"rgba(174,220,255,0.4)",cursor:"pointer",fontSize:15,lineHeight:1,fontWeight:400}}>×</span>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:34,height:34,background:"linear-gradient(135deg,#23a1dd,#04bee7)",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:13,flexShrink:0,boxShadow:"0 4px 12px rgba(35,161,221,0.35)"}}>👤</div>
            </div>
          </div>
        </div>
        {/* Content */}
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {gate==="pipeline"?<HotPipelineGate search={search} setSearch={setSearch} onRevenue={setPipelineRevenue}/>:gate==="contacts"?<LinkedInGate search={search} setSearch={setSearch} onRevenue={setPipelineRevenue}/>:gate==="freelance"?<FreelancePipelineGate search={search} onRevenue={setPipelineRevenue}/>:gate==="clients"?<ActiveClientsGate search={search} setSearch={setSearch} onRevenue={setPipelineRevenue}/>:gate==="allcontacts"?<AllContactsView search={search} setSearch={setSearch}/>:gate==="clientpayments"?<ClientPaymentsGate search={search} setSearch={setSearch} onRevenue={setPipelineRevenue}/>:gate==="coldcalling"?<ColdCallingGate search={search} setSearch={setSearch} onRevenue={setPipelineRevenue}/>:gate==="emailcampaign"?<EmailCampaignGate search={search} setSearch={setSearch} onRevenue={setPipelineRevenue}/>:gate==="paidleads"?<PaidLeadsPipelineGate search={search} setSearch={setSearch} onRevenue={setPipelineRevenue}/>:<ComingSoonView label={titles[gate]||gate}/>}
        </div>
      </div>
      {showSettings&&<SettingsModal darkMode={darkMode} onToggleDark={()=>setDarkMode(v=>!v)} onClose={()=>setShowSettings(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
