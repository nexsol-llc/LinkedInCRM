// ── Supabase ──────────────────────────────────────────────────────────────────
async function sbGetAll(table) {
  let all = [], from = 0;
  while (true) {
    const r = await fetch(`${SB_URL}/rest/v1/${table}?order=id.asc&offset=${from}&limit=1000`, { headers: HEADERS });
    const data = await r.json();
    if (!Array.isArray(data) || data.length === 0) break;
    all = [...all, ...data];
    if (data.length < 1000) break;
    from += 1000;
  }
  return all;
}
async function sbInsert(table, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, { method:"POST", headers:HEADERS, body:JSON.stringify(data) });
  return r.json();
}
async function sbUpdate(table, id, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, { method:"PATCH", headers:HEADERS, body:JSON.stringify(data) });
  return r.json();
}
async function sbDelete(table, id) {
  await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, { method:"DELETE", headers:HEADERS });
}

function copyText(text, cb) {
  try { const el = document.createElement("textarea"); el.value=text; el.style.cssText="position:absolute;left:-9999px;"; document.body.appendChild(el); el.focus(); el.select(); el.setSelectionRange(0,el.value.length); document.execCommand("copy"); document.body.removeChild(el); if(cb)cb(); } catch(e){}
}
function interp(t,l) { return (t||"").replace(/{first_name}/g,l.firstName||"").replace(/{last_name}/g,l.lastName||"").replace(/{company}/g,l.affiliateNetwork||"").replace(/{industry}/g,l.industry||"").replace(/{network}/g,l.affiliateNetwork||""); }
function parseCSV(text) {
  const lines=text.trim().split("\n").map(l=>l.trim()).filter(Boolean); if(lines.length<2)return[];
  const hmap={firstname:"firstName",lastname:"lastName",linkedinurl:"linkedinUrl",website:"website",industry:"industry",affiliatenetwork:"affiliateNetwork",email:"email"};
  const headers=lines[0].split(",").map(h=>h.trim().toLowerCase().replace(/\s+/g,""));
  return lines.slice(1).map((line,i)=>{ const vals=line.split(",").map(v=>v.trim().replace(/^"|"$/g,"")); const obj={stage:"Cold",tags:[],followUp:null,deal:null,followUpHistory:[]}; headers.forEach((h,idx)=>{if(hmap[h])obj[hmap[h]]=vals[idx]||"";}); return obj; }).filter(r=>r.firstName||r.lastName);
}
function exportCSV(leads) {
  const h=["firstName","lastName","linkedinUrl","website","industry","affiliateNetwork","email","stage","tags"]; const rows=leads.map(l=>[l.firstName,l.lastName,l.linkedinUrl,l.website,l.industry,l.affiliateNetwork,l.email||"",l.stage,(l.tags||[]).join(";")].map(v=>`"${v||""}"`).join(",")); const csv=[h.join(","),...rows].join("\n"); const b=new Blob([csv],{type:"text/csv"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download="affilinks_contacts.csv"; a.click(); URL.revokeObjectURL(u);
}

function TagPill({tag,allTags,onRemove,small}){ const info=allTags.find(t=>t.name===tag)||{color:"#64748b"}; return <span style={{background:info.color+"22",color:info.color,border:`1px solid ${info.color}44`,borderRadius:20,padding:small?"1px 7px":"2px 9px",fontSize:small?10:11,fontWeight:600,display:"inline-flex",alignItems:"center",gap:4}}>{tag}{onRemove&&<span onClick={onRemove} style={{cursor:"pointer",opacity:.7}}>×</span>}</span>; }
function TagSelector({selected,allTags,onChange}){
  const [input,setInput]=useState(""); const safe=selected||[];
  function add(name){ name=name.trim().toLowerCase().replace(/\s+/g,"-"); if(!name||safe.includes(name))return; onChange([...safe,name]); setInput(""); }
  return (
    <div style={{marginBottom:12}}>
      <label style={{display:"block",fontSize:12,color:"#94a3b8",marginBottom:6,fontWeight:600}}>Tags</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:6}}>{safe.map(t=><TagPill key={t} tag={t} allTags={allTags} onRemove={()=>onChange(safe.filter(x=>x!==t))}/>)}</div>
      <div style={{display:"flex",gap:6}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add(input)} placeholder="Type tag + Enter..." style={{...IS,flex:1,fontSize:12}}/>

    </div>
  );
}

  const OPTS=[{name:"not-interested",color:"#64748b",emoji:"😐"},{name:"no-response",color:"#ef4444",emoji:"🔇"},{name:"wrong-fit",color:"#f97316",emoji:"❌"},{name:"bad-timing",color:"#f59e0b",emoji:"⏰"},{name:"wholesale",color:"#f97316",emoji:"📦"},{name:"other",color:"#6366f1",emoji:"💬"}];
  const toggle=name=>setSelected(p=>p.includes(name)?p.filter(x=>x!==name):[...p,name]);
  return (
    <Modal title={`❌ Moving to Lost — ${lead.firstName} ${lead.lastName}`} onClose={onClose}>
      <div style={{background:"#ef444415",border:"1px solid #ef444433",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:13,color:"#fca5a5"}}>Why is this lead lost? (optional)</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>{OPTS.map(t=><button key={t.name} onClick={()=>toggle(t.name)} style={{background:selected.includes(t.name)?t.color+"33":"#13131f",border:`2px solid ${selected.includes(t.name)?t.color:"#2d2d3f"}`,borderRadius:10,padding:"10px 12px",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:18}}>{t.emoji}</span><span style={{fontSize:12,color:selected.includes(t.name)?t.color:"#94a3b8",fontWeight:600,textTransform:"capitalize"}}>{t.name.replace(/-/g," ")}</span></button>)}</div>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Btn variant="ghost" onClick={onClose}>Cancel</Btn><Btn variant="danger" onClick={()=>onSave(selected)}>Move to Lost</Btn></div>
    </Modal>
  );
}

function LIUploadModal({onClose,onImport,stage="Cold",title="📥 Import Contacts",color="#6366f1"}){
  const [preview,setPreview]=useState(null); const [err,setErr]=useState(""); const [importing,setImporting]=useState(false); const fileRef=useRef();
  function handle(text){ const rows=parseCSV(text); if(!rows.length){setErr("Could not parse.");setPreview(null);}else{setErr("");setPreview(rows.map(r=>({...r,stage,tags:[...new Set([...(r.tags||[]),...(stage==="Sales Navigator"?["sales-navigator"]:[])]) ]})));} }
  async function doImport(){ if(!preview)return; setImporting(true); await onImport(preview); setImporting(false); }
  return (
    <Modal title={title} onClose={onClose} wide>
      {stage==="Sales Navigator"&&<div style={{background:"#14b8a615",border:"1px solid #14b8a633",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:13,color:"#2dd4bf"}}>Contacts → <strong>Sales Navigator</strong> with <strong>sales-navigator</strong> tag.</div>}
      <div style={{background:"#0d0d17",border:"1px solid #2d2d3f",borderRadius:10,padding:12,marginBottom:14}}><div style={{fontSize:12,color:"#64748b",marginBottom:6,fontWeight:600}}>CSV Headers:</div><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{["firstname","lastname","linkedinurl","website","industry","affiliatenetwork","email"].map(h=><span key={h} style={{background:"#6366f122",color:"#818cf8",border:"1px solid #6366f144",borderRadius:6,padding:"2px 8px",fontSize:11}}>{h}</span>)}</div></div>
      <input ref={fileRef} type="file" accept=".csv" onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>handle(ev.target.result);r.readAsText(f);}}} style={{display:"none"}}/>
      <div onClick={()=>fileRef.current.click()} style={{border:`2px dashed ${color}44`,borderRadius:10,padding:20,textAlign:"center",cursor:"pointer",color:"#64748b",fontSize:13,marginBottom:12}}>📂 Click to choose CSV file</div>
      <Tex label="Or paste CSV text" onChange={e=>handle(e.target.value)} style={{fontFamily:"monospace",fontSize:12}}/>
      {err&&<div style={{color:"#ef4444",fontSize:12,marginBottom:8}}>⚠ {err}</div>}
      {preview&&<div style={{background:"#0d0d17",border:`1px solid ${color}33`,borderRadius:8,padding:10,marginBottom:10}}><div style={{fontSize:12,color:color,marginBottom:4,fontWeight:600}}>✓ {preview.length} contacts ready</div>{preview.slice(0,5).map((r,i)=><div key={i} style={{fontSize:11,color:"#94a3b8",padding:"2px 0"}}>{r.firstName} {r.lastName} · {r.industry}</div>)}{preview.length>5&&<div style={{fontSize:11,color:"#64748b"}}>...and {preview.length-5} more</div>}</div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Btn variant="ghost" onClick={onClose}>Cancel</Btn><button onClick={doImport} style={{background:color,color:"#fff",border:"none",borderRadius:8,padding:"8px 16px",cursor:"pointer",fontSize:13,fontWeight:600,opacity:preview&&!importing?1:0.4}}>{importing?"Importing...":`Import ${preview?.length||0} Contacts`}</button></div>
    </Modal>
  );
}

function LinkedInGate(){
  const [leads,setLeads]=useState([]); const [templates,setTemplates]=useState([]); const [allTags,setAllTags]=useState(DEFAULT_TAGS); const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState("Kanban"); const [modal,setModal]=useState(null); const [dragId,setDragId]=useState(null); const [dragOver,setDragOver]=useState(null);
  const [fuPending,setFuPending]=useState(null); const [wonPending,setWonPending]=useState(null); const [lostPending,setLostPending]=useState(null); const [reviewPending,setReviewPending]=useState(null);
  const [saving,setSaving]=useState(false); const [showUpload,setShowUpload]=useState(false); const [showSNUpload,setShowSNUpload]=useState(false); const [search,setSearch]=useState("");
  const today=todayStr();

  useEffect(()=>{ setLoading(true); Promise.all([sbGetAll("leads"),sbGetAll("templates")]).then(([l,t])=>{ if(Array.isArray(l))setLeads(l.map(rowToLead)); if(Array.isArray(t))setTemplates(t); setLoading(false); }).catch(()=>setLoading(false)); },[]);
  useEffect(()=>{ if(!leads.length)return; const used=[...new Set(leads.flatMap(l=>l.tags||[]))]; setAllTags(prev=>{ const next=[...prev]; let ch=false; used.forEach(n=>{ if(!next.find(t=>t.name===n)){next.push({name:n,color:TAG_COLORS[next.length%TAG_COLORS.length]});ch=true;} }); return ch?next:prev; }); },[leads]);

  const filtered=useMemo(()=>{ const q=search.toLowerCase(); return leads.filter(l=>!q||[l.firstName,l.lastName,l.industry,l.affiliateNetwork].join(" ").toLowerCase().includes(q)); },[leads,search]);
  const byStage=useMemo(()=>{ const m={}; LI_STAGES.forEach(s=>m[s]=filtered.filter(l=>l.stage===s)); return m; },[filtered]);
  const stats=useMemo(()=>{ const won=leads.filter(l=>l.stage==="Won"); return{total:leads.length,won:won.length,lost:leads.filter(l=>l.stage==="Lost").length,active:leads.filter(l=>!["Won","Lost"].includes(l.stage)).length,revenue:won.reduce((s,l)=>s+(parseFloat(l.deal?.dealAmount)||0),0)}; },[leads]);
  const overdueLeads=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date&&l.followUp.date<today),[leads,today]);
  const todayLeads=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date===today),[leads,today]);
  const upcomingLeads=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date&&l.followUp.date>today&&l.followUp.date<=addDays(7)),[leads,today]);
  const reminderCount=overdueLeads.length+todayLeads.length;

  const onDragStart=useCallback((e,id)=>{setDragId(id);e.dataTransfer.effectAllowed="move";},[]);
  const onDragOver=useCallback(stage=>setDragOver(stage),[]);
  const onDragLeave=useCallback(()=>setDragOver(null),[]);
  const updateLead=useCallback(async(id,patch)=>{ const lead=leads.find(l=>l.id===id); if(!lead)return; const res=await sbUpdate("leads",id,leadToRow({...lead,...patch})); if(Array.isArray(res)&&res[0])setLeads(p=>p.map(l=>l.id===id?rowToLead(res[0]):l)); },[leads]);
  const onDrop=useCallback((e,stage)=>{ e.preventDefault();setDragOver(null); if(dragId==null)return; const lead=leads.find(l=>l.id===dragId); if(!lead||lead.stage===stage){setDragId(null);return;} if(stage==="Follow Up")setFuPending(lead); else if(stage==="Won")setWonPending(lead); else if(stage==="Lost")setLostPending(lead); else updateLead(dragId,{stage}); setDragId(null); },[dragId,leads,updateLead]);

  async function saveLead(form){ setSaving(true); const row=leadToRow(form); if(form.id){const res=await sbUpdate("leads",form.id,row);if(Array.isArray(res)&&res[0])setLeads(p=>p.map(l=>l.id===form.id?rowToLead(res[0]):l));}else{const res=await sbInsert("leads",row);if(Array.isArray(res)&&res[0])setLeads(p=>[...p,rowToLead(res[0])]);} setSaving(false);setModal(null); }
  async function deleteLead(id){ await sbDelete("leads",id);setLeads(p=>p.filter(l=>l.id!==id));setModal(null); }
  async function saveTemplate(form){ if(form.id){const res=await sbUpdate("templates",form.id,{name:form.name,body:form.body});if(Array.isArray(res)&&res[0])setTemplates(p=>p.map(t=>t.id===form.id?res[0]:t));}else{const res=await sbInsert("templates",{name:form.name,body:form.body});if(Array.isArray(res)&&res[0])setTemplates(p=>[...p,res[0]]);} }
  async function deleteTemplate(id){ await sbDelete("templates",id);setTemplates(p=>p.filter(t=>t.id!==id)); }
  function saveFU(date,notes){ if(!fuPending)return; const lead=fuPending; const nh=[...(lead.followUpHistory||[]),{date:lead.followUp?.date||date,notes:lead.followUp?.notes||"",attempt:(lead.followUpHistory||[]).length+1}]; updateLead(lead.id,{stage:"Follow Up",followUp:{date,notes},followUpHistory:nh});setFuPending(null); }
  function saveWon({closingDate,dealAmount,clientContract}){ if(!wonPending)return;updateLead(wonPending.id,{stage:"Won",deal:{closingDate,dealAmount,clientContract}});setWonPending(null); }
  async function importLeads(rows){ const ins=[],sk=[]; for(const row of rows){ const dup=leads.some(l=>(row.email&&l.email&&l.email.toLowerCase()===row.email.toLowerCase())||(l.firstName?.toLowerCase()===row.firstName?.toLowerCase()&&l.lastName?.toLowerCase()===row.lastName?.toLowerCase())); if(dup){sk.push(row);continue;} const res=await sbInsert("leads",leadToRow(row)); if(Array.isArray(res)&&res[0])ins.push(rowToLead(res[0])); } if(ins.length)setLeads(p=>[...p,...ins]);setShowUpload(false);setShowSNUpload(false);alert(`✅ ${ins.length} imported\n⚠️ ${sk.length} duplicates skipped`); }

  if(loading)return <Spinner text="Loading LinkedIn CRM..."/>;

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Sub header */}
      <div style={{background:"#13131f",borderBottom:"1px solid #2d2d3f",padding:"10px 16px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        {tab==="Kanban"&&<div style={{position:"relative",flex:"1 1 160px",maxWidth:220}}><span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",color:"#64748b"}}>🔍</span><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search..." style={{...IS,paddingLeft:30,fontSize:12}}/></div>}
        {[{label:"Total",val:stats.total,c:"#6366f1"},{label:"Won",val:stats.won,c:"#22c55e"},{label:"Revenue",val:"$"+stats.revenue.toLocaleString(undefined,{maximumFractionDigits:0}),c:"#f59e0b"}].map(s=><div key={s.label} style={{background:s.c+"15",border:`1px solid ${s.c}33`,borderRadius:9,padding:"4px 10px",display:"flex",gap:5,alignItems:"center"}}><span style={{fontWeight:800,fontSize:14,color:s.c}}>{s.val}</span><span style={{fontSize:11,color:"#64748b"}}>{s.label}</span></div>)}
        <div style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center"}}>
          <div style={{position:"relative"}}>
            <button onClick={()=>setShowUpload(v=>!v)} style={{background:"#2d2d3f",border:"none",borderRadius:8,width:32,height:32,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,position:"relative"}}>🔔{reminderCount>0&&<span style={{position:"absolute",top:-3,right:-3,background:"#ef4444",color:"#fff",borderRadius:"50%",width:15,height:15,fontSize:8,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>{reminderCount}</span>}</button>
          </div>
          <button onClick={()=>setShowUpload(true)} style={{background:"#2d2d3f",color:"#fff",border:"none",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>📥 Import</button>
          <button onClick={()=>setShowSNUpload(true)} style={{background:"#14b8a622",color:"#14b8a6",border:"1px solid #14b8a644",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>🔍 SN Import</button>

function MonthPicker({selectedMonth,currentMonth,availableMonths,onChange}){
  const [open,setOpen]=useState(false);
  const [viewYear,setViewYear]=useState(()=>parseInt(selectedMonth.split('-')[0]));
  const ref=useRef();
  useEffect(()=>{ function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);} if(open)document.addEventListener('mousedown',h); return()=>document.removeEventListener('mousedown',h); },[open]);
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const curY=parseInt(currentMonth.split('-')[0]); const curM=parseInt(currentMonth.split('-')[1]);
  const selY=parseInt(selectedMonth.split('-')[0]); const selM=parseInt(selectedMonth.split('-')[1]);
  function ym(m){return `${viewYear}-${String(m).padStart(2,'0')}`;}
  function isFuture(m){return viewYear>curY||(viewYear===curY&&m>curM);}
  function isSel(m){return viewYear===selY&&m===selM;}
  function isCur(m){return viewYear===curY&&m===curM;}
  function hasData(m){return availableMonths.includes(ym(m));}
  function fmtLabel(s){const[y,m]=s.split('-');return new Date(parseInt(y),parseInt(m)-1,1).toLocaleString('default',{month:'long',year:'numeric'});}
  return (
    <div ref={ref} style={{position:'relative',display:'inline-block'}}>
      <button onClick={()=>setOpen(v=>!v)}
        style={{background:'#1e1e2e',color:'#f59e0b',border:'1px solid #f59e0b44',borderRadius:9,padding:'6px 14px',cursor:'pointer',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',gap:7,whiteSpace:'nowrap'}}>
        📅 {fmtLabel(selectedMonth)} <span style={{fontSize:10,opacity:.7}}>{open?'▲':'▼'}</span>
      </button>
      {open&&(
        <div style={{position:'absolute',top:'calc(100% + 6px)',left:0,background:'#1a1a2e',border:'1px solid #2d2d3f',borderRadius:14,padding:14,zIndex:400,width:236,boxShadow:'0 10px 36px #000b'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <button onClick={()=>setViewYear(v=>v-1)} style={{background:'#2d2d3f',color:'#e2e8f0',border:'none',borderRadius:7,width:28,height:28,cursor:'pointer',fontSize:15,fontWeight:700}}>‹</button>
            <span style={{fontWeight:800,color:'#e2e8f0',fontSize:15}}>{viewYear}</span>
            <button onClick={()=>setViewYear(v=>v+1)} disabled={viewYear>=curY}
              style={{background:viewYear>=curY?'#13131f':'#2d2d3f',color:viewYear>=curY?'#3d3d4f':'#e2e8f0',border:'none',borderRadius:7,width:28,height:28,cursor:viewYear>=curY?'default':'pointer',fontSize:15,fontWeight:700}}>›</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:5}}>
            {MONTHS.map((name,i)=>{
              const m=i+1; const future=isFuture(m); const sel=isSel(m); const cur=isCur(m); const data=hasData(m);
              return (
                <button key={m} onClick={()=>{if(!future){onChange(ym(m));setOpen(false);}}} disabled={future}
                  style={{position:'relative',background:sel?'#f59e0b33':cur?'#22c55e15':data?'#6366f115':'#13131f',color:sel?'#f59e0b':cur?'#22c55e':future?'#2d2d3f':data?'#e2e8f0':'#64748b',border:`1px solid ${sel?'#f59e0b55':cur?'#22c55e44':data?'#6366f133':'#1e1e2e'}`,borderRadius:8,padding:'9px 4px',cursor:future?'default':'pointer',fontSize:12,fontWeight:700,transition:'all .1s'}}>
                  {name}
                  {cur&&<span style={{position:'absolute',top:3,right:4,width:5,height:5,background:'#22c55e',borderRadius:'50%',display:'block'}}/>}
                  {data&&!sel&&!cur&&<span style={{position:'absolute',bottom:3,left:'50%',transform:'translateX(-50%)',width:3,height:3,background:'#6366f1',borderRadius:'50%',display:'block'}}/>}
                </button>
              );
            })}
          </div>
          <div style={{marginTop:10,paddingTop:8,borderTop:'1px solid #2d2d3f',display:'flex',gap:5,fontSize:10,color:'#64748b',alignItems:'center',flexWrap:'wrap'}}>
            <span style={{width:8,height:8,background:'#22c55e',borderRadius:'50%',display:'inline-block'}}/>Current
            <span style={{width:8,height:8,background:'#6366f1',borderRadius:'50%',display:'inline-block',marginLeft:6}}/>Has data
          </div>
        </div>
      )}
    </div>
  );
}

// ── Insight Charts ────────────────────────────────────────────────────────────
function HPBarChart({data}){
  const maxVal=Math.max(...data.map(d=>d.value),1);
  const W=480,H=220,pL=58,pB=36,pT=24,pR=10;
  const cW=W-pL-pR,cH=H-pT-pB;
  const slot=cW/data.length;
  const bW=Math.max(slot*0.6,22);
  function fmt(v){return v>=1000?`$${(v/1000).toFixed(1)}k`:`$${Math.round(v)}`;}
  return(
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
      {[0,0.25,0.5,0.75,1].map(p=>{
        const y=pT+cH-p*cH;
        return <g key={p}>
          <line x1={pL} y1={y} x2={pL+cW} y2={y} stroke="#2d2d3f" strokeDasharray="3,3" strokeWidth={0.7}/>
          <text x={pL-5} y={y+4} textAnchor="end" fill="#64748b" fontSize={9}>{fmt(Math.round(p*maxVal))}</text>
        </g>;
      })}
      <line x1={pL} y1={pT} x2={pL} y2={pT+cH} stroke="#3d3d4f" strokeWidth={1}/>
      <line x1={pL} y1={pT+cH} x2={pL+cW} y2={pT+cH} stroke="#3d3d4f" strokeWidth={1}/>
      {data.map((d,i)=>{
        const bH=maxVal>0?(d.value/maxVal)*cH:0;
        const x=pL+i*slot+(slot-bW)/2;
        const y=pT+cH-bH;
        return <g key={d.source}>
          <rect x={x} y={bH>0?y:pT+cH-2} width={bW} height={bH>0?bH:2} fill={d.color} rx={4} opacity={0.85}/>
          {bH>0&&<text x={x+bW/2} y={y-5} textAnchor="middle" fill={d.color} fontSize={9} fontWeight="bold">{fmt(d.value)}</text>}
          <text x={x+bW/2} y={pT+cH+15} textAnchor="middle" fill="#94a3b8" fontSize={10}>{d.source}</text>
        </g>;
      })}
    </svg>
  );
}

function HPPieChart({won,pending,total}){
  if(total<=0)return <div style={{textAlign:'center',color:'#64748b',padding:'30px 0',fontSize:13}}>No data for selected period</div>;
  const cx=100,cy=100,r=82,ir=44;
  function arcPath(startA,pct,color){
    if(pct<=0)return null;
    if(pct>=0.9999)return <circle cx={cx} cy={cy} r={r} fill={color} opacity={0.85} key={color}/>;
    const endA=startA+pct*2*Math.PI;
    const s=startA-Math.PI/2,e=endA-Math.PI/2;
    const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s);
    const x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
    const large=pct>0.5?1:0;
    return <path d={`M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`} fill={color} opacity={0.85} stroke="#1a1a2e" strokeWidth={2} key={color}/>;
  }
  const wonPct=won/total,pendPct=pending/total;
  let a=0;
  const paths=[{pct:wonPct,color:'#22c55e'},{pct:pendPct,color:'#f43f5e'}].map(s=>{const p=arcPath(a,s.pct,s.color);a+=s.pct*2*Math.PI;return p;});
  const tf=total>=1000?`$${(total/1000).toFixed(1)}k`:`$${Math.round(total)}`;
  return(
    <svg width="200" height="200" viewBox="0 0 200 200">
      {paths}
      <circle cx={cx} cy={cy} r={ir} fill="#13131f"/>
      <text x={cx} y={cy-5} textAnchor="middle" fill="#e2e8f0" fontSize={13} fontWeight="bold">{tf}</text>
      <text x={cx} y={cy+11} textAnchor="middle" fill="#64748b" fontSize={9}>Total Sales</text>
    </svg>
  );
}

    const cr=c.createdAt?c.createdAt.slice(0,10):null;
    const cm=cr?cr.slice(0,7):currentMonth;
    if(dateMode==="thisMonth")return cm===thisMonthStr;
    if(dateMode==="lastMonth")return cm===lastMonthStr;
    if(dateMode==="thisYear")return cr?cr.startsWith(String(thisYear)):(String(thisYear)===currentMonth.slice(0,4));
    if(dateMode==="custom"){if(!cr)return false;return cr>=(customFrom||"0000-01-01")&&cr<=(customTo||"9999-12-31");}
    return true;
  }),[contacts,dateMode,customFrom,customTo,thisMonthStr,lastMonthStr,thisYear,currentMonth]);

  const barData=useMemo(()=>HP_SOURCES.map(src=>{
    let v=0;
    if(confirmedSales)v+=dated.filter(c=>c.source===src&&c.stage==="Won").reduce((s,c)=>s+(c.saleValue||0),0);
    if(unconfirmedSales)v+=dated.filter(c=>c.source===src&&c.stage!=="Won"&&c.stage!=="Loss").reduce((s,c)=>s+(c.saleValue||0),0);
    const wonLeads=dated.filter(c=>c.source===src&&c.stage==="Won").length;
    const totalLeads=dated.filter(c=>c.source===src).length;
    const pct=totalLeads>0?Math.round(wonLeads/totalLeads*100):0;
    return{source:src,value:v,color:HP_COLORS[src],wonLeads,totalLeads,pct};
  }),[dated,confirmedSales,unconfirmedSales]);

  const pie=useMemo(()=>{
    const won=dated.filter(c=>c.stage==="Won").reduce((s,c)=>s+(c.saleValue||0),0);
    const total=dated.reduce((s,c)=>s+(c.saleValue||0),0);
    return{total,won,pending:total-won};
  },[dated]);

  const DATE_BTNS=[{k:"thisMonth",l:"This Month"},{k:"lastMonth",l:"Last Month"},{k:"thisYear",l:"This Year"},{k:"custom",l:"Custom Date"}];

  return(
    <div style={{position:"fixed",inset:0,background:"#000c",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center"}}
      onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:"#1a1a2e",border:"1px solid #2d2d3f",borderRadius:20,width:"92vw",maxWidth:1100,maxHeight:"90vh",overflowY:"auto",padding:"24px 28px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <span style={{fontWeight:800,fontSize:18,color:"#e2e8f0"}}>📊 Pipeline Insights</span>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#64748b",fontSize:22,cursor:"pointer"}}>✕</button>
        </div>
        {/* Filters */}
        <div style={{background:"#13131f",border:"1px solid #2d2d3f",borderRadius:14,padding:"14px 16px",marginBottom:20}}>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",marginBottom:14}}>
            <span style={{fontSize:12,color:"#64748b",fontWeight:700,marginRight:2}}>Period:</span>
            {DATE_BTNS.map(b=>(
              <button key={b.k} onClick={()=>setDateMode(b.k)}
                style={{background:dateMode===b.k?"#6366f1":"#2d2d3f",color:dateMode===b.k?"#fff":"#94a3b8",border:"none",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:12,fontWeight:600,transition:"all .15s"}}>
                {b.l}
              </button>
            ))}
            {dateMode==="custom"&&(
              <div style={{display:"flex",gap:8,alignItems:"center",marginLeft:4}}>
                <input type="date" value={customFrom} onChange={e=>setCustomFrom(e.target.value)} style={{...IS,width:138,fontSize:11,colorScheme:"dark"}}/>
                <span style={{color:"#64748b",fontSize:13}}>→</span>
                <input type="date" value={customTo} onChange={e=>setCustomTo(e.target.value)} style={{...IS,width:138,fontSize:11,colorScheme:"dark"}}/>
              </div>
            )}
          </div>
          <div style={{display:"flex",gap:24,flexWrap:"wrap"}}>
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",userSelect:"none"}}>
              <input type="checkbox" checked={confirmedSales} onChange={e=>setConfirmedSales(e.target.checked)} style={{width:15,height:15,accentColor:"#22c55e",cursor:"pointer"}}/>
              <span style={{color:"#22c55e",fontWeight:600,fontSize:13}}>Confirmed Sales</span>
              <span style={{fontSize:11,color:"#64748b"}}>— reads from Won cards</span>
            </label>
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",userSelect:"none"}}>
              <input type="checkbox" checked={unconfirmedSales} onChange={e=>setUnconfirmedSales(e.target.checked)} style={{width:15,height:15,accentColor:"#f59e0b",cursor:"pointer"}}/>
              <span style={{color:"#f59e0b",fontWeight:600,fontSize:13}}>Pending Sales</span>
              <span style={{fontSize:11,color:"#64748b"}}>— reads from active pipeline</span>
            </label>
          </div>
        </div>
        {/* Charts */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 340px",gap:16}}>
          <div style={{background:"#13131f",border:"1px solid #2d2d3f",borderRadius:14,padding:"16px 20px"}}>
            <div style={{fontWeight:700,color:"#e2e8f0",marginBottom:12,fontSize:14}}>📊 Total Sales by Source</div>
            <HPBarChart data={barData}/>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:10,paddingTop:10,borderTop:"1px solid #2d2d3f"}}>
              {barData.map(d=>(
                <div key={d.source} style={{display:"flex",alignItems:"center",gap:5}}>
                  <div style={{width:9,height:9,borderRadius:2,background:d.color}}/>
                  <span style={{fontSize:11,color:"#94a3b8"}}>{d.source}: <strong style={{color:d.color}}>{d.pct}%</strong> <span style={{fontSize:10,color:"#64748b"}}>({d.wonLeads}/{d.totalLeads} leads)</span></span>
                </div>
              ))}
            </div>
          </div>
          <div style={{background:"#13131f",border:"1px solid #2d2d3f",borderRadius:14,padding:"16px 20px",display:"flex",flexDirection:"column",alignItems:"center"}}>
            <div style={{fontWeight:700,color:"#e2e8f0",marginBottom:12,fontSize:14,alignSelf:"flex-start"}}>🥧 Revenue Breakdown</div>
            <HPPieChart won={pie.won} pending={pie.pending} total={pie.total}/>
            <div style={{width:"100%",display:"flex",flexDirection:"column",gap:8,marginTop:12}}>
              {[{l:"Total Sales",v:pie.total,c:"#e2e8f0"},{l:"Revenue (Won)",v:pie.won,c:"#22c55e"},{l:"Pending Sales",v:pie.pending,c:"#f43f5e"}].map(item=>(
                <div key={item.l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0d0d17",borderRadius:8,padding:"7px 11px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:7}}>
                    <div style={{width:9,height:9,borderRadius:"50%",background:item.c,flexShrink:0}}/>
                    <span style={{fontSize:12,color:"#94a3b8"}}>{item.l}</span>
                  </div>
                  <span style={{fontWeight:700,fontSize:14,color:item.c}}>${item.v.toLocaleString(undefined,{maximumFractionDigits:0})}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function HotPipelineGate(){
  const [contacts,setContacts]=useState([]); const [loading,setLoading]=useState(true);
  const [dragId,setDragId]=useState(null); const [dragOver,setDragOver]=useState(null);
  const [addModal,setAddModal]=useState(null); const [editModal,setEditModal]=useState(null); const [showInsight,setShowInsight]=useState(false);
  const currentMonth=useMemo(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;},[]);
  const [selectedMonth,setSelectedMonth]=useState(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;});

  useEffect(()=>{ setLoading(true); sbGetAll("hot_pipeline").then(data=>{ if(Array.isArray(data))setContacts(data.map(rowToHP)); setLoading(false); }).catch(()=>setLoading(false)); },[]);

  const availableMonths=useMemo(()=>{ const s=new Set(contacts.map(c=>c.createdAt?c.createdAt.slice(0,7):currentMonth)); s.add(currentMonth); return [...s].sort().reverse(); },[contacts,currentMonth]);
  const filteredContacts=useMemo(()=>{
    if(selectedMonth===currentMonth){
      return contacts.filter(c=>{
        // Won and Loss reset each month — only show contacts added in the current month
        if(c.stage==="Won"||c.stage==="Loss"){
          return (c.createdAt?c.createdAt.slice(0,7):currentMonth)===currentMonth;
        }
        // All active stages carry forward into the new month
        return true;
      });
    }
    return contacts.filter(c=>(c.createdAt?c.createdAt.slice(0,7):currentMonth)===selectedMonth);
  },[contacts,selectedMonth,currentMonth]);

  const byStage=useMemo(()=>{ const m={}; HP_STAGES.forEach(s=>m[s]=filteredContacts.filter(c=>c.stage===s)); return m; },[filteredContacts]);

  const stats=useMemo(()=>{
    const result={};
    HP_SOURCES.forEach(src=>{ result[src]=filteredContacts.filter(c=>c.source===src&&c.stage==="Won").reduce((s,c)=>s+(c.saleValue||0),0); });
    result.total=filteredContacts.reduce((s,c)=>s+(c.saleValue||0),0);
    result.won=filteredContacts.filter(c=>c.stage==="Won").reduce((s,c)=>s+(c.saleValue||0),0);
    return result;
  },[filteredContacts]);

  const lastMonth=useMemo(()=>{const[y,m]=selectedMonth.split('-').map(Number);const lm=m===1?12:m-1;const ly=m===1?y-1:y;return `${ly}-${String(lm).padStart(2,'0')}`;},[selectedMonth]);
  const lastMonthTotal=useMemo(()=>contacts.filter(c=>(c.createdAt?c.createdAt.slice(0,7):currentMonth)===lastMonth).reduce((s,c)=>s+(c.saleValue||0),0),[contacts,lastMonth,currentMonth]);
  const thisMonthTotal=useMemo(()=>contacts.filter(c=>(c.createdAt?c.createdAt.slice(0,7):currentMonth)===selectedMonth).reduce((s,c)=>s+(c.saleValue||0),0),[contacts,selectedMonth,currentMonth]);

  const onDragStart=useCallback((e,id)=>{setDragId(id);e.dataTransfer.effectAllowed="move";},[]);
  const onDragOver=useCallback(stage=>setDragOver(stage),[]);
  const onDragLeave=useCallback(()=>setDragOver(null),[]);

  const updateContact=useCallback(async(id,patch)=>{ const c=contacts.find(x=>x.id===id); if(!c)return; const res=await sbUpdate("hot_pipeline",id,hpToRow({...c,...patch})); if(Array.isArray(res)&&res[0])setContacts(p=>p.map(x=>x.id===id?rowToHP(res[0]):x)); },[contacts]);

  const onDrop=useCallback((e,stage)=>{ e.preventDefault();setDragOver(null); if(dragId==null)return; const c=contacts.find(x=>x.id===dragId); if(!c||c.stage===stage){setDragId(null);return;} updateContact(dragId,{stage}); setDragId(null); },[dragId,contacts,updateContact]);

  async function addContact(form){
    try {
      const row = hpToRow(form);
      if(selectedMonth !== currentMonth) row.created_at = `${selectedMonth}-01T00:00:00Z`;
      const res = await sbInsert("hot_pipeline", row);
      if(Array.isArray(res) && res[0]) {
        setContacts(p => [...p, rowToHP(res[0])]);
      }
    } catch(e) { console.error("Insert error:", e); }
  }
  async function saveContact(form){
    try {
      const res = await sbUpdate("hot_pipeline", form.id, hpToRow(form));
      if(Array.isArray(res) && res[0]) {
        setContacts(p => p.map(x => x.id===form.id ? rowToHP(res[0]) : x));
      }
    } catch(e) { console.error("Update error:", e); }
    setEditModal(null);
  }
  async function deleteContact(id){
    await sbDelete("hot_pipeline", id);
    setContacts(p => p.filter(x => x.id!==id));
    setEditModal(null);
  }

  if(loading)return <Spinner text="Loading Hot Pipeline..."/>;

  const isCurrentMonth=selectedMonth===currentMonth;

  const STAT_BOXES=[
    {label:"Fiverr Sales",val:stats["Fiverr"]||0,c:"#1dbf73"},
    {label:"Upwork Sales",val:stats["Upwork"]||0,c:"#6fda44"},
    {label:"LinkedIn Sales",val:stats["LinkedIn"]||0,c:"#0a66c2"},
    {label:"Email Sales",val:stats["Email"]||0,c:"#f59e0b"},
    {label:"WhatsApp",val:stats["WhatsApp"]||0,c:"#25d366"},
    {label:"Calling Sales",val:stats["Calling"]||0,c:"#a855f7"},
    {label:"Total Sales",val:stats.total||0,c:"#f97316"},
    {label:"Pending Revenue",val:(stats.total||0)-(stats.won||0),c:"#f43f5e"},
    {label:"Monthly Sales",lastVal:lastMonthTotal,thisVal:thisMonthTotal,compare:true},
    {label:"Revenue (Won)",val:stats.won||0,c:"#22c55e"},
  ];

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Month selector + Stat boxes */}
      <div style={{background:"#13131f",borderBottom:"1px solid #2d2d3f",padding:"8px 16px",display:"flex",flexDirection:"column",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <MonthPicker selectedMonth={selectedMonth} currentMonth={currentMonth} availableMonths={availableMonths} onChange={setSelectedMonth}/>
          {!isCurrentMonth&&<span style={{background:"#6366f122",color:"#818cf8",border:"1px solid #6366f144",borderRadius:8,padding:"4px 12px",fontSize:11,fontWeight:700}}>📅 Past Month</span>}
          <button onClick={()=>setShowInsight(true)} style={{background:"#818cf822",color:"#818cf8",border:"1px solid #818cf844",borderRadius:8,padding:"5px 14px",cursor:"pointer",fontSize:12,fontWeight:700}}>📊 Insight</button>
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          {STAT_BOXES.map(s=> s.compare ? (
            <div key={s.label} style={{background:"#13131f",border:"1px solid #2d2d3f",borderRadius:10,padding:"8px 14px",display:"flex",flexDirection:"column",gap:5,minWidth:160}}>
              <div style={{fontSize:10,color:"#64748b",fontWeight:700,marginBottom:1}}>Monthly Sales</div>
              <div onClick={()=>setSelectedMonth(lastMonth)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,cursor:"pointer",borderRadius:6,padding:"2px 4px",margin:"0 -4px",transition:"background .15s"}}
                onMouseEnter={e=>e.currentTarget.style.background="#818cf815"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <span style={{fontSize:11,color:"#818cf8",fontWeight:600}}>↩ Last Month</span>
                <span style={{fontWeight:800,fontSize:14,color:"#818cf8"}}>${s.lastVal.toLocaleString(undefined,{maximumFractionDigits:0})}</span>
              </div>
              <div style={{height:1,background:"#2d2d3f"}}/>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                <span style={{fontSize:11,color:"#34d399",fontWeight:600}}>This Month</span>
                <span style={{fontWeight:800,fontSize:14,color:"#34d399"}}>${s.thisVal.toLocaleString(undefined,{maximumFractionDigits:0})}</span>
              </div>
              {selectedMonth!==currentMonth&&<button onClick={()=>setSelectedMonth(currentMonth)} style={{width:"100%",background:"#ffffff",color:"#0f172a",border:"none",borderRadius:6,padding:"4px 0",cursor:"pointer",fontSize:10,fontWeight:500,marginTop:2}}>Go to Present →</button>}
            </div>
          ) : s.label==="Revenue (Won)" ? (
            <div key={s.label} style={{background:`linear-gradient(135deg,${s.c}22,${s.c}08)`,border:`2px solid ${s.c}`,borderRadius:14,padding:"12px 22px",display:"flex",flexDirection:"column",gap:4,minWidth:160,boxShadow:`0 0 18px ${s.c}55`,position:"relative"}}>
              <div style={{fontWeight:900,fontSize:26,color:s.c,lineHeight:1}}>${s.val.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
              <div style={{fontSize:12,color:s.c,fontWeight:700,opacity:.85}}>{s.label}</div>
            </div>
          ) : (
            <div key={s.label} style={{background:s.c+"12",border:`1px solid ${s.c}33`,borderRadius:10,padding:"8px 14px",display:"flex",flexDirection:"column",gap:2,minWidth:110}}>
              <div style={{fontWeight:800,fontSize:16,color:s.c}}>${s.val.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
              <div style={{fontSize:10,color:"#64748b"}}>{s.label}</div>
            </div>
          ))}
        </div>
      </div>
      {/* Kanban */}
      <div style={{flex:1,overflow:"auto",padding:"12px"}}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start",height:"100%"}}>
          {HP_STAGES.map(stage=>(
            <HPKanbanCol key={stage} stage={stage} contacts={byStage[stage]||[]}
              onDragStart={onDragStart} onDrop={onDrop} onDragOver={onDragOver} onDragLeave={onDragLeave}
              onClick={c=>setEditModal(c)} isDragOver={dragOver===stage}
              onAdd={stage=>setAddModal(stage)} selectedMonth={selectedMonth}
            />
          ))}
        </div>
      </div>
      {/* Add Modal */}
      {addModal&&<HPAddModal defaultStage={addModal} onClose={()=>setAddModal(null)} onSave={addContact}/>}
      {/* Edit Modal */}
      {editModal&&(
        <Modal title={`✏️ Edit — ${editModal.firstName} ${editModal.lastName}`} onClose={()=>setEditModal(null)}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
            <Inp label="First Name" value={editModal.firstName} onChange={e=>setEditModal(p=>({...p,firstName:e.target.value}))}/>
            <Inp label="Last Name" value={editModal.lastName} onChange={e=>setEditModal(p=>({...p,lastName:e.target.value}))}/>
          </div>
          <Inp label="Account Name" value={editModal.accountName||""} onChange={e=>setEditModal(p=>({...p,accountName:e.target.value}))} placeholder="Company or account name..."/>
          <Inp label="Email" value={editModal.email} onChange={e=>setEditModal(p=>({...p,email:e.target.value}))}/>
          <Inp label="Industry" value={editModal.industry} onChange={e=>setEditModal(p=>({...p,industry:e.target.value}))}/>
          <Sel label="Source (Origin — permanent)" value={editModal.source} onChange={e=>setEditModal(p=>({...p,source:e.target.value}))}>
            {HP_SOURCES.map(s=><option key={s}>{s}</option>)}
          </Sel>
          <Sel label="Stage" value={editModal.stage} onChange={e=>setEditModal(p=>({...p,stage:e.target.value}))}>
            {HP_STAGES.map(s=><option key={s}>{s}</option>)}
          </Sel>
          <div style={{marginBottom:12}}>
            <label style={{display:"block",fontSize:12,color:"#94a3b8",marginBottom:4,fontWeight:600}}>Sale Value ($)</label>
            <div style={{position:"relative"}}><span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",color:"#64748b",fontWeight:700}}>$</span><input type="number" min="0" step="0.01" value={editModal.saleValue||""} onChange={e=>setEditModal(p=>({...p,saleValue:parseFloat(e.target.value)||0}))} placeholder="0.00" style={{...IS,paddingLeft:26}}/></div>
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"space-between",marginTop:10}}>
            <Btn variant="danger" onClick={()=>deleteContact(editModal.id)}>Delete</Btn>
            <div style={{display:"flex",gap:8}}><Btn variant="ghost" onClick={()=>setEditModal(null)}>Cancel</Btn><Btn onClick={()=>saveContact(editModal)}>Save</Btn></div>
          </div>
        </Modal>
      )}
      {showInsight&&<HPInsightModal contacts={contacts} onClose={()=>setShowInsight(false)} currentMonth={currentMonth}/>}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// ── ROOT APP ──────────────────────────────────────────────────────────────────
// ══════════════════════════════════════════════════════════════════════════════
function App(){
  const [unlocked,setUnlocked]=useState(false);
  const [gate,setGate]=useState("linkedin");

  if(!unlocked){
    return <PasswordScreen onUnlock={()=>setUnlocked(true)}/>;
  }

  return (
    <div style={{display:"flex",height:"100vh",background:"#0d0d17",overflow:"hidden"}}>
      {/* Left Sidebar */}
      <div style={{width:180,background:"#13131f",borderRight:"1px solid #2d2d3f",display:"flex",flexDirection:"column",alignItems:"center",padding:"24px 12px",gap:12,flexShrink:0}}>
        <div style={{background:"#6366f1",borderRadius:12,width:42,height:42,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,marginBottom:8}}>🚀</div>
        <div style={{fontWeight:800,fontSize:13,color:"#e2e8f0",marginBottom:16,textAlign:"center"}}>AffiLinks.io</div>
        {/* Gate buttons */}
        <button onClick={()=>setGate("linkedin")}
          style={{width:"100%",background:gate==="linkedin"?"#6366f1":"#1e1e2e",color:gate==="linkedin"?"#fff":"#64748b",border:`1px solid ${gate==="linkedin"?"#6366f1":"#2d2d3f"}`,borderRadius:12,padding:"14px 8px",cursor:"pointer",fontWeight:700,fontSize:12,transition:"all .2s",textAlign:"center"}}>
          <div style={{fontSize:22,marginBottom:6}}>💼</div>
          LinkedIn CRM
        </button>
        <button onClick={()=>setGate("hotpipeline")}
          style={{width:"100%",background:gate==="hotpipeline"?"#f59e0b":"#1e1e2e",color:gate==="hotpipeline"?"#fff":"#64748b",border:`1px solid ${gate==="hotpipeline"?"#f59e0b":"#2d2d3f"}`,borderRadius:12,padding:"14px 8px",cursor:"pointer",fontWeight:700,fontSize:12,transition:"all .2s",textAlign:"center"}}>
          <div style={{fontSize:22,marginBottom:6}}>🔥</div>
          Hot Pipeline
        </button>
        <div style={{marginTop:"auto",fontSize:10,color:"#2d2d3f",textAlign:"center"}}>● Supabase Connected</div>
      </div>
      {/* Right Content */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {/* Top bar */}
        <div style={{background:"#13131f",borderBottom:"1px solid #2d2d3f",padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{fontWeight:700,fontSize:15,color:"#e2e8f0"}}>{gate==="linkedin"?"💼 LinkedIn CRM":"🔥 Hot Pipeline"}</div>
          <div style={{fontSize:12,color:"#22c55e",marginLeft:4}}>● Live</div>
        </div>
        {/* Gate Content */}
        {gate==="linkedin" ? <LinkedInGate/> : <HotPipelineGate/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
