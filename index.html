async function sbGetAll(table) {
  let all = [], from = 0;
  while (true) {
    const r = await fetch(`${SB_URL}/rest/v1/${table}?order=id.asc&offset=${from}&limit=1000`, { headers: HEADERS });
    const data = await r.json();
    if (!Array.isArray(data) || data.length === 0) break;
    all = [...all, ...data];
    if (data.length < 1000) break;
    from += 1000;
  }
  return all;
}
async function sbInsert(table, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, { method:"POST", headers:HEADERS, body:JSON.stringify(data) });
  return r.json();
}
async function sbUpdate(table, id, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, { method:"PATCH", headers:HEADERS, body:JSON.stringify(data) });
  return r.json();
}
async function sbDelete(table, id) {
  await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, { method:"DELETE", headers:HEADERS });
}
async function sbUpsert(table, onConflict, data) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?on_conflict=${onConflict}`, { method:"POST", headers:{...HEADERS,"Prefer":"return=representation,resolution=merge-duplicates"}, body:JSON.stringify(data) });
  return r.json();
}
async function sbGetWhere(table, col, val) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${col}=eq.${encodeURIComponent(val)}&order=date.desc,id.desc&limit=1000`, { headers: HEADERS });

}

function parseCSVLine(line){
  const res=[]; let cur=''; let q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;}else{q=false;} }else cur+=c; }
    else{ if(c==='"'){q=true;}else if(c===','){res.push(cur.trim());cur='';}else cur+=c; }
  }
  res.push(cur.trim());
  return res;
}
function parseCSV(text) {

  const headers=parseCSVLine(lines[0]).map(h=>h.toLowerCase().replace(/\s+/g,"").replace(/[^a-z]/g,""));

}

function TagPill({tag,allTags,onRemove,small}){ const info=allTags.find(t=>t.name===tag)||{color:"rgba(174,220,255,0.55)"}; return <span style={{background:info.color+"22",color:info.color,border:`1px solid ${info.color}44`,borderRadius:20,padding:small?"1px 7px":"2px 9px",fontSize:small?10:11,fontWeight:600,display:"inline-flex",alignItems:"center",gap:4}}>{tag}{onRemove&&<span onClick={onRemove} style={{cursor:"pointer",opacity:.7}}>×</span>}</span>; }
function TagSelector({selected,allTags,onChange}){
  const [input,setInput]=useState(""); const safe=selected||[];
  function add(name){ name=name.trim().toLowerCase().replace(/\s+/g,"-"); if(!name||safe.includes(name))return; onChange([...safe,name]); setInput(""); }
  return (
    <div style={{marginBottom:12}}>
      <label style={{display:"block",fontSize:12,color:"rgba(174,220,255,0.38)",marginBottom:6,fontWeight:600}}>Tags</label>
      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:6}}>{safe.map(t=><TagPill key={t} tag={t} allTags={allTags} onRemove={()=>onChange(safe.filter(x=>x!==t))}/>)}</div>
      <div style={{display:"flex",gap:6}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add(input)} placeholder="Type tag + Enter..." style={{...IS,flex:1,fontSize:12}}/>
        <button onClick={()=>add(input)} style={{background:"#23a1dd",color:"#fff",border:"none",borderRadius:8,padding:"8px 12px",cursor:"pointer",fontWeight:600}}>+</button>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:6}}>{allTags.filter(t=>!safe.includes(t.name)).map(t=><span key={t.name} onClick={()=>add(t.name)} style={{background:t.color+"22",color:t.color,border:`1px solid ${t.color}44`,borderRadius:20,padding:"1px 9px",fontSize:11,cursor:"pointer"}}>+ {t.name}</span>)}</div>
    </div>
  );
}

function LinkedInGate({search="",setSearch=()=>{},onRevenue=()=>{}}){
  const [leads,setLeads]=useState([]); const [templates,setTemplates]=useState([]); const [allTags,setAllTags]=useState(DEFAULT_TAGS); const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState("Kanban"); const [modal,setModal]=useState(null); const [dragId,setDragId]=useState(null); const [dragOver,setDragOver]=useState(null);
  const [fuPending,setFuPending]=useState(null); const [wonPending,setWonPending]=useState(null); const [lostPending,setLostPending]=useState(null); const [reviewPending,setReviewPending]=useState(null);
  const [saving,setSaving]=useState(false); const [showUpload,setShowUpload]=useState(false); const [showSNUpload,setShowSNUpload]=useState(false); const [stageTab,setStageTab]=useState("All");
  const today=todayStr();

  useEffect(()=>{ setLoading(true); Promise.all([sbGetAll("leads"),sbGetAll("templates")]).then(([l,t])=>{ if(Array.isArray(l))setLeads(l.map(rowToLead)); if(Array.isArray(t))setTemplates(t); setLoading(false); }).catch(()=>setLoading(false)); },[]);
  useEffect(()=>{ if(!leads.length)return; const used=[...new Set(leads.flatMap(l=>l.tags||[]))]; setAllTags(prev=>{ const next=[...prev]; let ch=false; used.forEach(n=>{ if(!next.find(t=>t.name===n)){next.push({name:n,color:TAG_COLORS[next.length%TAG_COLORS.length]});ch=true;} }); return ch?next:prev; }); },[leads]);

  const stageCounts=useMemo(()=>{ const m={All:leads.length}; LI_STAGES.forEach(s=>m[s]=leads.filter(l=>l.stage===s).length); return m; },[leads]);
  const filtered=useMemo(()=>{ const q=search.toLowerCase(); return leads.filter(l=>(stageTab==="All"||l.stage===stageTab)&&(!q||[l.firstName,l.lastName,l.industry,l.affiliateNetwork].join(" ").toLowerCase().includes(q))); },[leads,search,stageTab]);
  const byStage=useMemo(()=>{ const m={}; LI_STAGES.forEach(s=>m[s]=filtered.filter(l=>l.stage===s)); return m; },[filtered]);
  const stats=useMemo(()=>{ const won=leads.filter(l=>l.stage==="Won"); return{total:leads.length,won:won.length,lost:leads.filter(l=>l.stage==="Lost").length,active:leads.filter(l=>!["Won","Lost"].includes(l.stage)).length,revenue:won.reduce((s,l)=>s+(parseFloat(l.deal?.dealAmount)||0),0)}; },[leads]);
  useEffect(()=>{ onRevenue({val:stats.revenue,label:"Revenue Won",color:"#36f2af"}); },[stats.revenue]);
  const overdueLeads=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date&&l.followUp.date<today),[leads,today]);
  const todayLeads=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date===today),[leads,today]);
  const upcomingLeads=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date&&l.followUp.date>today&&l.followUp.date<=addDays(7)),[leads,today]);
  const reminderCount=overdueLeads.length+todayLeads.length;

  const onDragStart=useCallback((e,id)=>{setDragId(id);e.dataTransfer.effectAllowed="move";},[]);
  const onDragOver=useCallback(stage=>setDragOver(stage),[]);
  const onDragLeave=useCallback(()=>setDragOver(null),[]);
  const updateLead=useCallback(async(id,patch)=>{ const lead=leads.find(l=>l.id===id); if(!lead)return; const res=await sbUpdate("leads",id,leadToRow({...lead,...patch})); if(Array.isArray(res)&&res[0])setLeads(p=>p.map(l=>l.id===id?rowToLead(res[0]):l)); },[leads]);
  const onDrop=useCallback((e,stage)=>{ e.preventDefault();setDragOver(null); if(dragId==null)return; const lead=leads.find(l=>l.id===dragId); if(!lead||lead.stage===stage){setDragId(null);return;} if(stage==="Follow Up")setFuPending(lead); else if(stage==="Won")setWonPending(lead); else if(stage==="Lost")setLostPending(lead); else updateLead(dragId,{stage}); setDragId(null); },[dragId,leads,updateLead]);

  async function saveLead(form){ setSaving(true); const row=leadToRow(form); if(form.id){const res=await sbUpdate("leads",form.id,row);if(Array.isArray(res)&&res[0])setLeads(p=>p.map(l=>l.id===form.id?rowToLead(res[0]):l));}else{const res=await sbInsert("leads",row);if(Array.isArray(res)&&res[0])setLeads(p=>[...p,rowToLead(res[0])]);} setSaving(false);setModal(null); }
  async function deleteLead(id){ await sbDelete("leads",id);setLeads(p=>p.filter(l=>l.id!==id));setModal(null); }
  async function saveTemplate(form){ if(form.id){const res=await sbUpdate("templates",form.id,{name:form.name,body:form.body});if(Array.isArray(res)&&res[0])setTemplates(p=>p.map(t=>t.id===form.id?res[0]:t));}else{const res=await sbInsert("templates",{name:form.name,body:form.body});if(Array.isArray(res)&&res[0])setTemplates(p=>[...p,res[0]]);} }
  async function deleteTemplate(id){ await sbDelete("templates",id);setTemplates(p=>p.filter(t=>t.id!==id)); }
  function saveFU(date,notes){ if(!fuPending)return; const lead=fuPending; const nh=[...(lead.followUpHistory||[]),{date:lead.followUp?.date||date,notes:lead.followUp?.notes||"",attempt:(lead.followUpHistory||[]).length+1}]; updateLead(lead.id,{stage:"Follow Up",followUp:{date,notes},followUpHistory:nh});setFuPending(null); }
  async function saveWon({closingDate,dealAmount,clientContract}){ if(!wonPending)return;updateLead(wonPending.id,{stage:"Won",deal:{closingDate,dealAmount,clientContract}});await sbInsert("hot_pipeline",hpToRow({firstName:wonPending.firstName,lastName:wonPending.lastName,linkedinUrl:wonPending.linkedinUrl,website:wonPending.website,industry:wonPending.industry,email:wonPending.email,accountName:wonPending.affiliateNetwork||"",source:"LinkedIn",stage:"LinkedIn",saleValue:parseFloat(dealAmount)||0,tags:wonPending.tags||[],followUp:null,deal:null,followUpHistory:[]}));setWonPending(null); }
  async function importLeads(rows){ const ins=[],sk=[]; for(const row of rows){ const dup=leads.some(l=>(row.email&&l.email&&l.email.toLowerCase()===row.email.toLowerCase())||(l.firstName?.toLowerCase()===row.firstName?.toLowerCase()&&l.lastName?.toLowerCase()===row.lastName?.toLowerCase())); if(dup){sk.push(row);continue;} const res=await sbInsert("leads",leadToRow(row)); if(Array.isArray(res)&&res[0])ins.push(rowToLead(res[0])); } if(ins.length)setLeads(p=>[...p,...ins]);setShowUpload(false);setShowSNUpload(false);alert(`✅ ${ins.length} imported\n⚠️ ${sk.length} duplicates skipped`); }

  if(loading)return <Spinner text="Loading LinkedIn CRM..."/>;

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Stage filter tabs + toolbar */}
      <div style={{background:"rgba(6,14,28,0.6)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",gap:0,overflowX:"auto"}}>
          {["All",...LI_STAGES].map(s=>(
            <button key={s} onClick={()=>setStageTab(s)}
              style={{background:"none",color:stageTab===s?"#04bee7":"rgba(174,220,255,0.5)",border:"none",borderBottom:stageTab===s?"2px solid #23a1dd":"2px solid transparent",padding:"12px 13px",cursor:"pointer",fontWeight:stageTab===s?600:500,fontSize:13,transition:"all .15s",marginBottom:-1,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}>
              {s}
              <span style={{background:stageTab===s?"#eef2ff":"#f1f5f9",color:stageTab===s?"#23a1dd":"#94a3b8",borderRadius:20,padding:"1px 7px",fontSize:11,fontWeight:600}}>{stageCounts[s]||0}</span>
            </button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0,paddingLeft:10}}>
          <div style={{position:"relative"}}>
            <button onClick={()=>setShowUpload(v=>!v)} style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:8,width:32,height:32,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,position:"relative"}}>🔔{reminderCount>0&&<span style={{position:"absolute",top:-3,right:-3,background:"#ef4444",color:"#fff",borderRadius:"50%",width:15,height:15,fontSize:8,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>{reminderCount}</span>}</button>
          </div>
          <button onClick={()=>setShowUpload(true)} style={{background:"rgba(255,255,255,0.04)",color:"rgba(174,220,255,0.55)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>📥 Import</button>
          <button onClick={()=>setShowSNUpload(true)} style={{background:"rgba(1,217,221,0.08)",color:"#01d9dd",border:"1px solid rgba(1,217,221,0.25)",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>🔍 SN Import</button>
          <button onClick={()=>setModal({stage:"Cold",tags:[],followUpHistory:[]})} style={{background:"#23a1dd",color:"#fff",border:"none",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:11,fontWeight:600}}>+ Add</button>
          <button onClick={()=>exportCSV(leads)} style={{background:"rgba(54,242,175,0.08)",color:"#36f2af",border:"1px solid rgba(54,242,175,0.2)",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>⬇ Export</button>
        </div>
      </div>
      {/* Stat boxes */}
      <div style={{background:"rgba(255,255,255,0.05)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"10px 20px",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        {[
          {label:"Total Leads",val:stats.total,c:"#23a1dd"},
          {label:"Active",val:stats.active,c:"#23a1dd"},
          {label:"Follow Up",val:stageCounts["Follow Up"]||0,c:"#a855f7"},

        ].map(s=>(
          <div key={s.label} style={{background:"rgba(255,255,255,0.04)",backdropFilter:"blur(10px)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"8px 14px",display:"flex",flexDirection:"column",gap:2,minWidth:100,boxShadow:"0 4px 16px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05)"}}>

function HPAddModal({onClose,onSave,defaultStage}){
  const [form,setForm]=useState({firstName:"",lastName:"",email:"",accountName:"",linkedinUrl:"",website:"",industry:"",stage:defaultStage||"Fiverr",source:defaultStage&&HP_SOURCES.includes(defaultStage)?defaultStage:"Fiverr",saleValue:0,tags:[],followUp:null,deal:null,followUpHistory:[]});
  const [saving,setSaving]=useState(false);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  async function submit(){
    if(!form.firstName){return;}
    setSaving(true);
    await onSave(form);
    setSaving(false);
    onClose();
  }
  return (
    <Modal title="➕ Add Contact — Hot Pipeline" onClose={onClose}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
        <Inp label="First Name *" value={form.firstName} onChange={e=>f("firstName",e.target.value)}/>
        <Inp label="Last Name" value={form.lastName} onChange={e=>f("lastName",e.target.value)}/>
      </div>
      <Inp label="Account Name" value={form.accountName} onChange={e=>f("accountName",e.target.value)} placeholder="Company or account name..."/>
      <Inp label="Email" type="email" value={form.email} onChange={e=>f("email",e.target.value)}/>
      <Inp label="LinkedIn URL" value={form.linkedinUrl} onChange={e=>f("linkedinUrl",e.target.value)}/>
      <Inp label="Industry" value={form.industry} onChange={e=>f("industry",e.target.value)}/>
      <Sel label="Source (Origin)" value={form.source} onChange={e=>f("source",e.target.value)}>
        {HP_SOURCES.map(s=><option key={s}>{s}</option>)}
      </Sel>
      <Sel label="Stage" value={form.stage} onChange={e=>f("stage",e.target.value)}>
        {HP_STAGES.map(s=><option key={s}>{s}</option>)}
      </Sel>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:12,color:"rgba(174,220,255,0.38)",marginBottom:4,fontWeight:600}}>Sale Value ($)</label>
        <div style={{position:"relative"}}><span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",color:"rgba(174,220,255,0.55)",fontWeight:700}}>$</span><input type="number" min="0" step="0.01" value={form.saleValue||""} onChange={e=>f("saleValue",parseFloat(e.target.value)||0)} placeholder="0.00" style={{...IS,paddingLeft:26}}/></div>
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn onClick={submit} style={{opacity:saving?0.6:1}}>{saving?"Saving...":"Add Contact"}</Btn>
      </div>
    </Modal>
  );
}

  const carryLabel=isCarryOver?new Date(createdMonth+'-15').toLocaleString('default',{month:'short',year:'2-digit'}):null;
  return (
    <div draggable onDragStart={e=>onDragStart(e,contact.id)} onClick={()=>onClick(contact)}
      style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:10,padding:"11px 13px",cursor:"grab",marginBottom:8,userSelect:"none",transition:"border-color .15s",boxShadow:"0 4px 20px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.05)"}}
      onMouseEnter={e=>e.currentTarget.style.borderColor=color+"88"}

        {isCarryOver&&<span style={{background:"rgba(35,161,221,0.12)",color:"#23a1dd",borderRadius:20,padding:"1px 7px",fontSize:9,fontWeight:600,whiteSpace:"nowrap",flexShrink:0,marginLeft:6}}>↩ {carryLabel}</span>}
      </div>
      {contact.accountName&&<div style={{fontSize:11,color:"rgba(200,230,255,0.75)",marginBottom:2}}>🏢 {contact.accountName}</div>}
      {contact.industry&&<div style={{fontSize:11,color:"rgba(174,220,255,0.55)",marginBottom:2}}>📂 {contact.industry}</div>}
      {contact.email&&<div style={{fontSize:11,color:"rgba(174,220,255,0.55)",marginBottom:2}}>✉️ {contact.email}</div>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}>
        <span style={{background:color+"22",color,border:`1px solid ${color}44`,borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>📌 {contact.source}</span>
        {contact.saleValue>0&&<span style={{color:"#36f2af",fontWeight:700,fontSize:12}}>💰 ${Number(contact.saleValue).toLocaleString()}</span>}

        {contact.website&&<a href={contact.website.startsWith("http")?contact.website:"https://"+contact.website} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} style={{background:"rgba(255,255,255,0.04)",color:"rgba(174,220,255,0.55)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:5,padding:"2px 7px",fontSize:10,fontWeight:600}}>Web ↗</a>}
      </div>
    </div>
  );
}

function MonthPicker({selectedMonth,currentMonth,availableMonths,onChange}){
  const [open,setOpen]=useState(false);
  const [viewYear,setViewYear]=useState(()=>parseInt(selectedMonth.split('-')[0]));
  const ref=useRef();
  useEffect(()=>{ function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);} if(open)document.addEventListener('mousedown',h); return()=>document.removeEventListener('mousedown',h); },[open]);
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const curY=parseInt(currentMonth.split('-')[0]); const curM=parseInt(currentMonth.split('-')[1]);
  const selY=parseInt(selectedMonth.split('-')[0]); const selM=parseInt(selectedMonth.split('-')[1]);
  function ym(m){return `${viewYear}-${String(m).padStart(2,'0')}`;}
  function isFuture(m){return viewYear>curY||(viewYear===curY&&m>curM);}
  function isSel(m){return viewYear===selY&&m===selM;}
  function isCur(m){return viewYear===curY&&m===curM;}
  function hasData(m){return availableMonths.includes(ym(m));}
  function fmtLabel(s){const[y,m]=s.split('-');return new Date(parseInt(y),parseInt(m)-1,1).toLocaleString('default',{month:'long',year:'numeric'});}
  return (
    <div ref={ref} style={{position:'relative',display:'inline-block'}}>
      <button onClick={()=>setOpen(v=>!v)}
        style={{background:'rgba(255,255,255,0.06)',backdropFilter:'blur(12px)',color:'#f59e0b',border:'1px solid rgba(245,158,11,0.25)',borderRadius:8,padding:'6px 12px',cursor:'pointer',fontSize:12,fontWeight:600,display:'flex',alignItems:'center',gap:7,whiteSpace:'nowrap'}}>
        📅 {fmtLabel(selectedMonth)} <span style={{fontSize:10,opacity:.6}}>{open?'▲':'▼'}</span>
      </button>
      {open&&(

// ── Insight Charts ────────────────────────────────────────────────────────────
function HPBarChart({data}){
  const maxVal=Math.max(...data.map(d=>d.value),1);
  const W=480,H=220,pL=58,pB=36,pT=24,pR=10;
  const cW=W-pL-pR,cH=H-pT-pB;
  const slot=cW/data.length;
  const bW=Math.max(slot*0.6,22);
  function fmt(v){return v>=1000?`$${(v/1000).toFixed(1)}k`:`$${Math.round(v)}`;}
  return(
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{overflow:'visible'}}>
      {[0,0.25,0.5,0.75,1].map(p=>{
        const y=pT+cH-p*cH;
        return <g key={p}>
          <line x1={pL} y1={y} x2={pL+cW} y2={y} stroke="rgba(255,255,255,0.07)" strokeDasharray="3,3" strokeWidth={0.7}/>
          <text x={pL-5} y={y+4} textAnchor="end" fill="rgba(174,220,255,0.38)" fontSize={9}>{fmt(Math.round(p*maxVal))}</text>
        </g>;
      })}
      <line x1={pL} y1={pT} x2={pL} y2={pT+cH} stroke="rgba(255,255,255,0.1)" strokeWidth={1}/>
      <line x1={pL} y1={pT+cH} x2={pL+cW} y2={pT+cH} stroke="rgba(255,255,255,0.1)" strokeWidth={1}/>
      {data.map((d,i)=>{
        const bH=maxVal>0?(d.value/maxVal)*cH:0;
        const x=pL+i*slot+(slot-bW)/2;
        const y=pT+cH-bH;
        return <g key={d.source}>
          <rect x={x} y={bH>0?y:pT+cH-2} width={bW} height={bH>0?bH:2} fill={d.color} rx={4} opacity={0.85}/>
          {bH>0&&<text x={x+bW/2} y={y-5} textAnchor="middle" fill={d.color} fontSize={9} fontWeight="bold">{fmt(d.value)}</text>}
          <text x={x+bW/2} y={pT+cH+15} textAnchor="middle" fill="rgba(174,220,255,0.5)" fontSize={10}>{d.source}</text>
        </g>;
      })}
    </svg>
  );
}

function HPPieChart({won,pending,total}){
  if(total<=0)return <div style={{textAlign:'center',color:'#64748b',padding:'30px 0',fontSize:13}}>No data for selected period</div>;
  const cx=100,cy=100,r=82,ir=44;
  function arcPath(startA,pct,color){
    if(pct<=0)return null;
    if(pct>=0.9999)return <circle cx={cx} cy={cy} r={r} fill={color} opacity={0.85} key={color}/>;
    const endA=startA+pct*2*Math.PI;
    const s=startA-Math.PI/2,e=endA-Math.PI/2;
    const x1=cx+r*Math.cos(s),y1=cy+r*Math.sin(s);
    const x2=cx+r*Math.cos(e),y2=cy+r*Math.sin(e);
    const large=pct>0.5?1:0;
    return <path d={`M${cx} ${cy} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`} fill={color} opacity={0.85} stroke="#fff" strokeWidth={2} key={color}/>;
  }
  const wonPct=won/total,pendPct=pending/total;
  let a=0;
  const paths=[{pct:wonPct,color:'#36f2af'},{pct:pendPct,color:'#f43f5e'}].map(s=>{const p=arcPath(a,s.pct,s.color);a+=s.pct*2*Math.PI;return p;});
  const tf=total>=1000?`$${(total/1000).toFixed(1)}k`:`$${Math.round(total)}`;
  return(
    <svg width="200" height="200" viewBox="0 0 200 200">
      {paths}
      <circle cx={cx} cy={cy} r={ir} fill="rgba(6,14,28,0.7)"/>
      <text x={cx} y={cy-5} textAnchor="middle" fill="#daeeff" fontSize={13} fontWeight="bold">{tf}</text>
      <text x={cx} y={cy+11} textAnchor="middle" fill="rgba(174,220,255,0.45)" fontSize={9}>Total Sales</text>
    </svg>
  );
}

function HotPipelineGate({search="",setSearch=()=>{},onRevenue=()=>{}}){
  const [contacts,setContacts]=useState([]); const [loading,setLoading]=useState(true);
  const [dragId,setDragId]=useState(null); const [dragOver,setDragOver]=useState(null);
  const [addModal,setAddModal]=useState(null); const [editModal,setEditModal]=useState(null); const [showInsight,setShowInsight]=useState(false);
  const currentMonth=useMemo(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;},[]);
  const [selectedMonth,setSelectedMonth]=useState(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;});

  useEffect(()=>{ setLoading(true); sbGetAll("hot_pipeline").then(data=>{ if(Array.isArray(data))setContacts(data.map(rowToHP)); setLoading(false); }).catch(()=>setLoading(false)); },[]);

  const availableMonths=useMemo(()=>{ const s=new Set(contacts.map(c=>c.createdAt?c.createdAt.slice(0,7):currentMonth)); s.add(currentMonth); return [...s].sort().reverse(); },[contacts,currentMonth]);
  const filteredContacts=useMemo(()=>{
    if(selectedMonth===currentMonth){
      return contacts.filter(c=>{
        // Won and Loss reset each month — only show contacts added in the current month
        if(c.stage==="Won"||c.stage==="Loss"){
          return (c.createdAt?c.createdAt.slice(0,7):currentMonth)===currentMonth;
        }
        // All active stages carry forward into the new month
        return true;
      });
    }
    return contacts.filter(c=>(c.createdAt?c.createdAt.slice(0,7):currentMonth)===selectedMonth);
  },[contacts,selectedMonth,currentMonth]);

  const searchedContacts=useMemo(()=>{
    if(!search.trim())return filteredContacts;
    const q=search.toLowerCase();
    return filteredContacts.filter(c=>[c.firstName,c.lastName,c.email,c.accountName,c.industry,c.source].some(f=>f&&f.toLowerCase().includes(q)));
  },[filteredContacts,search]);
  const byStage=useMemo(()=>{ const m={}; HP_STAGES.forEach(s=>m[s]=searchedContacts.filter(c=>c.stage===s)); return m; },[searchedContacts]);

  const stats=useMemo(()=>{
    const result={};
    HP_SOURCES.forEach(src=>{ result[src]=filteredContacts.filter(c=>c.source===src&&c.stage==="Won").reduce((s,c)=>s+(c.saleValue||0),0); });
    result.total=filteredContacts.reduce((s,c)=>s+(c.saleValue||0),0);
    result.won=filteredContacts.filter(c=>c.stage==="Won").reduce((s,c)=>s+(c.saleValue||0),0);
    return result;
  },[filteredContacts]);
  useEffect(()=>{ onRevenue({val:stats.won||0,label:"Revenue Won",color:"#36f2af"}); },[stats.won]);

  const lastMonth=useMemo(()=>{const[y,m]=selectedMonth.split('-').map(Number);const lm=m===1?12:m-1;const ly=m===1?y-1:y;return `${ly}-${String(lm).padStart(2,'0')}`;},[selectedMonth]);
  const lastMonthTotal=useMemo(()=>contacts.filter(c=>(c.createdAt?c.createdAt.slice(0,7):currentMonth)===lastMonth).reduce((s,c)=>s+(c.saleValue||0),0),[contacts,lastMonth,currentMonth]);
  const thisMonthTotal=useMemo(()=>contacts.filter(c=>(c.createdAt?c.createdAt.slice(0,7):currentMonth)===selectedMonth).reduce((s,c)=>s+(c.saleValue||0),0),[contacts,selectedMonth,currentMonth]);

  const onDragStart=useCallback((e,id)=>{setDragId(id);e.dataTransfer.effectAllowed="move";},[]);
  const onDragOver=useCallback(stage=>setDragOver(stage),[]);
  const onDragLeave=useCallback(()=>setDragOver(null),[]);

  const updateContact=useCallback(async(id,patch)=>{ const c=contacts.find(x=>x.id===id); if(!c)return; const row=hpToRow({...c,...patch}); if(patch.stage==="Won"&&!c.wonAt)row.won_at=new Date().toISOString(); const res=await sbUpdate("hot_pipeline",id,row); if(Array.isArray(res)&&res[0])setContacts(p=>p.map(x=>x.id===id?rowToHP(res[0]):x)); },[contacts]);

  const onDrop=useCallback((e,stage)=>{ e.preventDefault();setDragOver(null); if(dragId==null)return; const c=contacts.find(x=>x.id===dragId); if(!c||c.stage===stage){setDragId(null);return;} updateContact(dragId,{stage}); setDragId(null); },[dragId,contacts,updateContact]);

  async function addContact(form){
    try {
      const row = hpToRow(form);
      if(selectedMonth !== currentMonth) row.created_at = `${selectedMonth}-01T00:00:00Z`;
      const res = await sbInsert("hot_pipeline", row);
      if(Array.isArray(res) && res[0]) {
        setContacts(p => [...p, rowToHP(res[0])]);
      }
    } catch(e) { console.error("Insert error:", e); }
  }
  async function saveContact(form){
    try {
      const res = await sbUpdate("hot_pipeline", form.id, hpToRow(form));
      if(Array.isArray(res) && res[0]) {
        setContacts(p => p.map(x => x.id===form.id ? rowToHP(res[0]) : x));
      }
    } catch(e) { console.error("Update error:", e); }
    setEditModal(null);
  }
  async function deleteContact(id){
    await sbDelete("hot_pipeline", id);
    setContacts(p => p.filter(x => x.id!==id));
    setEditModal(null);
  }

  const [sourceTab,setSourceTab]=useState("All");
  const sourceCounts=useMemo(()=>{const m={All:searchedContacts.length};HP_SOURCES.forEach(s=>{m[s]=searchedContacts.filter(c=>c.source===s).length;});return m;},[searchedContacts]);
  const visibleByStage=useMemo(()=>{const src=sourceTab==="All"?searchedContacts:searchedContacts.filter(c=>c.source===sourceTab);const m={};HP_STAGES.forEach(s=>m[s]=src.filter(c=>c.stage===s));return m;},[searchedContacts,sourceTab]);

  if(loading)return <Spinner text="Loading Pipeline..."/>;

  const isCurrentMonth=selectedMonth===currentMonth;

  const STAT_BOXES=[
    {label:"Fiverr Sales",val:stats["Fiverr"]||0,c:"#1dbf73"},
    {label:"Upwork Sales",val:stats["Upwork"]||0,c:"#6fda44"},
    {label:"LinkedIn Sales",val:stats["LinkedIn"]||0,c:"#0a66c2"},
    {label:"Email Sales",val:stats["Email"]||0,c:"#f59e0b"},
    {label:"WhatsApp",val:stats["WhatsApp"]||0,c:"#25d366"},
    {label:"Calling Sales",val:stats["Calling"]||0,c:"#a855f7"},
    {label:"Freelancer Sales",val:stats["Freelancer"]||0,c:"#29b2fe"},
    {label:"Paid Leads",val:stats["Paid Leads"]||0,c:"#ff6b35"},
    {label:"Total Sales",val:stats.total||0,c:"#f97316"},
    {label:"Pending Revenue",val:(stats.total||0)-(stats.won||0),c:"#f43f5e"},
    {label:"Monthly Sales",lastVal:lastMonthTotal,thisVal:thisMonthTotal,compare:true},
  ];

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Source tabs + toolbar */}
      <div style={{background:"rgba(6,14,28,0.6)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>

function ComparisonGraph({cur,prv,curLabel,prvLabel}){
  const metrics=[
    {key:"activeRevenue",short:"Active",color:"#36f2af",lowerIsBetter:false},
    {key:"wonRevenue",   short:"Won",   color:"#f59e0b",lowerIsBetter:false},
    {key:"lostRevenue",  short:"Lost",  color:"#ef4444",lowerIsBetter:true},
    {key:"totalRevenue", short:"Total", color:"#a78bfa",lowerIsBetter:false},
  ];
  const maxVal=Math.max(...metrics.flatMap(m=>[cur[m.key]||0,prv[m.key]||0]),1);
  return(
    <div style={{flex:"0 0 270px",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:16,padding:"14px 14px 12px",display:"flex",flexDirection:"column",height:"100%",boxSizing:"border-box",minWidth:220,boxShadow:"0 4px 20px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.05)"}}>
      {/* Title */}
      <div style={{fontWeight:700,fontSize:13,color:"#daeeff",marginBottom:5}}>{curLabel} <span style={{color:"rgba(174,220,255,0.38)",fontWeight:400,fontSize:12}}>vs</span> {prvLabel}</div>
      {/* Legend */}
      <div style={{display:"flex",gap:12,marginBottom:10}}>
        {[{label:curLabel,bg:"#23a1dd"},{label:prvLabel,bg:"transparent",border:"1px solid #cbd5e1"}].map(l=>(
          <div key={l.label} style={{display:"flex",alignItems:"center",gap:4}}>
            <div style={{width:9,height:9,borderRadius:2,background:l.bg,border:l.border||"none",flexShrink:0}}/>
            <span style={{fontSize:10,color:"rgba(174,220,255,0.55)"}}>{l.label}</span>
          </div>
        ))}
      </div>
      {/* Bars */}
      <div style={{display:"flex",gap:6,alignItems:"flex-end",flex:"1 1 0",minHeight:80,marginBottom:12}}>
        {metrics.map(m=>{
          const cv=cur[m.key]||0,pv=prv[m.key]||0;
          const ch=maxVal>0?(cv/maxVal)*100:0,ph=maxVal>0?(pv/maxVal)*100:0;
          return(
            <div key={m.key} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3,height:"100%",justifyContent:"flex-end"}}>
              <div style={{fontSize:8,color:m.color,fontWeight:700,textAlign:"center",lineHeight:1.3}}>${cv>=1000?(cv/1000).toFixed(1)+"k":cv}</div>
              <div style={{width:"100%",display:"flex",gap:2,alignItems:"flex-end",flex:1}}>
                <div style={{flex:1,background:m.color,borderRadius:"3px 3px 0 0",height:`${ch}%`,minHeight:cv>0?4:0,transition:"height .4s ease",opacity:0.85}}/>
                <div style={{flex:1,background:m.color+"30",borderRadius:"3px 3px 0 0",height:`${ph}%`,minHeight:pv>0?4:0,border:`1px solid ${m.color}44`,boxSizing:"border-box",transition:"height .4s ease"}}/>
              </div>
              <span style={{fontSize:9,color:"rgba(174,220,255,0.55)",textAlign:"center"}}>{m.short}</span>
            </div>
          );
        })}
      </div>
      {/* Divider */}
      <div style={{height:1,background:"rgba(255,255,255,0.03)",marginBottom:10,flexShrink:0}}/>
      {/* Summary */}
      <div style={{flexShrink:0}}>
        <div style={{fontSize:10,color:"rgba(174,220,255,0.38)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:7}}>Summary</div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          {metrics.map(m=>{
            const cv=cur[m.key]||0,pv=prv[m.key]||0,diff=cv-pv;
            const pct=pv>0?Math.round((Math.abs(diff)/pv)*100):(cv>0?100:0);
            const improved=m.lowerIsBetter?diff<0:diff>0;
            const color=diff===0?"rgba(174,220,255,0.4)":improved?"#36f2af":"#ef4444";
            let msg;
            if(diff===0&&pv===0) msg="No data yet";
            else if(diff===0) msg="→ No change";
            else if(m.key==="lostRevenue"&&diff<0) msg=`▲ ${pct}% less lost`;
            else if(m.key==="lostRevenue"&&diff>0) msg=`▼ ${pct}% more lost`;
            else msg=`${improved?"▲":"▼"} ${pct}% ${improved?"better":"down"}`;
            return(
              <div key={m.key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:color+"13",borderRadius:7,padding:"5px 8px"}}>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:m.color,flexShrink:0}}/>
                  <span style={{fontSize:11,color:"rgba(174,220,255,0.38)"}}>{m.short}</span>
                </div>
                <span style={{fontSize:11,color,fontWeight:700}}>{msg}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ProjectsModal({type,records,onClose}){
  const isActive=type==="active";
  const color=isActive?"#22c55e":"#ef4444";
  const year=new Date().getFullYear();
  const cols=isActive?["Name","Company","Email","Revenue","Source","Active Since"]:["Name","Company","Email","Revenue","Month Lost","Reason"];
  const grid=isActive?"2fr 1.5fr 2fr 1fr 1fr 1fr":"2fr 1.5fr 2fr 1fr 1fr 2fr";

  function downloadCSV(e){
    e.stopPropagation();
    if(!records.length)return;
    const esc=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    const headers=isActive
      ?["Name","Company","Email","Revenue","Source","Active Since","Months Active"]
      :["Name","Company","Email","Revenue","Month Lost","Reason"];
    const dataRows=isActive
      ?records.map(r=>[(r.firstName||"")+" "+(r.lastName||""),r.company||"",r.email||"",r.revenue||0,r.source||"",r.activeSince||"",r.activeMonths||1])
      :records.map(r=>[(r.firstName||"")+" "+(r.lastName||""),r.company||"",r.email||"",r.revenue||0,r.lostMonth||"",r.lostReason||""]);
    const csv=[headers,...dataRows].map(row=>row.map(esc).join(",")).join("\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.setAttribute("href",url);
    a.setAttribute("download",type+"-projects-"+year+".csv");
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},200);
  }

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(4,8,20,0.8)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000}} onClick={onClose}>
      <div style={{background:"rgba(8,18,38,0.92)",backdropFilter:"blur(32px)",border:"1px solid rgba(35,161,221,0.15)",borderRadius:18,width:780,maxWidth:"96vw",maxHeight:"85vh",display:"flex",flexDirection:"column",boxShadow:"0 24px 80px rgba(0,0,0,0.8),inset 0 1px 0 rgba(255,255,255,0.06)"}} onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div style={{padding:"18px 24px",borderBottom:"1px solid rgba(255,255,255,0.07)",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div>

                :<><span style={{color:"#f59e0b",fontSize:12}}>{r.lostMonth||"—"}</span><span style={{color:"#ef4444",fontSize:11,background:"rgba(239,68,68,0.1)",borderRadius:6,padding:"3px 8px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.lostReason||"—"}</span></>

function ACContactModal({client,onClose,onSave,onDelete,saving}){
  const blank={firstName:"",lastName:"",company:"",email:"",phone:"",revenue:"",contractTerms:""};

        <Inp label="Last Name" value={form.lastName} onChange={e=>upd("lastName",e.target.value)} placeholder="Doe"/>
      </div>

        <Inp label="Company" value={form.company} onChange={e=>upd("company",e.target.value)} placeholder="Acme Inc."/>
        <Inp label="Phone" value={form.phone} onChange={e=>upd("phone",e.target.value)} placeholder="+1 555 000 0000"/>
      </div>
      <Inp label="Email" value={form.email} onChange={e=>upd("email",e.target.value)} type="email" placeholder="john@example.com"/>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:12,color:"#36f2af",marginBottom:4,fontWeight:700}}>💰 Revenue ($) <span style={{color:"rgba(174,220,255,0.55)",fontWeight:400,fontSize:11}}>(contract value)</span></label>
        <div style={{position:"relative"}}><span style={{position:"absolute",left:11,top:"50%",transform:"translateY(-50%)",color:"rgba(174,220,255,0.55)",fontWeight:700}}>$</span><input type="number" min="0" step="0.01" value={form.revenue} onChange={e=>upd("revenue",e.target.value)} placeholder="0.00" style={{...IS,paddingLeft:26}}/></div>
      </div>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:12,color:"#a855f7",marginBottom:4,fontWeight:700}}>📄 Contract Terms <span style={{color:"#ef4444"}}>*</span> <span style={{color:"rgba(174,220,255,0.55)",fontWeight:400,fontSize:11}}>(required)</span></label>
        <textarea value={form.contractTerms} onChange={e=>upd("contractTerms",e.target.value)} placeholder="e.g. Monthly retainer $2,000 — deliverables: 4 campaigns/month, 30-day payment terms, 3-month minimum commitment…" style={{...IS,resize:"vertical",minHeight:100}}/>
      </div>
      {err&&<div style={{color:"#ef4444",fontSize:12,marginBottom:10,background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:8,padding:"7px 10px"}}>⚠ {err}</div>}
      <div style={{display:"flex",justifyContent:"space-between",marginTop:10,borderTop:"1px solid rgba(255,255,255,0.05)",paddingTop:14}}>
        {client?.id?<Btn variant="danger" onClick={()=>onDelete(client.id)}>Delete</Btn>:<div/>}
        <div style={{display:"flex",gap:8}}>
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
          <Btn onClick={submit} style={{opacity:saving?0.6:1}}>{saving?"Saving…":"Save"}</Btn>
        </div>
      </div>
    </Modal>
  );
}

function ActiveClientsGate({search="",setSearch=()=>{},onRevenue=()=>{}}){
  const [clients,setClients]=useState([]); const [statuses,setStatuses]=useState([]); const [hpContacts,setHpContacts]=useState([]); const [loading,setLoading]=useState(true);
  const [addModal,setAddModal]=useState(false); const [editModal,setEditModal]=useState(null); const [saving,setSaving]=useState(false);
  const currentMonth=useMemo(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;},[]);
  const [selectedMonth,setSelectedMonth]=useState(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;});

  useEffect(()=>{
    setLoading(true);
    Promise.all([sbGetAll("active_clients"),sbGetAll("active_clients_monthly_status"),sbGetAll("hot_pipeline")])
      .then(([ac,st,hp])=>{
        if(Array.isArray(ac))setClients(ac.map(rowToAC));
        if(Array.isArray(st))setStatuses(st.map(rowToStatus));
        if(Array.isArray(hp))setHpContacts(hp.map(rowToHP));
        setLoading(false);
      }).catch(()=>setLoading(false));
  },[]);

  // Month helpers
  const winMonth=useCallback(c=>(c.wonAt||c.createdAt||currentMonth).slice(0,7),[currentMonth]);
  const prevMonth=useMemo(()=>{const[y,m]=currentMonth.split('-').map(Number);const pm=m===1?12:m-1;const py=m===1?y-1:y;return `${py}-${String(pm).padStart(2,'0')}`;},[currentMonth]);
  const isCurrentMonth=selectedMonth===currentMonth;

  // Winning = HP Won contacts for the selected month (live, not yet stored in active_clients)
  const winningClients=useMemo(()=>hpContacts.filter(c=>c.stage==="Won"&&winMonth(c)===selectedMonth&&(!search.trim()||(()=>{const q=search.toLowerCase();return[c.firstName,c.lastName,c.email,c.accountName].some(f=>f&&f.toLowerCase().includes(q));})())),[hpContacts,selectedMonth,winMonth,search]);

  // Active / Lost = stored monthly status records for the exact selected month
  const acSearch=useCallback((c)=>{if(!search.trim())return true;const q=search.toLowerCase();return[c.firstName,c.lastName,c.email,c.company,c.phone].some(f=>f&&f.toLowerCase().includes(q));},[search]);
  const activeClientsInMonth=useMemo(()=>clients.filter(c=>statuses.some(s=>s.clientId===c.id&&s.month===selectedMonth&&s.status==="active")&&acSearch(c)),[clients,statuses,selectedMonth,acSearch]);
  const lostClients=useMemo(()=>clients.filter(c=>statuses.some(s=>s.clientId===c.id&&s.month===selectedMonth&&s.status==="lost")&&acSearch(c)),[clients,statuses,selectedMonth,acSearch]);

  const availableMonths=useMemo(()=>{
    const s=new Set([...statuses.map(s=>s.month),...hpContacts.filter(c=>c.stage==="Won").map(c=>winMonth(c)),currentMonth]);
    return [...s].sort().reverse();
  },[statuses,hpContacts,currentMonth,winMonth]);

  const stats=useMemo(()=>{
    const activeRevenue=activeClientsInMonth.reduce((s,c)=>s+(c.revenue||0),0);
    const wonRevenue=winningClients.reduce((s,c)=>s+(c.saleValue||0),0);
    const lostRevenue=lostClients.reduce((s,c)=>s+(c.revenue||0),0);
    return{
      active:activeClientsInMonth.length,winning:winningClients.length,lost:lostClients.length,
      activeRevenue,wonRevenue,lostRevenue,
      totalRevenue:activeRevenue+wonRevenue
    };
  },[activeClientsInMonth,winningClients,lostClients]);
  useEffect(()=>{ onRevenue({val:stats.totalRevenue,label:"Total Revenue",color:"#c084fc"}); },[stats.totalRevenue]);

  const graphPrevMonth=useMemo(()=>{const[y,m]=selectedMonth.split('-').map(Number);const pm=m===1?12:m-1;const py=m===1?y-1:y;return `${py}-${String(pm).padStart(2,'0')}`;},[selectedMonth]);
  const graphCurLabel=useMemo(()=>{const[y,m]=selectedMonth.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('default',{month:'short',year:'numeric'});},[selectedMonth]);
  const graphPrvLabel=useMemo(()=>{const[y,m]=graphPrevMonth.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('default',{month:'short',year:'numeric'});},[graphPrevMonth]);
  const graphStats=useMemo(()=>{
    const ca=clients.filter(c=>statuses.some(s=>s.clientId===c.id&&s.month===selectedMonth&&s.status==="active"));
    const cw=hpContacts.filter(c=>c.stage==="Won"&&winMonth(c)===selectedMonth);
    const cl=clients.filter(c=>statuses.some(s=>s.clientId===c.id&&s.month===selectedMonth&&s.status==="lost"));
    const pa=clients.filter(c=>statuses.some(s=>s.clientId===c.id&&s.month===graphPrevMonth&&s.status==="active"));
    const pw=hpContacts.filter(c=>c.stage==="Won"&&winMonth(c)===graphPrevMonth);
    const pl=clients.filter(c=>statuses.some(s=>s.clientId===c.id&&s.month===graphPrevMonth&&s.status==="lost"));
    const mk=(a,w,l)=>{const ar=a.reduce((s,c)=>s+(c.revenue||0),0),wr=w.reduce((s,c)=>s+(c.saleValue||0),0),lr=l.reduce((s,c)=>s+(c.revenue||0),0);return{activeRevenue:ar,wonRevenue:wr,lostRevenue:lr,totalRevenue:ar+wr};};
    return{cur:mk(ca,cw,cl),prv:mk(pa,pw,pl)};
  },[clients,statuses,hpContacts,selectedMonth,graphPrevMonth,winMonth]);

  async function addClient(form){
    setSaving(true);
    const res=await sbInsert("active_clients",acToRow(form));
    if(Array.isArray(res)&&res[0]){
      const newClient=rowToAC(res[0]);
      setClients(p=>[...p,newClient]);
      const stRes=await sbInsert("active_clients_monthly_status",{client_id:newClient.id,month:currentMonth,status:"active"});
      if(Array.isArray(stRes)&&stRes[0])setStatuses(p=>[...p,rowToStatus(stRes[0])]);
      setAddModal(false);
    } else {
      alert("Save failed:\n"+(res?.message||res?.error||JSON.stringify(res)));
    }
    setSaving(false);
  }
  async function saveClient(form){
    setSaving(true);
    const res=await sbUpdate("active_clients",form.id,acToRow(form));
    if(Array.isArray(res)&&res[0]){setClients(p=>p.map(c=>c.id===form.id?rowToAC(res[0]):c));setEditModal(null);}
    else{alert("Save failed:\n"+(res?.message||res?.error||JSON.stringify(res)));}
    setSaving(false);
  }
  async function deleteClient(id){
    await sbDelete("active_clients",id);
    setClients(p=>p.filter(c=>c.id!==id));
    setStatuses(p=>p.filter(s=>s.clientId!==id));
    setEditModal(null);
  }
  const [lostModal,setLostModal]=useState(null);
  const [projectsModal,setProjectsModal]=useState(null); // null | 'active' | 'lost'
  const yoyStart=useMemo(()=>`${new Date().getFullYear()}-01`,[]);

  const activeProjects=useMemo(()=>{
    const fromDB=clients
      .filter(c=>statuses.some(s=>s.clientId===c.id&&s.month===selectedMonth&&s.status==="active"))
      .map(c=>({...c,activeSince:(c.createdAt||"").slice(0,7),activeMonths:1}));
    const coveredHpIds=new Set(clients.map(c=>c.hotPipelineId).filter(Boolean).map(String));
    const fromHP=hpContacts
      .filter(c=>c.stage==="Won"&&winMonth(c)===selectedMonth&&!coveredHpIds.has(String(c.id)))
      .map(hp=>({id:hp.id,firstName:hp.firstName,lastName:hp.lastName,company:hp.accountName||"",email:hp.email||"",revenue:hp.saleValue||0,source:hp.source||"",activeSince:winMonth(hp),activeMonths:1}));
    return[...fromDB,...fromHP].sort((a,b)=>(a.activeSince||"").localeCompare(b.activeSince||""));
  },[clients,statuses,hpContacts,selectedMonth,winMonth]);

  const lostProjects=useMemo(()=>{
    const yoySt=statuses.filter(s=>s.status==="lost"&&s.month>=yoyStart&&s.month<=currentMonth);
    const ids=new Set(yoySt.map(s=>s.clientId));
    return clients.filter(c=>ids.has(c.id)).map(c=>{
      const st=yoySt.filter(s=>s.clientId===c.id).sort((a,b)=>b.month.localeCompare(a.month))[0];
      return{...c,lostMonth:st?.month,lostReason:st?.reason};
    }).sort((a,b)=>(b.lostMonth||"").localeCompare(a.lostMonth||""));
  },[clients,statuses,currentMonth,yoyStart]);

  async function moveToLost(client,reason){
    const res=await sbUpsert("active_clients_monthly_status","client_id,month",{client_id:client.id,month:currentMonth,status:"lost",reason:reason||null});
    if(Array.isArray(res)&&res[0])setStatuses(p=>[...p.filter(s=>!(s.clientId===client.id&&s.month===currentMonth)),rowToStatus(res[0])]);
    setLostModal(null);
  }
  async function restoreToActive(client){
    const res=await sbUpsert("active_clients_monthly_status","client_id,month",{client_id:client.id,month:currentMonth,status:"active"});
    if(Array.isArray(res)&&res[0])setStatuses(p=>[...p.filter(s=>!(s.clientId===client.id&&s.month===currentMonth)),rowToStatus(res[0])]);
  }

  // Auto-roll: on first load of a new month, carry previous month's Active + Winning into current month
  const autoRolled=useRef(false);
  useEffect(()=>{
    if(loading||autoRolled.current)return;
    // If current month already has any status records, nothing to roll
    if(statuses.some(s=>s.month===currentMonth)){autoRolled.current=true;return;}
    const prevActive=clients.filter(c=>statuses.some(s=>s.clientId===c.id&&s.month===prevMonth&&s.status==="active"));
    const prevWinning=hpContacts.filter(c=>c.stage==="Won"&&winMonth(c)===prevMonth);
    if(prevActive.length===0&&prevWinning.length===0){autoRolled.current=true;return;}
    autoRolled.current=true;
    (async()=>{
      const newStatuses=[];const newClients=[];
      for(const c of prevActive){
        const res=await sbUpsert("active_clients_monthly_status","client_id,month",{client_id:c.id,month:currentMonth,status:"active"});
        if(Array.isArray(res)&&res[0])newStatuses.push(rowToStatus(res[0]));
      }
      for(const hp of prevWinning){
        let ac=clients.find(c=>c.hotPipelineId===hp.id);
        if(!ac){
          const res=await sbInsert("active_clients",{first_name:hp.firstName,last_name:hp.lastName,company:hp.accountName||"",email:hp.email||"",phone:"",contract_terms:"",revenue:parseFloat(hp.saleValue)||0,source:hp.source||"hot_pipeline",hot_pipeline_id:hp.id});
          if(Array.isArray(res)&&res[0]){ac=rowToAC(res[0]);newClients.push(ac);}
        }
        if(ac){
          const res=await sbUpsert("active_clients_monthly_status","client_id,month",{client_id:ac.id,month:currentMonth,status:"active"});
          if(Array.isArray(res)&&res[0])newStatuses.push(rowToStatus(res[0]));
        }
      }
      if(newClients.length)setClients(p=>[...p,...newClients]);
      if(newStatuses.length)setStatuses(p=>[...p,...newStatuses]);
    })();
  },[loading,statuses,clients,hpContacts,currentMonth,prevMonth,winMonth]);

  if(loading)return <Spinner text="Loading Active Clients…"/>;

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{background:"rgba(255,255,255,0.05)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"12px 20px",display:"flex",flexDirection:"column",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <MonthPicker selectedMonth={selectedMonth} currentMonth={currentMonth} availableMonths={availableMonths} onChange={setSelectedMonth}/>
          <button onClick={()=>setProjectsModal('active')} style={{background:"rgba(54,242,175,0.08)",color:"#36f2af",border:"1px solid rgba(54,242,175,0.2)",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
            Active Projects<span style={{background:"#36f2af",color:"#fff",borderRadius:20,padding:"1px 7px",fontSize:11,fontWeight:700}}>{activeProjects.length}</span>
          </button>
          <button onClick={()=>setProjectsModal('lost')} style={{background:"rgba(239,68,68,0.1)",color:"#ef4444",border:"1px solid rgba(239,68,68,0.2)",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:12,fontWeight:600,display:"flex",alignItems:"center",gap:6}}>
            Lost Projects<span style={{background:"#ef4444",color:"#fff",borderRadius:20,padding:"1px 7px",fontSize:11,fontWeight:700}}>{lostProjects.length}</span>
          </button>
          {!isCurrentMonth&&<span style={{background:"rgba(35,161,221,0.12)",color:"#23a1dd",border:"1px solid rgba(35,161,221,0.2)",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:600}}>📅 View Only</span>}
          {!isCurrentMonth&&<button onClick={()=>setSelectedMonth(currentMonth)} style={{background:"rgba(54,242,175,0.08)",color:"#36f2af",border:"1px solid rgba(54,242,175,0.2)",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>↩ Back to Present</button>}
          {isCurrentMonth&&<button onClick={()=>setAddModal(true)} style={{marginLeft:"auto",background:"#36f2af",color:"#fff",border:"none",borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:12,fontWeight:600}}>+ Add Client</button>}
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
          {[{label:"Active Clients",val:stats.active,c:"#36f2af"},{label:"Winning This Month",val:stats.winning,c:"#f59e0b"},{label:"Lost Clients",val:stats.lost,c:"#ef4444"},{label:"Active Revenue",val:"$"+stats.activeRevenue.toLocaleString(undefined,{maximumFractionDigits:0}),c:"#36f2af"},{label:"Won Revenue",val:"$"+stats.wonRevenue.toLocaleString(undefined,{maximumFractionDigits:0}),c:"#f59e0b"},{label:"Lost Revenue",val:"$"+stats.lostRevenue.toLocaleString(undefined,{maximumFractionDigits:0}),c:"#ef4444"}].map(s=>(
            <div key={s.label} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:9,padding:"6px 13px",display:"flex",alignItems:"center",gap:6,boxShadow:"0 4px 16px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.04)"}}>

  const [fuPending,setFuPending]=useState(null); const [wonPending,setWonPending]=useState(null); const [lostPending,setLostPending]=useState(null); const [connectedPending,setConnectedPending]=useState(null); const [reviewPending,setReviewPending]=useState(null);

  const [tab,setTab]=useState("Kanban");
  const [stageTab,setStageTab]=useState("All");
  const [templates,setTemplates]=useState([]);
  const [copiedTpl,setCopiedTpl]=useState(null);
  const [newTplModal,setNewTplModal]=useState(false);
  const today=todayStr();

  useEffect(()=>{ setLoading(true); Promise.all([sbGetAll("freelance_pipeline"),sbGetAll("templates")]).then(([fp,tpl])=>{ if(Array.isArray(fp))setContacts(fp.map(rowToFP)); if(Array.isArray(tpl))setTemplates(tpl); setLoading(false); }).catch(()=>setLoading(false)); },[]);

  const searched=useMemo(()=>{
    const q=search.toLowerCase().trim();
    return contacts.filter(c=>{
      if(stageTab!=="All"&&c.stage!==stageTab)return false;
      if(q&&![c.firstName,c.lastName,c.companyName,c.clientFreelanceName,c.freelanceAccountName,c.projectType,c.source].some(f=>f&&f.toLowerCase().includes(q)))return false;
      return true;
    });
  },[contacts,search,stageTab]);

  const byStage=useMemo(()=>{ const m={}; FP_STAGES.forEach(s=>m[s]=searched.filter(c=>c.stage===s)); return m; },[searched]);
  const stageCounts=useMemo(()=>{ const m={All:contacts.length}; FP_STAGES.forEach(s=>m[s]=contacts.filter(c=>c.stage===s).length); return m; },[contacts]);

  const overdueContacts=useMemo(()=>contacts.filter(c=>c.stage==="Follow Up"&&c.followUp?.date&&c.followUp.date<today),[contacts,today]);
  const todayContacts=useMemo(()=>contacts.filter(c=>c.stage==="Follow Up"&&c.followUp?.date===today),[contacts,today]);
  const upcomingContacts=useMemo(()=>contacts.filter(c=>c.stage==="Follow Up"&&c.followUp?.date&&c.followUp.date>today&&c.followUp.date<=addDays(7)),[contacts,today]);
  const reminderCount=overdueContacts.length+todayContacts.length;

  const stats=useMemo(()=>{ const won=contacts.filter(c=>c.stage==="WON"); return{total:contacts.length,won:won.length,lost:contacts.filter(c=>c.stage==="Lost").length,followUp:stageCounts["Follow Up"]||0,revenue:won.reduce((s,c)=>s+(parseFloat(c.deal?.dealAmount)||0),0)}; },[contacts,stageCounts]);
  useEffect(()=>{ onRevenue({val:stats.revenue,label:"Revenue Won",color:"#36f2af"}); },[stats.revenue]);

  const onDragStart=useCallback((e,id)=>{setDragId(id);e.dataTransfer.effectAllowed="move";},[]);
  const onDragOver=useCallback(stage=>setDragOver(stage),[]);
  const onDragLeave=useCallback(()=>setDragOver(null),[]);

  const updateContact=useCallback(async(id,patch)=>{
    const c=contacts.find(x=>x.id===id); if(!c)return;
    const row=fpToRow({...c,...patch});
    if(patch.stage==="WON"&&!c.wonAt)row.won_at=new Date().toISOString();
    const res=await sbUpdate("freelance_pipeline",id,row);
    if(Array.isArray(res)&&res[0])setContacts(p=>p.map(x=>x.id===id?rowToFP(res[0]):x));
  },[contacts]);

  const onDrop=useCallback((e,stage)=>{
    e.preventDefault();setDragOver(null);
    if(dragId==null)return;
    const c=contacts.find(x=>x.id===dragId);
    if(!c||c.stage===stage){setDragId(null);return;}
    if(stage==="Connected")setConnectedPending(c);
    else if(stage==="Follow Up")setFuPending(c);
    else if(stage==="WON")setWonPending(c);
    else if(stage==="Lost")setLostPending(c);
    else updateContact(dragId,{stage});
    setDragId(null);
  },[dragId,contacts,updateContact]);

  async function addContact(form){ const res=await sbInsert("freelance_pipeline",fpToRow(form)); if(Array.isArray(res)&&res[0])setContacts(p=>[...p,rowToFP(res[0])]); }
  async function saveContact(form){ setSaving(true); const res=await sbUpdate("freelance_pipeline",form.id,fpToRow(form)); if(Array.isArray(res)&&res[0])setContacts(p=>p.map(x=>x.id===form.id?rowToFP(res[0]):x)); setSaving(false);setEditModal(null); }
  async function deleteContact(id){ await sbDelete("freelance_pipeline",id); setContacts(p=>p.filter(x=>x.id!==id)); setEditModal(null); }

  function saveFU(date,notes){
    if(!fuPending)return;
    const c=fuPending;
    const nh=[...(c.followUpHistory||[]),{date:c.followUp?.date||date,notes:c.followUp?.notes||"",attempt:(c.followUpHistory||[]).length+1}];
    updateContact(c.id,{stage:"Follow Up",followUp:{date,notes},followUpHistory:nh});
    setFuPending(null);
  }

  async function addTemplate(name,body){ const res=await sbInsert("templates",{name,body}); if(Array.isArray(res)&&res[0])setTemplates(p=>[...p,res[0]]); }
  async function deleteFPTemplate(id){ await sbDelete("templates",id); setTemplates(p=>p.filter(t=>t.id!==id)); }

  function saveConnected(date,account){
    if(!connectedPending)return;
    updateContact(connectedPending.id,{stage:"Connected",freelanceAccountName:account||connectedPending.freelanceAccountName,deal:{...(connectedPending.deal||{}),connectedDate:date,connectedAccount:account}});
    setConnectedPending(null);
  }

  async function saveWon({closingDate,dealAmount}){
    if(!wonPending)return;
    updateContact(wonPending.id,{stage:"WON",deal:{closingDate,dealAmount}});
    await sbInsert("hot_pipeline",hpToRow({
      firstName:wonPending.firstName,lastName:wonPending.lastName,
      linkedinUrl:wonPending.linkedinUrl,website:wonPending.website,
      industry:wonPending.projectType||"",email:wonPending.email,
      accountName:wonPending.companyName||wonPending.freelanceAccountName||"",
      source:wonPending.source,stage:wonPending.source,
      saleValue:parseFloat(dealAmount)||0,
      tags:[],followUp:null,deal:null,followUpHistory:[]
    }));
    setWonPending(null);
  }

  if(loading)return <Spinner text="Loading Freelance Pipeline..."/>;

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Stage filter tabs + bell */}
      <div style={{background:"rgba(6,14,28,0.6)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",gap:0,overflowX:"auto"}}>
          {["All",...FP_STAGES].map(s=>(
            <button key={s} onClick={()=>setStageTab(s)}
              style={{background:"none",color:stageTab===s?"#04bee7":"rgba(174,220,255,0.5)",border:"none",borderBottom:stageTab===s?"2px solid #23a1dd":"2px solid transparent",padding:"12px 13px",cursor:"pointer",fontWeight:stageTab===s?600:500,fontSize:13,transition:"all .15s",marginBottom:-1,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}>
              {s}
              <span style={{background:stageTab===s?"#eef2ff":"#f1f5f9",color:stageTab===s?"#23a1dd":"#94a3b8",borderRadius:20,padding:"1px 7px",fontSize:11,fontWeight:600}}>{stageCounts[s]||0}</span>
            </button>
          ))}
        </div>
        <div style={{flexShrink:0,paddingLeft:10}}>
          <button onClick={()=>{ const first=[...overdueContacts,...todayContacts][0]; if(first)setReviewPending(first); }} style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:8,width:32,height:32,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,position:"relative"}}>
            🔔{reminderCount>0&&<span style={{position:"absolute",top:-3,right:-3,background:"#ef4444",color:"#fff",borderRadius:"50%",width:15,height:15,fontSize:8,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>{reminderCount}</span>}
          </button>
        </div>
      </div>
      {/* Stat boxes */}
      <div style={{background:"rgba(255,255,255,0.05)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"10px 20px",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        {[
          {label:"Total Leads",val:stats.total,c:"#23a1dd"},
          {label:"Won",val:stats.won,c:"#36f2af"},
          {label:"Lost",val:stats.lost,c:"#ef4444"},
          {label:"Follow Up",val:stats.followUp,c:"#a855f7"},
        ].map(s=>(
          <div key={s.label} style={{background:"rgba(255,255,255,0.04)",backdropFilter:"blur(10px)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"8px 14px",display:"flex",flexDirection:"column",gap:2,minWidth:100,boxShadow:"0 4px 16px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05)"}}>
            <div style={{fontWeight:700,fontSize:15,color:s.c}}>{s.val}</div>
            <div style={{fontSize:10,color:"rgba(174,220,255,0.38)",fontWeight:500}}>{s.label}</div>
          </div>
        ))}
        {reminderCount>0&&<div style={{background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.25)",borderRadius:10,padding:"8px 14px",display:"flex",flexDirection:"column",gap:2,minWidth:100,boxShadow:"0 4px 16px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.04)"}}>
          <div style={{fontWeight:700,fontSize:15,color:"#f59e0b"}}>{reminderCount}</div>
          <div style={{fontSize:10,color:"rgba(174,220,255,0.38)",fontWeight:500}}>Overdue / Today</div>
        </div>}
      </div>
      {/* View tabs */}
      <div style={{background:"rgba(255,255,255,0.05)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 20px",display:"flex",gap:0}}>
        {["Kanban","Contacts","Calendar","Templates","Analytics","Activity"].map(t=><button key={t} onClick={()=>setTab(t)} style={{background:"none",color:tab===t?"#04bee7":"rgba(174,220,255,0.5)",border:"none",borderBottom:tab===t?"2px solid #23a1dd":"2px solid transparent",padding:"10px 14px",cursor:"pointer",fontWeight:tab===t?600:500,fontSize:13,transition:"all .15s",marginBottom:-1}}>{t}</button>)}
      </div>
      {/* Content */}
      <div style={{flex:1,overflow:"auto",padding:tab==="Kanban"?"12px 16px":"16px 20px",background:"rgba(174,251,102,0.025)"}}>
        {tab==="Kanban"&&(
          <div style={{display:"flex",gap:10,alignItems:"flex-start",minHeight:"100%"}}>
            {FP_STAGES.map(stage=>(
              <FPKanbanCol key={stage} stage={stage} contacts={byStage[stage]||[]}
                onDragStart={onDragStart} onDrop={onDrop} onDragOver={onDragOver} onDragLeave={onDragLeave}
                onClick={c=>setEditModal(c)} isDragOver={dragOver===stage}
                onAdd={stage=>setAddModal(stage)} today={today}
              />
            ))}
          </div>
        )}
        {tab==="Contacts"&&(
          <div>
            <div style={{display:"flex",gap:10,marginBottom:14,alignItems:"center"}}>
              <span style={{color:"rgba(174,220,255,0.55)",fontSize:12}}>{contacts.length} contacts</span>
            </div>
            <div style={{overflowX:"auto",borderRadius:12,border:"1px solid rgba(255,255,255,0.09)",background:"rgba(6,14,28,0.5)",backdropFilter:"blur(12px)"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead style={{background:"rgba(255,255,255,0.04)"}}><tr>{["First","Last","Email","Phone","Platform","Stage","Client Name","Account Name","Project Type","Budget","Actions"].map(h=><th key={h} style={{padding:"9px 12px",textAlign:"left",color:"rgba(174,220,255,0.38)",fontWeight:600,fontSize:11,borderBottom:"1px solid rgba(255,255,255,0.07)",whiteSpace:"nowrap",textTransform:"uppercase",letterSpacing:"0.05em"}}>{h}</th>)}</tr></thead>
                <tbody>{contacts.map(c=>{const sc=FP_COLORS[c.source]||"#64748b";const stc=FP_COLORS[c.stage]||"#23a1dd";return(<tr key={c.id} style={{borderBottom:"1px solid rgba(255,255,255,0.05)"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(35,161,221,0.06)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}><td style={{padding:"9px 12px",color:"#daeeff",fontWeight:600}}>{c.firstName}</td><td style={{padding:"9px 12px",color:"#daeeff"}}>{c.lastName}</td><td style={{padding:"9px 12px",color:"rgba(174,220,255,0.55)",fontSize:12}}>{c.email||"—"}</td><td style={{padding:"9px 12px",color:"rgba(174,220,255,0.55)",fontSize:12}}>{c.phone||"—"}</td><td style={{padding:"9px 12px"}}><span style={{background:sc+"18",color:sc,border:`1px solid ${sc}33`,borderRadius:20,padding:"2px 9px",fontSize:11,fontWeight:600}}>{c.source||"—"}</span></td><td style={{padding:"9px 12px"}}><span style={{background:stc+"18",color:stc,borderRadius:20,padding:"2px 9px",fontSize:11,fontWeight:600}}>{c.stage}</span></td><td style={{padding:"9px 12px",fontSize:12,color:"#c084fc",fontWeight:600}}>{c.clientFreelanceName||"—"}</td><td style={{padding:"9px 12px",fontSize:12,color:"#0369a1"}}>{c.freelanceAccountName||"—"}</td><td style={{padding:"9px 12px",fontSize:12,color:"rgba(174,220,255,0.55)"}}>{c.projectType||"—"}</td><td style={{padding:"9px 12px",fontSize:12,color:"#36f2af",fontWeight:600}}>{c.clientBudget||"—"}</td><td style={{padding:"9px 12px"}}><div style={{display:"flex",gap:5}}>{c.jobLink&&<a href={c.jobLink} target="_blank" rel="noreferrer" style={{background:"rgba(35,161,221,0.1)",color:"#23a1dd",borderRadius:5,padding:"3px 7px",fontSize:11,fontWeight:600}}>Job↗</a>}<button onClick={()=>setEditModal(c)} style={{background:"rgba(255,255,255,0.04)",color:"rgba(174,220,255,0.55)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:11}}>✏</button><button onClick={()=>deleteContact(c.id)} style={{background:"rgba(239,68,68,0.1)",color:"#ef4444",border:"none",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:11}}>🗑</button></div></td></tr>);})}</tbody>
              </table>
            </div>
          </div>
        )}
        {tab==="Calendar"&&(
          <div>
            {[{label:"OVERDUE",items:overdueContacts,bg:"#fef2f2",border:"#fecaca",titleColor:"#dc2626",badge:(d)=><span style={{background:"rgba(239,68,68,0.1)",color:"#ef4444",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>OVERDUE</span>},{label:"TODAY",items:todayContacts,bg:"#fffbeb",border:"#fde68a",titleColor:"#d97706",badge:()=><span style={{background:"rgba(245,158,11,0.08)",color:"#f59e0b",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>TODAY</span>},{label:"UPCOMING (7 DAYS)",items:upcomingContacts,bg:"#eff6ff",border:"#bfdbfe",titleColor:"#1d4ed8",badge:()=><span style={{background:"rgba(35,161,221,0.1)",color:"#23a1dd",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>UPCOMING</span>}].map(group=>group.items.length>0&&(
              <div key={group.label} style={{background:group.bg,border:`1px solid ${group.border}`,borderRadius:12,padding:"12px 16px",marginBottom:18}}>
                <div style={{fontWeight:700,color:group.titleColor,marginBottom:8}}>🔔 {group.label} ({group.items.length})</div>
                {group.items.map(c=><div key={c.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderTop:`1px solid ${group.border}`,alignItems:"center"}}><span style={{color:"#daeeff",fontWeight:600}}>{c.firstName} {c.lastName}<span style={{color:"rgba(174,220,255,0.55)",fontSize:12,fontWeight:400}}> · {c.followUp?.date} · {c.source}</span></span><div style={{display:"flex",gap:6}}>{group.badge(c.followUp?.date)}<button onClick={()=>setReviewPending(c)} style={{background:"rgba(35,161,221,0.12)",color:"#23a1dd",border:"none",borderRadius:8,padding:"3px 10px",cursor:"pointer",fontSize:11,fontWeight:600}}>Review →</button></div></div>)}
              </div>
            ))}
            {overdueContacts.length===0&&todayContacts.length===0&&upcomingContacts.length===0&&<div style={{color:"rgba(174,220,255,0.38)",fontSize:13,textAlign:"center",padding:40}}>✅ No follow-ups due. All clear!</div>}
          </div>
        )}
        {tab==="Templates"&&(
          <div>
            <div style={{display:"flex",justifyContent:"flex-end",marginBottom:16}}>
              <Btn onClick={()=>setNewTplModal(true)}>+ New Template</Btn>
            </div>
            <div style={{display:"grid",gap:14}}>
              {templates.length===0&&<div style={{color:"rgba(174,220,255,0.38)",textAlign:"center",padding:40,background:"rgba(255,255,255,0.05)",borderRadius:12,border:"1px solid rgba(255,255,255,0.09)"}}>No templates yet. Click <strong>+ New Template</strong> to create one.</div>}
              {templates.map(t=>(
                <div key={t.id} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:12,padding:18,boxShadow:"0 4px 20px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.05)"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                    <span style={{fontWeight:600,color:"#daeeff",fontSize:14}}>✉️ {t.name}</span>
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={()=>copyText(t.body,()=>{setCopiedTpl(t.id);setTimeout(()=>setCopiedTpl(null),1500);})} style={{background:copiedTpl===t.id?"#f0fdf4":"#eef2ff",color:copiedTpl===t.id?"#16a34a":"#23a1dd",border:"none",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:12,fontWeight:600}}>{copiedTpl===t.id?"✓ Copied!":"📋 Copy"}</button>
                      <button onClick={()=>{if(confirm(`Delete template "${t.name}"?`))deleteFPTemplate(t.id);}} style={{background:"rgba(239,68,68,0.1)",color:"#ef4444",border:"none",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:12}}>🗑</button>
                    </div>
                  </div>
                  <p style={{color:"rgba(174,220,255,0.55)",fontSize:13,lineHeight:1.7,margin:0,background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"10px 12px",border:"1px solid #f1f5f9"}}>{t.body}</p>
                </div>
              ))}
            </div>
            {newTplModal&&<FPNewTemplateModal onClose={()=>setNewTplModal(false)} onSave={addTemplate}/>}
          </div>
        )}
        {tab==="Analytics"&&(
          <div style={{display:"grid",gap:16}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12}}>
              {[{label:"Total",val:stats.total,c:"#23a1dd"},{label:"Won",val:stats.won,c:"#36f2af"},{label:"Lost",val:stats.lost,c:"#ef4444"},{label:"Follow Up",val:stats.followUp,c:"#a855f7"},{label:"Win Rate",val:stats.total?Math.round(stats.won/stats.total*100)+"%":"0%",c:"#f59e0b"},{label:"Revenue",val:"$"+stats.revenue.toLocaleString(undefined,{maximumFractionDigits:0}),c:"#36f2af"}].map(k=><div key={k.label} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:12,padding:"14px 16px",boxShadow:"0 4px 20px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.05)"}}><div style={{fontWeight:700,fontSize:22,color:k.c}}>{k.val}</div><div style={{fontSize:12,color:"rgba(174,220,255,0.55)",marginTop:2}}>{k.label}</div></div>)}
            </div>
            <div style={{background:"rgba(6,14,28,0.6)",backdropFilter:"blur(16px)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20,boxShadow:"0 4px 24px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.06)"}}>
              <div style={{fontWeight:700,color:"#daeeff",marginBottom:16,fontSize:14}}>Pipeline by Stage</div>
              {FP_STAGES.map(s=>{ const count=contacts.filter(c=>c.stage===s).length; const max=Math.max(...FP_STAGES.map(st=>contacts.filter(c=>c.stage===st).length),1); return <div key={s} style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:FP_COLORS[s],fontWeight:600}}>{s}</span><span style={{color:"rgba(174,220,255,0.38)"}}>{count}</span></div><div style={{background:"rgba(255,255,255,0.03)",borderRadius:6,height:8,overflow:"hidden"}}><div style={{width:`${(count/max)*100}%`,background:FP_COLORS[s],height:"100%",borderRadius:6}}/></div></div>; })}
            </div>
            <div style={{background:"rgba(6,14,28,0.6)",backdropFilter:"blur(16px)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20,boxShadow:"0 4px 24px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.06)"}}>
              <div style={{fontWeight:700,color:"#daeeff",marginBottom:16,fontSize:14}}>Leads by Platform</div>
              {FP_SOURCE_STAGES.map(src=>{ const count=contacts.filter(c=>c.source===src).length; const won=contacts.filter(c=>c.source===src&&c.stage==="WON").length; const max=Math.max(...FP_SOURCE_STAGES.map(s=>contacts.filter(c=>c.source===s).length),1); const sc=FP_COLORS[src]||"#23a1dd"; return <div key={src} style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:sc,fontWeight:600}}>{src}</span><span style={{color:"rgba(174,220,255,0.38)"}}>{count} leads · <span style={{color:"#36f2af",fontWeight:600}}>{won} won</span></span></div><div style={{background:"rgba(255,255,255,0.03)",borderRadius:6,height:8,overflow:"hidden"}}><div style={{width:`${(count/max)*100}%`,background:sc,height:"100%",borderRadius:6}}/></div></div>; })}
            </div>
          </div>
        )}
        {tab==="Activity"&&<ActivityLogTab pipeline="Freelance Pipeline"/>}
      </div>
      {/* Modals */}
      {addModal&&<FPAddModal source={addModal} onClose={()=>setAddModal(null)} onSave={addContact}/>}
      {editModal&&<FPEditModal contact={editModal} onClose={()=>setEditModal(null)} onSave={saveContact} onDelete={deleteContact} saving={saving}/>}
      {connectedPending&&<FPConnectedModal contact={connectedPending} onClose={()=>setConnectedPending(null)} onSave={saveConnected}/>}
      {fuPending&&<FPFollowUpModal contact={fuPending} onClose={()=>setFuPending(null)} onSave={saveFU}/>}
      {wonPending&&<FPWonModal contact={wonPending} onClose={()=>setWonPending(null)} onSave={saveWon}/>}
      {lostPending&&<FPLostModal contact={lostPending} onClose={()=>setLostPending(null)} onSave={tags=>{const merged=[...new Set([...(lostPending.tags||[]),...tags])];updateContact(lostPending.id,{stage:"Lost",tags:merged});setLostPending(null);}}/>}
      {reviewPending&&(
        <Modal title={`🔔 Follow-Up — ${reviewPending.firstName} ${reviewPending.lastName}`} onClose={()=>setReviewPending(null)}>
          <div style={{background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.25)",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:13,color:"#f59e0b"}}>
            📅 Follow-up scheduled for <strong>{reviewPending.followUp?.date}</strong>
            {reviewPending.followUp?.date<today&&<span style={{marginLeft:8,background:"rgba(239,68,68,0.1)",color:"#ef4444",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>OVERDUE</span>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
            {[
              {emoji:"✅",label:"They Replied",action:()=>{updateContact(reviewPending.id,{stage:"Connected"});setReviewPending(null);}},
              {emoji:"🔁",label:"Follow Up Again",action:()=>{const nh=[...(reviewPending.followUpHistory||[]),{date:reviewPending.followUp?.date,notes:"",attempt:(reviewPending.followUpHistory||[]).length+1}];updateContact(reviewPending.id,{followUp:{date:addDays(7),notes:""},followUpHistory:nh});setReviewPending(null);}},
              {emoji:"❌",label:"Lost",action:()=>{updateContact(reviewPending.id,{stage:"Lost"});setReviewPending(null);}}
            ].map(o=><button key={o.label} onClick={o.action} style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:10,padding:"12px 8px",cursor:"pointer",textAlign:"center"}}><div style={{fontSize:20,marginBottom:4}}>{o.emoji}</div><div style={{fontSize:12,color:"rgba(174,220,255,0.55)",fontWeight:600}}>{o.label}</div></button>)}
          </div>
          <div style={{display:"flex",justifyContent:"flex-end"}}><Btn variant="ghost" onClick={()=>setReviewPending(null)}>Later</Btn></div>
        </Modal>
      )}
    </div>
  );
}
