            </div>
            <div style={{overflowX:"auto",borderRadius:12,border:"1px solid #e2e8f0",background:"#fff"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead style={{background:"#f8fafc"}}><tr>{["First","Last","Email","Phone","Platform","Stage","Client Name","Account Name","Project Type","Budget","Actions"].map(h=><th key={h} style={{padding:"9px 12px",textAlign:"left",color:"#94a3b8",fontWeight:600,fontSize:11,borderBottom:"1px solid #e2e8f0",whiteSpace:"nowrap",textTransform:"uppercase",letterSpacing:"0.05em"}}>{h}</th>)}</tr></thead>
                <tbody>{contacts.map(c=>{const sc=FP_COLORS[c.source]||"#64748b";const stc=FP_COLORS[c.stage]||"#6366f1";return(<tr key={c.id} style={{borderBottom:"1px solid #f1f5f9"}} onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}><td style={{padding:"9px 12px",color:"#0f172a",fontWeight:600}}>{c.firstName}</td><td style={{padding:"9px 12px",color:"#0f172a"}}>{c.lastName}</td><td style={{padding:"9px 12px",color:"#64748b",fontSize:12}}>{c.email||"—"}</td><td style={{padding:"9px 12px",color:"#64748b",fontSize:12}}>{c.phone||"—"}</td><td style={{padding:"9px 12px"}}><span style={{background:sc+"18",color:sc,border:`1px solid ${sc}33`,borderRadius:20,padding:"2px 9px",fontSize:11,fontWeight:600}}>{c.source||"—"}</span></td><td style={{padding:"9px 12px"}}><span style={{background:stc+"18",color:stc,borderRadius:20,padding:"2px 9px",fontSize:11,fontWeight:600}}>{c.stage}</span></td><td style={{padding:"9px 12px",fontSize:12,color:"#7c3aed",fontWeight:600}}>{c.clientFreelanceName||"—"}</td><td style={{padding:"9px 12px",fontSize:12,color:"#0369a1"}}>{c.freelanceAccountName||"—"}</td><td style={{padding:"9px 12px",fontSize:12,color:"#64748b"}}>{c.projectType||"—"}</td><td style={{padding:"9px 12px",fontSize:12,color:"#16a34a",fontWeight:600}}>{c.clientBudget||"—"}</td><td style={{padding:"9px 12px"}}><div style={{display:"flex",gap:5}}>{c.jobLink&&<a href={c.jobLink} target="_blank" rel="noreferrer" style={{background:"#eff6ff",color:"#3b82f6",borderRadius:5,padding:"3px 7px",fontSize:11,fontWeight:600}}>Job↗</a>}<button onClick={()=>setEditModal(c)} style={{background:"#f8fafc",color:"#64748b",border:"1px solid #e2e8f0",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:11}}>✏</button><button onClick={()=>deleteContact(c.id)} style={{background:"#fef2f2",color:"#ef4444",border:"none",borderRadius:5,padding:"3px 8px",cursor:"pointer",fontSize:11}}>🗑</button></div></td></tr>);})}</tbody>
              </table>
            </div>
          </div>
        )}
        {tab==="Calendar"&&(
          <div>
            {[{label:"OVERDUE",items:overdueContacts,bg:"#fef2f2",border:"#fecaca",titleColor:"#dc2626",badge:(d)=><span style={{background:"#fef2f2",color:"#dc2626",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>OVERDUE</span>},{label:"TODAY",items:todayContacts,bg:"#fffbeb",border:"#fde68a",titleColor:"#d97706",badge:()=><span style={{background:"#fffbeb",color:"#d97706",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>TODAY</span>},{label:"UPCOMING (7 DAYS)",items:upcomingContacts,bg:"#eff6ff",border:"#bfdbfe",titleColor:"#1d4ed8",badge:()=><span style={{background:"#eff6ff",color:"#1d4ed8",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>UPCOMING</span>}].map(group=>group.items.length>0&&(
              <div key={group.label} style={{background:group.bg,border:`1px solid ${group.border}`,borderRadius:12,padding:"12px 16px",marginBottom:18}}>
                <div style={{fontWeight:700,color:group.titleColor,marginBottom:8}}>🔔 {group.label} ({group.items.length})</div>
                {group.items.map(c=><div key={c.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderTop:`1px solid ${group.border}`,alignItems:"center"}}><span style={{color:"#0f172a",fontWeight:600}}>{c.firstName} {c.lastName}<span style={{color:"#64748b",fontSize:12,fontWeight:400}}> · {c.followUp?.date} · {c.source}</span></span><div style={{display:"flex",gap:6}}>{group.badge(c.followUp?.date)}<button onClick={()=>setReviewPending(c)} style={{background:"#eef2ff",color:"#6366f1",border:"none",borderRadius:8,padding:"3px 10px",cursor:"pointer",fontSize:11,fontWeight:600}}>Review →</button></div></div>)}
              </div>
            ))}
            {overdueContacts.length===0&&todayContacts.length===0&&upcomingContacts.length===0&&<div style={{color:"#94a3b8",fontSize:13,textAlign:"center",padding:40}}>✅ No follow-ups due. All clear!</div>}
          </div>
        )}
        {tab==="Templates"&&(
          <div>
            <div style={{display:"flex",justifyContent:"flex-end",marginBottom:16}}>
              <Btn onClick={()=>setNewTplModal(true)}>+ New Template</Btn>
            </div>
            <div style={{display:"grid",gap:14}}>
              {templates.length===0&&<div style={{color:"#94a3b8",textAlign:"center",padding:40,background:"#fff",borderRadius:12,border:"1px solid #e2e8f0"}}>No templates yet. Click <strong>+ New Template</strong> to create one.</div>}
              {templates.map(t=>(
                <div key={t.id} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,padding:18,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                    <span style={{fontWeight:600,color:"#0f172a",fontSize:14}}>✉️ {t.name}</span>
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={()=>copyText(t.body,()=>{setCopiedTpl(t.id);setTimeout(()=>setCopiedTpl(null),1500);})} style={{background:copiedTpl===t.id?"#f0fdf4":"#eef2ff",color:copiedTpl===t.id?"#16a34a":"#6366f1",border:"none",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:12,fontWeight:600}}>{copiedTpl===t.id?"✓ Copied!":"📋 Copy"}</button>
                      <button onClick={()=>{if(confirm(`Delete template "${t.name}"?`))deleteFPTemplate(t.id);}} style={{background:"#fef2f2",color:"#ef4444",border:"none",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:12}}>🗑</button>
                    </div>
                  </div>
                  <p style={{color:"#64748b",fontSize:13,lineHeight:1.7,margin:0,background:"#f8fafc",borderRadius:8,padding:"10px 12px",border:"1px solid #f1f5f9"}}>{t.body}</p>
                </div>
              ))}
            </div>
            {newTplModal&&<FPNewTemplateModal onClose={()=>setNewTplModal(false)} onSave={addTemplate}/>}
          </div>
        )}
        {tab==="Analytics"&&(
          <div style={{display:"grid",gap:16}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12}}>
              {[{label:"Total",val:stats.total,c:"#6366f1"},{label:"Won",val:stats.won,c:"#22c55e"},{label:"Lost",val:stats.lost,c:"#ef4444"},{label:"Follow Up",val:stats.followUp,c:"#a855f7"},{label:"Win Rate",val:stats.total?Math.round(stats.won/stats.total*100)+"%":"0%",c:"#f59e0b"},{label:"Revenue",val:"$"+stats.revenue.toLocaleString(undefined,{maximumFractionDigits:0}),c:"#22c55e"}].map(k=><div key={k.label} style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:12,padding:"14px 16px",boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}><div style={{fontWeight:700,fontSize:22,color:k.c}}>{k.val}</div><div style={{fontSize:12,color:"#64748b",marginTop:2}}>{k.label}</div></div>)}
            </div>
            <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:14,padding:20,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
              <div style={{fontWeight:700,color:"#0f172a",marginBottom:16,fontSize:14}}>Pipeline by Stage</div>
              {FP_STAGES.map(s=>{ const count=contacts.filter(c=>c.stage===s).length; const max=Math.max(...FP_STAGES.map(st=>contacts.filter(c=>c.stage===st).length),1); return <div key={s} style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:FP_COLORS[s],fontWeight:600}}>{s}</span><span style={{color:"#94a3b8"}}>{count}</span></div><div style={{background:"#f1f5f9",borderRadius:6,height:8,overflow:"hidden"}}><div style={{width:`${(count/max)*100}%`,background:FP_COLORS[s],height:"100%",borderRadius:6}}/></div></div>; })}
            </div>
            <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:14,padding:20,boxShadow:"0 1px 3px rgba(0,0,0,0.06)"}}>
              <div style={{fontWeight:700,color:"#0f172a",marginBottom:16,fontSize:14}}>Leads by Platform</div>
              {FP_SOURCE_STAGES.map(src=>{ const count=contacts.filter(c=>c.source===src).length; const won=contacts.filter(c=>c.source===src&&c.stage==="WON").length; const max=Math.max(...FP_SOURCE_STAGES.map(s=>contacts.filter(c=>c.source===s).length),1); const sc=FP_COLORS[src]||"#6366f1"; return <div key={src} style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:sc,fontWeight:600}}>{src}</span><span style={{color:"#94a3b8"}}>{count} leads · <span style={{color:"#22c55e",fontWeight:600}}>{won} won</span></span></div><div style={{background:"#f1f5f9",borderRadius:6,height:8,overflow:"hidden"}}><div style={{width:`${(count/max)*100}%`,background:sc,height:"100%",borderRadius:6}}/></div></div>; })}
            </div>
          </div>
        )}
      </div>
      {/* Modals */}
      {addModal&&<FPAddModal source={addModal} onClose={()=>setAddModal(null)} onSave={addContact}/>}
      {editModal&&<FPEditModal contact={editModal} onClose={()=>setEditModal(null)} onSave={saveContact} onDelete={deleteContact} saving={saving}/>}
      {connectedPending&&<FPConnectedModal contact={connectedPending} onClose={()=>setConnectedPending(null)} onSave={saveConnected}/>}
      {fuPending&&<FPFollowUpModal contact={fuPending} onClose={()=>setFuPending(null)} onSave={saveFU}/>}
      {wonPending&&<FPWonModal contact={wonPending} onClose={()=>setWonPending(null)} onSave={saveWon}/>}
      {lostPending&&<FPLostModal contact={lostPending} onClose={()=>setLostPending(null)} onSave={tags=>{const merged=[...new Set([...(lostPending.tags||[]),...tags])];updateContact(lostPending.id,{stage:"Lost",tags:merged});setLostPending(null);}}/>}
      {reviewPending&&(
        <Modal title={`🔔 Follow-Up — ${reviewPending.firstName} ${reviewPending.lastName}`} onClose={()=>setReviewPending(null)}>
          <div style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"10px 14px",marginBottom:16,fontSize:13,color:"#d97706"}}>
            📅 Follow-up scheduled for <strong>{reviewPending.followUp?.date}</strong>
            {reviewPending.followUp?.date<today&&<span style={{marginLeft:8,background:"#fef2f2",color:"#dc2626",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:700}}>OVERDUE</span>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
            {[
              {emoji:"✅",label:"They Replied",action:()=>{updateContact(reviewPending.id,{stage:"Connected"});setReviewPending(null);}},
              {emoji:"🔁",label:"Follow Up Again",action:()=>{const nh=[...(reviewPending.followUpHistory||[]),{date:reviewPending.followUp?.date,notes:"",attempt:(reviewPending.followUpHistory||[]).length+1}];updateContact(reviewPending.id,{followUp:{date:addDays(7),notes:""},followUpHistory:nh});setReviewPending(null);}},
              {emoji:"❌",label:"Lost",action:()=>{updateContact(reviewPending.id,{stage:"Lost"});setReviewPending(null);}}
            ].map(o=><button key={o.label} onClick={o.action} style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:10,padding:"12px 8px",cursor:"pointer",textAlign:"center"}}><div style={{fontSize:20,marginBottom:4}}>{o.emoji}</div><div style={{fontSize:12,color:"#64748b",fontWeight:600}}>{o.label}</div></button>)}
          </div>
          <div style={{display:"flex",justifyContent:"flex-end"}}><Btn variant="ghost" onClick={()=>setReviewPending(null)}>Later</Btn></div>
        </Modal>
      )}
    </div>
  );
}

function AllContactsView({search="",setSearch=()=>{}}){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filterPipeline,setFilterPipeline]=useState("All");
  const [filterIndustry,setFilterIndustry]=useState("All");
  const [filterStage,setFilterStage]=useState("All");

  useEffect(()=>{
    setLoading(true);
    Promise.all([sbGetAll("leads"),sbGetAll("hot_pipeline"),sbGetAll("freelance_pipeline")]).then(([li,hp,fp])=>{
      const liRows=(li||[]).map(r=>({id:"li_"+r.id,firstName:r.first_name||"",lastName:r.last_name||"",company:r.affiliate_network||"",industry:r.industry||"",email:r.email||"",phone:r.phone||"",website:r.website||"",linkedinUrl:r.linkedin_url||"",pipeline:"LinkedIn Pipeline",stage:r.stage||""}));
      const hpRows=(hp||[]).map(r=>({id:"hp_"+r.id,firstName:r.first_name||"",lastName:r.last_name||"",company:r.account_name||"",industry:r.industry||"",email:r.email||"",phone:r.phone||"",website:r.website||"",linkedinUrl:r.linkedin_url||"",pipeline:"Hot Pipeline",stage:r.stage||""}));
      const fpRows=(fp||[]).map(r=>({id:"fp_"+r.id,firstName:r.first_name||"",lastName:r.last_name||"",company:r.company_name||"",industry:r.project_type||"",email:r.email||"",phone:r.phone||"",website:r.website||"",linkedinUrl:r.linkedin_url||"",pipeline:"Freelance Pipeline",stage:r.stage||""}));
      setRows([...liRows,...hpRows,...fpRows]);
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);

  const industries=useMemo(()=>["All",...[...new Set(rows.map(r=>r.industry).filter(Boolean))].sort()],[rows]);
  const allStages=useMemo(()=>["All",...[...new Set(rows.map(r=>r.stage).filter(Boolean))].sort()],[rows]);

  const filtered=useMemo(()=>{
    const q=search.toLowerCase();
    return rows.filter(r=>{
      if(q&&![r.firstName,r.lastName,r.company,r.industry,r.pipeline,r.stage].join(" ").toLowerCase().includes(q))return false;
      if(filterPipeline!=="All"&&r.pipeline!==filterPipeline)return false;
      if(filterIndustry!=="All"&&r.industry!==filterIndustry)return false;
      if(filterStage!=="All"&&r.stage!==filterStage)return false;
      return true;
    });
  },[rows,search,filterPipeline,filterIndustry,filterStage]);

  function stageColor(pipeline,stage){ return pipeline==="LinkedIn Pipeline"?LI_COLORS[stage]||"#6366f1":pipeline==="Freelance Pipeline"?FP_COLORS[stage]||"#6366f1":HP_COLORS[stage]||"#6366f1"; }
  function pipelineColor(p){ return p==="LinkedIn Pipeline"?"#0a66c2":p==="Freelance Pipeline"?"#29b2fe":"#1dbf73"; }

  function doExport(){
    const h=["First Name","Last Name","Company","Industry","Email","Phone","Website","Pipeline","Stage"];
    const r=filtered.map(c=>[c.firstName,c.lastName,c.company,c.industry,c.email,c.phone,c.website,c.pipeline,c.stage].map(v=>`"${(v||"").replace(/"/g,'""')}"`).join(","));
    const csv=[h.join(","),...r].join("\n");
    const b=new Blob([csv],{type:"text/csv"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="nexsol_contacts.csv";a.click();URL.revokeObjectURL(u);
  }

  const activeFilters=(filterPipeline!=="All"?1:0)+(filterIndustry!=="All"?1:0)+(filterStage!=="All"?1:0);

  const SEL=(val,opts,onChange)=>(
    <select value={val} onChange={e=>onChange(e.target.value)}
      style={{background:val!=="All"?"#eef2ff":"#f8fafc",border:`1px solid ${val!=="All"?"#c7d2fe":"#e2e8f0"}`,color:val!=="All"?"#6366f1":"#475569",borderRadius:7,padding:"4px 10px",fontSize:11,fontWeight:val!=="All"?600:500,cursor:"pointer",outline:"none"}}>
      {opts.map(o=><option key={o}>{o}</option>)}
    </select>
  );

  if(loading)return <Spinner text="Loading all contacts..."/>;

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Toolbar */}
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"11px 20px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <div style={{background:"#eef2ff",border:"1px solid #c7d2fe",borderRadius:9,padding:"4px 12px",display:"flex",gap:6,alignItems:"center"}}>
          <span style={{fontWeight:700,fontSize:14,color:"#6366f1"}}>{filtered.length}</span>
          <span style={{fontSize:11,color:"#94a3b8"}}>of {rows.length} contacts</span>
        </div>
        {activeFilters>0&&(
          <button onClick={()=>{setFilterPipeline("All");setFilterIndustry("All");setFilterStage("All");}}
            style={{background:"#fef2f2",color:"#ef4444",border:"1px solid #fecaca",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>
            ✕ Clear {activeFilters} filter{activeFilters>1?"s":""}
          </button>
        )}
        <div style={{marginLeft:"auto"}}>
          <button onClick={doExport} style={{background:"#f0fdf4",color:"#16a34a",border:"1px solid #bbf7d0",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:12,fontWeight:600}}>⬇ Export CSV</button>
        </div>
      </div>

      {/* Filter bar */}
      <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"8px 20px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:"0.08em",marginRight:2}}>FILTER BY</span>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <span style={{fontSize:11,color:"#64748b",fontWeight:500}}>Pipeline</span>
          {SEL(filterPipeline,["All","LinkedIn Pipeline","Hot Pipeline","Freelance Pipeline"],setFilterPipeline)}
        </div>
        <div style={{width:1,height:16,background:"#e2e8f0",flexShrink:0}}/>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <span style={{fontSize:11,color:"#64748b",fontWeight:500}}>Industry</span>
          {SEL(filterIndustry,industries,setFilterIndustry)}
        </div>
        <div style={{width:1,height:16,background:"#e2e8f0",flexShrink:0}}/>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <span style={{fontSize:11,color:"#64748b",fontWeight:500}}>Stage</span>
          {SEL(filterStage,allStages,setFilterStage)}
        </div>
      </div>

      {/* Table */}
      <div style={{flex:1,overflow:"auto",padding:"16px 20px",background:"#f1f5f9"}}>
        {filtered.length===0?(
          <div style={{textAlign:"center",padding:60,color:"#94a3b8"}}>
            <div style={{fontSize:40,marginBottom:12}}>🔍</div>
            <div style={{fontSize:14,fontWeight:600,color:"#64748b"}}>No contacts match your filters.</div>
          </div>
        ):(
          <div style={{background:"#fff",borderRadius:14,border:"1px solid #e2e8f0",overflowX:"auto",boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead>
                <tr style={{background:"#f8fafc"}}>
                  {["First Name","Last Name","Company","Industry","Email","Phone","Website","Pipeline","Stage"].map(h=>(
                    <th key={h} style={{padding:"10px 14px",textAlign:"left",color:"#94a3b8",fontWeight:700,fontSize:11,borderBottom:"1px solid #e2e8f0",whiteSpace:"nowrap",textTransform:"uppercase",letterSpacing:"0.05em"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map(c=>(
                  <tr key={c.id} style={{borderBottom:"1px solid #f1f5f9",transition:"background .1s"}}
                    onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"}
                    onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <td style={{padding:"10px 14px",fontWeight:600}}>
                      {c.linkedinUrl
                        ?<a href={c.linkedinUrl} target="_blank" rel="noreferrer" style={{color:"#0a66c2",fontWeight:600,display:"inline-flex",alignItems:"center",gap:4}}>
                            {c.firstName||"—"}
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#0a66c2" strokeWidth="2.5" strokeLinecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                          </a>
                        :<span style={{color:"#0f172a"}}>{c.firstName||"—"}</span>}
                    </td>
                    <td style={{padding:"10px 14px",color:"#0f172a"}}>{c.lastName||"—"}</td>
                    <td style={{padding:"10px 14px",color:"#475569",fontSize:12}}>{c.company||<span style={{color:"#cbd5e1"}}>—</span>}</td>
                    <td style={{padding:"10px 14px",color:"#64748b",fontSize:12}}>{c.industry||<span style={{color:"#cbd5e1"}}>—</span>}</td>
                    <td style={{padding:"10px 14px",fontSize:12}}>
                      {c.email
                        ?<a href={"mailto:"+c.email} style={{color:"#6366f1",fontWeight:500}}>{c.email}</a>
                        :<span style={{color:"#cbd5e1"}}>—</span>}
                    </td>
                    <td style={{padding:"10px 14px",fontSize:12}}>
                      {c.phone
                        ?<a href={"tel:"+c.phone} style={{color:"#475569",fontWeight:500}}>{c.phone}</a>
                        :<span style={{color:"#cbd5e1"}}>—</span>}
                    </td>
                    <td style={{padding:"10px 14px",maxWidth:180,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {c.website
                        ?<a href={c.website.startsWith("http")?c.website:"https://"+c.website} target="_blank" rel="noreferrer" style={{color:"#6366f1",fontSize:12,fontWeight:500,display:"flex",alignItems:"center",gap:4}}>
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#6366f1" strokeWidth="2" strokeLinecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                            {c.website.replace(/^https?:\/\//,"").replace(/\/$/,"").substring(0,26)}{c.website.replace(/^https?:\/\//,"").length>26?"…":""}
                          </a>
                        :<span style={{color:"#cbd5e1"}}>—</span>}
                    </td>
                    <td style={{padding:"10px 14px"}}>
                      <span style={{background:pipelineColor(c.pipeline)+"18",color:pipelineColor(c.pipeline),border:`1px solid ${pipelineColor(c.pipeline)}30`,borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>{c.pipeline}</span>
                    </td>
                    <td style={{padding:"10px 14px"}}>
                      {c.stage
                        ?<span style={{background:stageColor(c.pipeline,c.stage)+"18",color:stageColor(c.pipeline,c.stage),border:`1px solid ${stageColor(c.pipeline,c.stage)}30`,borderRadius:20,padding:"2px 10px",fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>{c.stage}</span>
                        :<span style={{color:"#cbd5e1"}}>—</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function SettingsModal({darkMode,onToggleDark,onClose}){
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{background:"#fff",border:"1px solid #e2e8f0",borderRadius:18,padding:"26px 28px",width:420,maxWidth:"92vw",boxShadow:"0 24px 64px rgba(0,0,0,0.16)"}}>
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
          <div style={{display:"flex",alignItems:"center",gap:9}}>
            <div style={{background:"#f1f5f9",borderRadius:10,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6366f1" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </div>
            <div>
              <div style={{fontWeight:700,fontSize:15,color:"#0f172a"}}>Settings</div>
              <div style={{fontSize:11,color:"#94a3b8"}}>Manage your preferences</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#94a3b8",fontSize:20,cursor:"pointer",lineHeight:1,padding:4}}>✕</button>
        </div>

        {/* Display Section */}
        <div style={{marginBottom:8}}>
          <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:"0.1em",marginBottom:10}}>DISPLAY</div>

          {/* Dark Mode row */}
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",background:"#f8fafc",borderRadius:12,border:"1px solid #e2e8f0"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:18}}>{darkMode?"🌙":"☀️"}</span>
              <div>
                <div style={{fontWeight:600,fontSize:13,color:"#0f172a"}}>Dark Mode</div>
                <div style={{fontSize:11,color:"#94a3b8",marginTop:1}}>{darkMode?"Dark theme active":"Light theme active"}</div>
              </div>
            </div>
            {/* Toggle pill */}
            <div onClick={onToggleDark}
              style={{width:46,height:26,background:darkMode?"#6366f1":"#e2e8f0",borderRadius:13,cursor:"pointer",position:"relative",transition:"background 0.25s",flexShrink:0}}>
              <div style={{width:20,height:20,background:"#fff",borderRadius:"50%",position:"absolute",top:3,left:darkMode?23:3,transition:"left 0.25s",boxShadow:"0 1px 4px rgba(0,0,0,0.22)"}}/>
            </div>
          </div>
        </div>

        <div style={{marginTop:22,display:"flex",justifyContent:"flex-end"}}>
          <Btn variant="ghost" onClick={onClose}>Close</Btn>
        </div>
      </div>
    </div>
  );
}

function NavIcon({name,active}){
  const c=active?"#fff":"#64748b";
  const s={stroke:c,fill:"none",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"};
  const icons={
    dashboard:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
    pipeline:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><rect x="2" y="4" width="6" height="16"/><rect x="9" y="8" width="6" height="12"/><rect x="16" y="12" width="6" height="8"/></svg>,
    contacts:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><circle cx="8" cy="8" r="4"/><path d="M2 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><line x1="18" y1="8" x2="23" y2="8"/><line x1="20.5" y1="5.5" x2="20.5" y2="10.5"/></svg>,
    deals:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/></svg>,
    clients:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
    projects:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>,
    tasks:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
    proposals:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
    invoices:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>,
    import:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
    allcontacts:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>,
    freelance:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>,
    settings:<svg width="15" height="15" viewBox="0 0 24 24" {...s}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
  };
  return icons[name]||null;
}

function ComingSoonView({label}){
  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,color:"#94a3b8",padding:60}}>
      <div style={{width:60,height:60,borderRadius:18,background:"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center",fontSize:30}}>🔜</div>
      <div style={{fontWeight:700,fontSize:18,color:"#0f172a"}}>{label} — Coming Soon</div>
      <div style={{fontSize:13,color:"#64748b"}}>This feature is currently under development.</div>
    </div>
  );
}

function App(){
  const [gate,setGate]=useState("pipeline");
  const [darkMode,setDarkMode]=useState(false);
  const [showSettings,setShowSettings]=useState(false);
  const [search,setSearch]=useState("");
  const [pipelineRevenue,setPipelineRevenue]=useState(null);

  useEffect(()=>{ document.body.classList.toggle("dark-mode",darkMode); },[darkMode]);
  useEffect(()=>{ setSearch(""); setPipelineRevenue(null); },[gate]);

  const NAV=[
    {section:"OVERVIEW",items:[{key:"dashboard",label:"Dashboard",soon:true},{key:"allcontacts",label:"All Contacts"}]},
    {section:"PIPELINE",items:[{key:"pipeline",label:"Hot Pipeline"},{key:"contacts",label:"LinkedIn Pipeline"},{key:"freelance",label:"Freelance Pipeline"},{key:"clients",label:"Active Clients"}]},
    {section:"DELIVERY",items:[{key:"projects",label:"Projects",soon:true},{key:"tasks",label:"Tasks",soon:true}]},
    {section:"REVENUE",items:[{key:"proposals",label:"Proposals",soon:true},{key:"invoices",label:"Invoices",soon:true}]},
    {section:"DATA",items:[{key:"import",label:"Import",soon:true},{key:"settings",label:"Settings"}]},
  ];
  const titles={dashboard:"Dashboard",allcontacts:"All Contacts",pipeline:"Hot Pipeline",contacts:"LinkedIn Pipeline",freelance:"Freelance Pipeline",deals:"Deals",clients:"Active Clients",projects:"Projects",tasks:"Tasks",proposals:"Proposals",invoices:"Invoices",import:"Import",settings:"Settings"};

  return (
    <div style={{display:"flex",height:"100vh",background:"#f1f5f9",overflow:"hidden"}}>
      {/* Sidebar */}
      <div style={{width:220,background:"#fff",borderRight:"1px solid #e2e8f0",display:"flex",flexDirection:"column",flexShrink:0,overflowY:"auto"}}>
        {/* Logo */}
        <div style={{padding:"18px 16px 16px",borderBottom:"1px solid #f1f5f9",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
          <div style={{background:"#6366f1",borderRadius:10,width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:800,fontSize:15,flexShrink:0}}>F</div>
          <span style={{fontWeight:700,fontSize:14,color:"#0f172a"}}>Nexsol LLC</span>
        </div>
        {/* Nav */}
        <nav style={{padding:"12px 8px",flex:1}}>
          {NAV.map(sec=>(
            <div key={sec.section} style={{marginBottom:20}}>
              <div style={{fontSize:10,fontWeight:700,color:"#94a3b8",letterSpacing:"0.1em",padding:"0 8px",marginBottom:4}}>{sec.section}</div>
              {sec.items.map(item=>{
                const active=gate===item.key&&item.key!=="settings";
                return (
                  <button key={item.key} className="nav-btn" onClick={()=>{if(item.soon)return;if(item.key==="settings"){setShowSettings(true);return;}setGate(item.key);}}
                    style={{width:"100%",background:active?"#6366f1":"transparent",color:active?"#fff":item.soon?"#cbd5e1":"#475569",border:"none",borderRadius:8,padding:"7px 10px",cursor:item.soon?"default":"pointer",fontWeight:active?600:500,fontSize:13,display:"flex",alignItems:"center",gap:9,textAlign:"left",transition:"background .15s",marginBottom:2}}>
                    <NavIcon name={item.key} active={active}/>
                    <span style={{flex:1}}>{item.label}</span>
                    {item.soon&&<span style={{background:"#f1f5f9",color:"#94a3b8",borderRadius:20,padding:"1px 7px",fontSize:10,fontWeight:500}}>soon</span>}
                  </button>
                );
              })}
            </div>
          ))}
        </nav>
        <div style={{padding:"12px 16px",borderTop:"1px solid #f1f5f9",fontSize:11,color:"#22c55e",display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
          <span style={{width:6,height:6,background:"#22c55e",borderRadius:"50%",display:"inline-block",flexShrink:0}}/>Supabase Connected
        </div>
      </div>
      {/* Main */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {/* Top Header */}
        <div style={{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"0 24px",height:58,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <h1 style={{fontWeight:700,fontSize:18,color:"#0f172a",margin:0}}>{titles[gate]||"CRM"}</h1>
            {pipelineRevenue!=null&&(
              <div style={{background:pipelineRevenue.color+"15",border:`2px solid ${pipelineRevenue.color}44`,borderRadius:10,padding:"5px 13px",display:"flex",flexDirection:"column",gap:1}}>
                <span style={{fontWeight:800,fontSize:15,color:pipelineRevenue.color,lineHeight:1}}>${pipelineRevenue.val.toLocaleString(undefined,{maximumFractionDigits:0})}</span>
                <span style={{fontSize:9,color:"#64748b",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.05em"}}>{pipelineRevenue.label}</span>
              </div>
            )}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <div style={{position:"relative"}}>
              <svg style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…" style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:8,padding:"7px 32px 7px 32px",fontSize:13,color:"#0f172a",outline:"none",width:190,transition:"border-color .15s"}} onFocus={e=>e.target.style.borderColor="#6366f1"} onBlur={e=>e.target.style.borderColor="#e2e8f0"}/>
              {search&&<span onClick={()=>setSearch("")} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:"#94a3b8",cursor:"pointer",fontSize:15,lineHeight:1,fontWeight:400}}>×</span>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:34,height:34,background:"#6366f1",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:13,flexShrink:0}}>👤</div>
            </div>
          </div>
        </div>
        {/* Content */}
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          {gate==="pipeline"?<HotPipelineGate search={search} setSearch={setSearch} onRevenue={setPipelineRevenue}/>:gate==="contacts"?<LinkedInGate search={search} setSearch={setSearch} onRevenue={setPipelineRevenue}/>:gate==="freelance"?<FreelancePipelineGate search={search} onRevenue={setPipelineRevenue}/>:gate==="clients"?<ActiveClientsGate search={search} setSearch={setSearch} onRevenue={setPipelineRevenue}/>:gate==="allcontacts"?<AllContactsView search={search} setSearch={setSearch}/>:<ComingSoonView label={titles[gate]||gate}/>}
        </div>
      </div>
      {showSettings&&<SettingsModal darkMode={darkMode} onToggleDark={()=>setDarkMode(v=>!v)} onClose={()=>setShowSettings(false)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
