function AllContactsView({search="",setSearch=()=>{}}){
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filterPipeline,setFilterPipeline]=useState("All");
  const [filterIndustry,setFilterIndustry]=useState("All");
  const [filterStage,setFilterStage]=useState("All");

  useEffect(()=>{
    setLoading(true);
    Promise.all([sbGetAll("leads"),sbGetAll("hot_pipeline"),sbGetAll("freelance_pipeline"),sbGetAll("cold_calling"),sbGetAll("email_campaign"),sbGetAll("paid_leads")]).then(([li,hp,fp,cc,ec,pl])=>{
      const liRows=(li||[]).map(r=>({id:"li_"+r.id,firstName:r.first_name||"",lastName:r.last_name||"",company:r.affiliate_network||r.company_name||"",industry:r.industry||"",email:r.email||"",phone:r.phone_number||"",website:r.website||"",linkedinUrl:r.linkedin_url||"",pipeline:"LinkedIn Pipeline",stage:r.stage||""}));
      const hpRows=(hp||[]).map(r=>({id:"hp_"+r.id,firstName:r.first_name||"",lastName:r.last_name||"",company:r.account_name||"",industry:r.industry||"",email:r.email||"",phone:"",website:r.website||"",linkedinUrl:r.linkedin_url||"",pipeline:"Hot Pipeline",stage:r.stage||""}));
      const fpRows=(fp||[]).map(r=>({id:"fp_"+r.id,firstName:r.first_name||"",lastName:r.last_name||"",company:r.company_name||"",industry:r.project_type||"",email:r.email||"",phone:r.phone||"",website:r.website||"",linkedinUrl:r.linkedin_url||"",pipeline:"Freelance Pipeline",stage:r.stage||""}));
      const ccRows=(cc||[]).map(r=>({id:"cc_"+r.id,firstName:r.first_name||"",lastName:r.last_name||"",company:r.company_name||"",industry:r.industry||"",email:r.email||"",phone:r.phone_number||"",website:r.website||"",linkedinUrl:r.linkedin_url||"",pipeline:"Cold Calling",stage:r.stage||""}));
      const ecRows=(ec||[]).map(r=>({id:"ec_"+r.id,firstName:r.first_name||"",lastName:r.last_name||"",company:r.company_name||"",industry:r.industry||"",email:r.email||"",phone:r.phone||"",website:r.website||"",linkedinUrl:r.linkedin_url||"",pipeline:"Email Campaign",stage:r.stage||""}));
      const plRows=(pl||[]).map(r=>({id:"pl_"+r.id,firstName:r.first_name||"",lastName:r.last_name||"",company:r.company_name||"",industry:r.industry||"",email:r.email||"",phone:r.phone_number||"",website:r.website||"",linkedinUrl:r.linkedin_url||"",pipeline:"Paid Leads",stage:r.stage||""}));
      setRows([...liRows,...hpRows,...fpRows,...ccRows,...ecRows,...plRows]);
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);

  const industries=useMemo(()=>["All",...[...new Set(rows.map(r=>r.industry).filter(Boolean))].sort()],[rows]);
  const allStages=useMemo(()=>["All",...[...new Set(rows.map(r=>r.stage).filter(Boolean))].sort()],[rows]);

  const filtered=useMemo(()=>{
    const q=search.toLowerCase();
    return rows.filter(r=>{
      if(q&&![r.firstName,r.lastName,r.company,r.industry,r.pipeline,r.stage].join(" ").toLowerCase().includes(q))return false;
      if(filterPipeline!=="All"&&r.pipeline!==filterPipeline)return false;
      if(filterIndustry!=="All"&&r.industry!==filterIndustry)return false;
      if(filterStage!=="All"&&r.stage!==filterStage)return false;
      return true;
    });
  },[rows,search,filterPipeline,filterIndustry,filterStage]);

  function stageColor(pipeline,stage){ return pipeline==="LinkedIn Pipeline"?LI_COLORS[stage]||"#23a1dd":pipeline==="Freelance Pipeline"?FP_COLORS[stage]||"#23a1dd":pipeline==="Cold Calling"?CC_COLORS[stage]||"#23a1dd":pipeline==="Email Campaign"?EC_COLORS[stage]||"#23a1dd":pipeline==="Paid Leads"?PL_COLORS[stage]||"#23a1dd":HP_COLORS[stage]||"#23a1dd"; }
  function pipelineColor(p){ return p==="LinkedIn Pipeline"?"#0a66c2":p==="Freelance Pipeline"?"#29b2fe":p==="Cold Calling"?"#a855f7":p==="Email Campaign"?"#f59e0b":p==="Paid Leads"?"#ff6b35":"#1dbf73"; }

  function doExport(){
    const h=["First Name","Last Name","Company","Industry","Email","Phone","Website","Pipeline","Stage"];
    const r=filtered.map(c=>[c.firstName,c.lastName,c.company,c.industry,c.email,c.phone,c.website,c.pipeline,c.stage].map(v=>`"${(v||"").replace(/"/g,'""')}"`).join(","));
    const csv=[h.join(","),...r].join("\n");
    const b=new Blob([csv],{type:"text/csv"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="nexsol_contacts.csv";a.click();URL.revokeObjectURL(u);
  }

  const activeFilters=(filterPipeline!=="All"?1:0)+(filterIndustry!=="All"?1:0)+(filterStage!=="All"?1:0);

  const SEL=(val,opts,onChange)=>(
    <select value={val} onChange={e=>onChange(e.target.value)}
      style={{background:val!=="All"?"rgba(35,161,221,0.14)":"rgba(255,255,255,0.05)",border:`1px solid ${val!=="All"?"rgba(35,161,221,0.3)":"rgba(255,255,255,0.09)"}`,color:val!=="All"?"#04bee7":"rgba(200,230,255,0.6)",borderRadius:7,padding:"4px 10px",fontSize:11,fontWeight:val!=="All"?600:500,cursor:"pointer",outline:"none",backdropFilter:"blur(8px)"}}>
      {opts.map(o=><option key={o}>{o}</option>)}
    </select>
  );

  if(loading)return <Spinner text="Loading all contacts..."/>;

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      {/* Toolbar */}
      <div style={{background:"rgba(255,255,255,0.05)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"11px 20px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <div style={{background:"rgba(35,161,221,0.12)",border:"1px solid rgba(35,161,221,0.2)",borderRadius:9,padding:"4px 12px",display:"flex",gap:6,alignItems:"center"}}>
          <span style={{fontWeight:700,fontSize:14,color:"#23a1dd"}}>{filtered.length}</span>
          <span style={{fontSize:11,color:"rgba(174,220,255,0.38)"}}>of {rows.length} contacts</span>
        </div>
        {activeFilters>0&&(
          <button onClick={()=>{setFilterPipeline("All");setFilterIndustry("All");setFilterStage("All");}}
            style={{background:"rgba(239,68,68,0.1)",color:"#ef4444",border:"1px solid rgba(239,68,68,0.2)",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>
            ✕ Clear {activeFilters} filter{activeFilters>1?"s":""}
          </button>
        )}
        <div style={{marginLeft:"auto"}}>
          <button onClick={doExport} style={{background:"rgba(54,242,175,0.08)",color:"#36f2af",border:"1px solid rgba(54,242,175,0.2)",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontSize:12,fontWeight:600}}>⬇ Export CSV</button>
        </div>
      </div>

      {/* Filter bar */}
      <div style={{background:"rgba(255,255,255,0.05)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"8px 20px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:10,fontWeight:700,color:"rgba(174,220,255,0.38)",letterSpacing:"0.08em",marginRight:2}}>FILTER BY</span>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <span style={{fontSize:11,color:"rgba(174,220,255,0.55)",fontWeight:500}}>Pipeline</span>
          {SEL(filterPipeline,["All","LinkedIn Pipeline","Hot Pipeline","Freelance Pipeline","Cold Calling","Email Campaign","Paid Leads"],setFilterPipeline)}
        </div>
        <div style={{width:1,height:16,background:"#e2e8f0",flexShrink:0}}/>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <span style={{fontSize:11,color:"rgba(174,220,255,0.55)",fontWeight:500}}>Industry</span>
          {SEL(filterIndustry,industries,setFilterIndustry)}
        </div>
        <div style={{width:1,height:16,background:"#e2e8f0",flexShrink:0}}/>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <span style={{fontSize:11,color:"rgba(174,220,255,0.55)",fontWeight:500}}>Stage</span>
          {SEL(filterStage,allStages,setFilterStage)}
        </div>
      </div>

      {/* Table */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",padding:"16px 20px 0",background:"rgba(255,255,255,0.03)"}}>
        {filtered.length===0?(
          <div style={{textAlign:"center",padding:60,color:"rgba(174,220,255,0.38)"}}>
            <div style={{fontSize:40,marginBottom:12}}>🔍</div>
            <div style={{fontSize:14,fontWeight:600,color:"rgba(174,220,255,0.55)"}}>No contacts match your filters.</div>
          </div>
        ):(
          <div style={{flex:1,overflow:"auto",borderRadius:14,border:"1px solid rgba(255,255,255,0.09)",background:"rgba(255,255,255,0.05)",boxShadow:"0 1px 4px rgba(0,0,0,0.05)",marginBottom:16}}>
            <table style={{borderCollapse:"collapse",fontSize:13,minWidth:"100%"}}>
              <thead>
                <tr style={{background:"rgba(8,18,38,0.95)"}}>
                  <th style={{padding:"10px 14px",textAlign:"left",color:"rgba(174,220,255,0.38)",fontWeight:700,fontSize:11,borderBottom:"1px solid rgba(255,255,255,0.07)",whiteSpace:"nowrap",textTransform:"uppercase",letterSpacing:"0.05em",position:"sticky",top:0,left:0,zIndex:3,background:"rgba(8,18,38,0.97)",boxShadow:"2px 0 6px rgba(0,0,0,0.3)"}}>Name</th>
                  {["Company","Industry","Email","Phone","Website","Pipeline","Stage"].map(h=>(
                    <th key={h} style={{padding:"10px 14px",textAlign:"left",color:"rgba(174,220,255,0.38)",fontWeight:700,fontSize:11,borderBottom:"1px solid rgba(255,255,255,0.07)",whiteSpace:"nowrap",textTransform:"uppercase",letterSpacing:"0.05em",position:"sticky",top:0,zIndex:2,background:"rgba(8,18,38,0.97)"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map(c=>(
                  <tr key={c.id} style={{borderBottom:"1px solid rgba(255,255,255,0.05)",transition:"background .1s"}}

                    <td style={{padding:"10px 14px",whiteSpace:"nowrap"}}>

                        ?<a href={c.website.startsWith("http")?c.website:"https://"+c.website} target="_blank" rel="noreferrer" style={{color:"#23a1dd",fontSize:12,fontWeight:500,display:"inline-flex",alignItems:"center",gap:4}}>

function CCLeadCard({lead,onDragStart,onClick,today}){

  const isOverdueAppt=lead.stage==="Appointment Booked"&&lead.appointment?.date&&lead.appointment.date<today;
  const isOverdue=isOverdueFU||isOverdueAppt;
  return (
    <div draggable onDragStart={e=>onDragStart(e,lead.id)} onClick={()=>onClick(lead)}
      style={{background:"rgba(255,255,255,0.04)",backdropFilter:"blur(12px)",border:`1px solid ${isOverdue?"rgba(239,68,68,0.4)":"rgba(255,255,255,0.08)"}`,borderRadius:10,padding:"11px 13px",cursor:"grab",marginBottom:8,userSelect:"none",transition:"all .15s",boxShadow:"0 4px 16px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.06)"}}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{fontWeight:600,color:"#daeeff",fontSize:13,marginBottom:3}}>{lead.firstName} {lead.lastName}</div>
        {isOverdue&&<span style={{background:"#ef444422",color:"#ef4444",border:"1px solid #ef444444",borderRadius:20,padding:"1px 7px",fontSize:9,fontWeight:700}}>OVERDUE</span>}
      </div>
      {lead.companyName&&<div style={{fontSize:11,color:"rgba(174,220,255,0.55)",marginBottom:2}}>🏢 {lead.companyName}</div>}
      {lead.phoneNumber&&<div style={{fontSize:11,color:"rgba(174,220,255,0.55)",marginBottom:2,display:"flex",alignItems:"center",gap:4}}>📞 <span>{lead.phoneNumber}</span><button onClick={e=>{e.stopPropagation();copyText(lead.phoneNumber);}} title="Copy phone" style={{background:"none",border:"none",cursor:"pointer",padding:"0 2px",color:"rgba(174,220,255,0.4)",fontSize:10,lineHeight:1}}>⧉</button></div>}
      {lead.email&&<div style={{fontSize:11,color:"rgba(174,220,255,0.55)",marginBottom:2,display:"flex",alignItems:"center",gap:4}}>✉️ <span>{lead.email}</span><button onClick={e=>{e.stopPropagation();copyText(lead.email);}} title="Copy email" style={{background:"none",border:"none",cursor:"pointer",padding:"0 2px",color:"rgba(174,220,255,0.4)",fontSize:10,lineHeight:1}}>⧉</button></div>}
      {lead.industry&&<div style={{fontSize:11,color:"rgba(174,220,255,0.55)",marginBottom:2}}>🏭 {lead.industry}</div>}
      {lead.region&&<div style={{fontSize:11,color:"rgba(174,220,255,0.38)",marginBottom:2}}>📍 {lead.region}</div>}
      {lead.source&&<div style={{marginTop:4}}><span style={{background:(CC_COLORS[lead.source]||"#64748b")+"22",color:CC_COLORS[lead.source]||"#64748b",border:`1px solid ${(CC_COLORS[lead.source]||"#64748b")}44`,borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:600}}>{lead.source}</span></div>}
      {lead.callStatus&&<div style={{marginTop:4}}><span style={{background:"rgba(35,161,221,0.1)",color:"#23a1dd",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:600}}>📞 {lead.callStatus}</span></div>}

      {lead.deal?.amount&&<div style={{fontSize:11,color:"#36f2af",marginTop:3,fontWeight:600}}>💰 ${Number(lead.deal.amount).toLocaleString()}</div>}

function CCUploadModal({stage,onClose,onImport}){
  const [preview,setPreview]=useState(null);const [err,setErr]=useState("");const [importing,setImporting]=useState(false);const fileRef=useRef();
  const c=CC_COLORS[stage]||"#3b82f6";
  function handle(text){const rows=parseCCCSV(text,stage);if(!rows.length){setErr("Could not parse file.");setPreview(null);}else{setErr("");setPreview(rows);}}
  async function doImport(){if(!preview)return;setImporting(true);await onImport(preview);setImporting(false);}
  return (
    <Modal title={`📥 Import to ${stage}`} onClose={onClose} wide>
      <div style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:10,padding:12,marginBottom:14}}>
        <div style={{fontSize:12,color:"rgba(174,220,255,0.55)",marginBottom:6,fontWeight:600}}>CSV Headers:</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{["First Name","Last Name","Company Name","Email","Phone Number","Industry","Person Linkedin Url","Website","Trending Product","Affiliate Network"].map(h=><span key={h} style={{background:"rgba(35,161,221,0.1)",color:"#23a1dd",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:500}}>{h}</span>)}</div>
      </div>
      <input ref={fileRef} type="file" accept=".csv" onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>handle(ev.target.result);r.readAsText(f);}}} style={{display:"none"}}/>
      <div onClick={()=>fileRef.current.click()} style={{border:`2px dashed ${c}66`,borderRadius:10,padding:20,textAlign:"center",cursor:"pointer",color:"rgba(174,220,255,0.55)",fontSize:13,marginBottom:12,background:"rgba(255,255,255,0.04)"}}>📂 Click to choose CSV file</div>
      <Tex label="Or paste CSV text" onChange={e=>handle(e.target.value)} style={{fontFamily:"monospace",fontSize:12}}/>
      {err&&<div style={{color:"#ef4444",fontSize:12,marginBottom:8}}>⚠ {err}</div>}
      {preview&&<div style={{background:"rgba(255,255,255,0.04)",border:`1px solid ${c}33`,borderRadius:8,padding:10,marginBottom:10}}><div style={{fontSize:12,color:c,marginBottom:4,fontWeight:600}}>✓ {preview.length} contacts ready</div>{preview.slice(0,5).map((r,i)=><div key={i} style={{fontSize:11,color:"rgba(174,220,255,0.55)",padding:"2px 0"}}>{r.firstName} {r.lastName} · {r.companyName}</div>)}{preview.length>5&&<div style={{fontSize:11,color:"rgba(174,220,255,0.38)"}}>...and {preview.length-5} more</div>}</div>}
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Btn variant="ghost" onClick={onClose}>Cancel</Btn><button onClick={doImport} style={{background:c,color:"#fff",border:"none",borderRadius:8,padding:"8px 16px",cursor:"pointer",fontSize:13,fontWeight:600,opacity:preview&&!importing?1:0.4}}>{importing?"Importing...":`Import ${preview?.length||0} Contacts`}</button></div>
    </Modal>
  );
}

function ColdCallingGate({search="",setSearch=()=>{},onRevenue=()=>{}}){
  const [leads,setLeads]=useState([]);const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState("Kanban");const [stageTab,setStageTab]=useState("All");
  const [modal,setModal]=useState(null);const [addModal,setAddModal]=useState(null);const [uploadModal,setUploadModal]=useState(null);
  const [callStatusPending,setCallStatusPending]=useState(null);const [fuPending,setFuPending]=useState(null);
  const [lostPending,setLostPending]=useState(null);const [apptPending,setApptPending]=useState(null);
  const [wonPending,setWonPending]=useState(null);const [reviewPending,setReviewPending]=useState(null);
  const [dragId,setDragId]=useState(null);const [dragOver,setDragOver]=useState(null);
  const [saving,setSaving]=useState(false);
  const today=todayStr();

  useEffect(()=>{setLoading(true);sbGetAll("cold_calling").then(rows=>{if(Array.isArray(rows))setLeads(rows.map(rowToCC));setLoading(false);}).catch(()=>setLoading(false));},[]);

  const stageCounts=useMemo(()=>{const m={All:leads.length};CC_STAGES.forEach(s=>m[s]=leads.filter(l=>l.stage===s).length);return m;},[leads]);
  const filtered=useMemo(()=>{const q=search.toLowerCase();return leads.filter(l=>(stageTab==="All"||l.stage===stageTab)&&(!q||[l.firstName,l.lastName,l.companyName,l.industry,l.affiliateNetwork,l.phoneNumber].join(" ").toLowerCase().includes(q)));},[leads,search,stageTab]);
  const byStage=useMemo(()=>{const m={};CC_STAGES.forEach(s=>m[s]=filtered.filter(l=>l.stage===s));return m;},[filtered]);
  const stats=useMemo(()=>{const won=leads.filter(l=>l.stage==="Won");return{total:leads.length,won:won.length,lost:leads.filter(l=>l.stage==="Lost").length,dnd:leads.filter(l=>l.stage==="DND").length,active:leads.filter(l=>!["Won","Lost","DND"].includes(l.stage)).length,revenue:won.reduce((s,l)=>s+(parseFloat(l.deal?.amount)||0),0)};},[leads]);
  useEffect(()=>{onRevenue({val:stats.revenue,label:"Revenue Won",color:"#36f2af"});},[stats.revenue]);

  const overdueFU=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date&&l.followUp.date<today),[leads,today]);
  const todayFU=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date===today),[leads,today]);
  const upcomingFU=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date&&l.followUp.date>today&&l.followUp.date<=addDays(7)),[leads,today]);
  const overdueAppt=useMemo(()=>leads.filter(l=>l.stage==="Appointment Booked"&&l.appointment?.date&&l.appointment.date<today),[leads,today]);
  const todayAppt=useMemo(()=>leads.filter(l=>l.stage==="Appointment Booked"&&l.appointment?.date===today),[leads,today]);
  const upcomingAppt=useMemo(()=>leads.filter(l=>l.stage==="Appointment Booked"&&l.appointment?.date&&l.appointment.date>today&&l.appointment.date<=addDays(7)),[leads,today]);
  const reminderCount=overdueFU.length+todayFU.length+overdueAppt.length+todayAppt.length;

  const onDragStart=useCallback((e,id)=>{setDragId(id);e.dataTransfer.effectAllowed="move";},[]);
  const onDragOver=useCallback(stage=>setDragOver(stage),[]);
  const onDragLeave=useCallback(()=>setDragOver(null),[]);
  const updateLead=useCallback(async(id,patch)=>{const lead=leads.find(l=>l.id===id);if(!lead)return;const res=await sbUpdate("cold_calling",id,ccToRow({...lead,...patch}));if(Array.isArray(res)&&res[0])setLeads(p=>p.map(l=>l.id===id?rowToCC(res[0]):l));},[leads]);
  const onDrop=useCallback((e,stage)=>{e.preventDefault();setDragOver(null);if(dragId==null)return;const lead=leads.find(l=>l.id===dragId);if(!lead||lead.stage===stage){setDragId(null);return;}if(stage==="Call Status")setCallStatusPending(lead);else if(stage==="Follow Up")setFuPending(lead);else if(stage==="Lost")setLostPending(lead);else if(stage==="Appointment Booked")setApptPending(lead);else if(stage==="Won")setWonPending(lead);else updateLead(dragId,{stage});setDragId(null);},[dragId,leads,updateLead]);

  async function saveLead(form){setSaving(true);const row=ccToRow(form);if(form.id){const res=await sbUpdate("cold_calling",form.id,row);if(Array.isArray(res)&&res[0])setLeads(p=>p.map(l=>l.id===form.id?rowToCC(res[0]):l));}else{const res=await sbInsert("cold_calling",row);if(Array.isArray(res)&&res[0])setLeads(p=>[...p,rowToCC(res[0])]);} setSaving(false);setModal(null);setAddModal(null);}
  async function deleteLead(id){await sbDelete("cold_calling",id);setLeads(p=>p.filter(l=>l.id!==id));setModal(null);}
  function saveCallStatus(status,note){if(!callStatusPending)return;updateLead(callStatusPending.id,{stage:"Call Status",callStatus:status,callStatusNote:note||""});setCallStatusPending(null);}
  function saveFU(date,time,notes){if(!fuPending)return;const lead=fuPending;const nh=[...(lead.followUpHistory||[]),{date:lead.followUp?.date||date,time:lead.followUp?.time||"",notes:lead.followUp?.notes||"",attempt:(lead.followUpHistory||[]).length+1}];updateLead(lead.id,{stage:"Follow Up",followUp:{date,time,notes},followUpHistory:nh});setFuPending(null);}
  function saveLost(date,reason){if(!lostPending)return;updateLead(lostPending.id,{stage:"Lost",lost:{date,reason}});setLostPending(null);}
  function saveAppt(date,time,notes){if(!apptPending)return;const lead=apptPending;const nh=[...(lead.appointmentHistory||[]),{date:lead.appointment?.date||date,time:lead.appointment?.time||"",notes:lead.appointment?.notes||"",attempt:(lead.appointmentHistory||[]).length+1}];updateLead(lead.id,{stage:"Appointment Booked",appointment:{date,time,notes},appointmentHistory:nh});setApptPending(null);}
  async function saveWon(date,amount){if(!wonPending)return;updateLead(wonPending.id,{stage:"Won",deal:{date,amount:parseFloat(amount)||0}});await sbInsert("hot_pipeline",hpToRow({firstName:wonPending.firstName,lastName:wonPending.lastName,linkedinUrl:"",website:wonPending.website||"",industry:wonPending.industry||"",email:"",accountName:wonPending.companyName||wonPending.affiliateNetwork||"",source:"Calling",stage:"Calling",saleValue:parseFloat(amount)||0,tags:[],followUp:null,deal:null,followUpHistory:[]}));setWonPending(null);}
  async function importLeads(rows,stage){const ins=[],sk=[];for(const row of rows){const dup=leads.some(l=>(row.phoneNumber&&l.phoneNumber&&l.phoneNumber===row.phoneNumber)||(l.firstName?.toLowerCase()===row.firstName?.toLowerCase()&&l.lastName?.toLowerCase()===row.lastName?.toLowerCase()&&l.companyName?.toLowerCase()===row.companyName?.toLowerCase()));if(dup){sk.push(row);continue;}const res=await sbInsert("cold_calling",ccToRow({...row,stage}));if(Array.isArray(res)&&res[0])ins.push(rowToCC(res[0]));}if(ins.length)setLeads(p=>[...p,...ins]);setUploadModal(null);alert(`✅ ${ins.length} imported\n⚠️ ${sk.length} duplicates skipped`);}

  if(loading)return <Spinner text="Loading Cold Calling Pipeline..."/>;

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{background:"rgba(6,14,28,0.6)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",gap:0,overflowX:"auto"}}>
          {["All",...CC_STAGES].map(s=>(
            <button key={s} onClick={()=>setStageTab(s)} style={{background:"none",color:stageTab===s?"#04bee7":"rgba(174,220,255,0.5)",border:"none",borderBottom:stageTab===s?"2px solid #23a1dd":"2px solid transparent",padding:"12px 10px",cursor:"pointer",fontWeight:stageTab===s?600:500,fontSize:12,transition:"all .15s",marginBottom:-1,display:"flex",alignItems:"center",gap:4,whiteSpace:"nowrap"}}>
              {s}<span style={{background:stageTab===s?"#eff6ff":"#f1f5f9",color:stageTab===s?"#3b82f6":"#94a3b8",borderRadius:20,padding:"1px 6px",fontSize:10,fontWeight:600}}>{stageCounts[s]||0}</span>
            </button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0,paddingLeft:10}}>
          <button style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:8,width:32,height:32,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,position:"relative"}}>🔔{reminderCount>0&&<span style={{position:"absolute",top:-3,right:-3,background:"#ef4444",color:"#fff",borderRadius:"50%",width:15,height:15,fontSize:8,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>{reminderCount}</span>}</button>
          <button onClick={()=>exportCCCSV(leads)} style={{background:"rgba(54,242,175,0.08)",color:"#36f2af",border:"1px solid rgba(54,242,175,0.2)",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>⬇ Export All</button>
        </div>
      </div>
      <div style={{background:"rgba(255,255,255,0.05)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"10px 20px",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        {[{label:"Total Leads",val:stats.total,c:"#04bee7"},{label:"Active",val:stats.active,c:"#23a1dd"},{label:"Follow Up",val:stageCounts["Follow Up"]||0,c:"#a855f7"},{label:"Appointment",val:stageCounts["Appointment Booked"]||0,c:"#10b981"},{label:"Won",val:stats.won,c:"#36f2af"},{label:"DND",val:stats.dnd,c:"#94a3b8"}].map(s=>(

function ECLeadCard({lead,onDragStart,onClick,today}){
  const c=EC_COLORS[lead.stage]||"#23a1dd";
  const isOverdueFU=lead.stage==="Follow Up"&&lead.followUp?.date&&lead.followUp.date<today;
  const isOverdueAppt=lead.stage==="Appointment Booked"&&lead.appointment?.date&&lead.appointment.date<today;
  const isOverdue=isOverdueFU||isOverdueAppt;
  return (
    <div draggable onDragStart={e=>onDragStart(e,lead.id)} onClick={()=>onClick(lead)}
      style={{background:"rgba(255,255,255,0.04)",backdropFilter:"blur(12px)",border:`1px solid ${isOverdue?"rgba(239,68,68,0.4)":"rgba(255,255,255,0.08)"}`,borderRadius:10,padding:"11px 13px",cursor:"grab",marginBottom:8,userSelect:"none",transition:"all .15s",boxShadow:"0 4px 16px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.06)"}}
      onMouseEnter={e=>e.currentTarget.style.borderColor=isOverdue?"#ef4444":c+"88"}
      onMouseLeave={e=>e.currentTarget.style.borderColor=isOverdue?"#fca5a5":"rgba(255,255,255,0.08)"}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div style={{fontWeight:600,color:"#daeeff",fontSize:13,marginBottom:3}}>{lead.firstName} {lead.lastName}</div>
        {isOverdue&&<span style={{background:"#ef444422",color:"#ef4444",border:"1px solid #ef444444",borderRadius:20,padding:"1px 7px",fontSize:9,fontWeight:700}}>OVERDUE</span>}
      </div>
      {lead.companyName&&<div style={{fontSize:11,color:"rgba(174,220,255,0.55)",marginBottom:2}}>🏢 {lead.companyName}</div>}
      {lead.email&&<div style={{fontSize:11,color:"rgba(174,220,255,0.55)",marginBottom:2,display:"flex",alignItems:"center",gap:4}}>✉️ <span>{lead.email}</span><button onClick={e=>{e.stopPropagation();copyText(lead.email);}} title="Copy email" style={{background:"none",border:"none",cursor:"pointer",padding:"0 2px",color:"rgba(174,220,255,0.4)",fontSize:10,lineHeight:1}}>⧉</button></div>}
      {lead.phone&&<div style={{fontSize:11,color:"rgba(174,220,255,0.55)",marginBottom:2,display:"flex",alignItems:"center",gap:4}}>📞 <span>{lead.phone}</span><button onClick={e=>{e.stopPropagation();copyText(lead.phone);}} title="Copy phone" style={{background:"none",border:"none",cursor:"pointer",padding:"0 2px",color:"rgba(174,220,255,0.4)",fontSize:10,lineHeight:1}}>⧉</button></div>}
      {lead.industry&&<div style={{fontSize:11,color:"rgba(174,220,255,0.55)",marginBottom:2}}>🏭 {lead.industry}</div>}
      {lead.source&&<div style={{marginTop:4}}><span style={{background:(EC_COLORS[lead.source]||"#64748b")+"22",color:EC_COLORS[lead.source]||"#64748b",border:`1px solid ${(EC_COLORS[lead.source]||"#64748b")}44`,borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:600}}>{lead.source}</span></div>}
      {lead.emailAccount&&<div style={{marginTop:4}}><span style={{background:"rgba(4,190,231,0.1)",color:"#04bee7",borderRadius:20,padding:"1px 8px",fontSize:10,fontWeight:600}}>📧 {lead.emailAccount}</span></div>}
      {lead.connectedDate&&lead.stage==="Connected"&&<div style={{fontSize:11,color:"#01d9dd",marginTop:3}}>🔗 Connected: {lead.connectedDate}</div>}
      {lead.stage==="Follow Up"&&lead.followUp?.date&&<div style={{fontSize:11,color:isOverdueFU?"#ef4444":"#a855f7",marginTop:3}}>📅 {lead.followUp.date}{lead.followUp.time&&` at ${lead.followUp.time}`}{(lead.followUpHistory||[]).length>0&&<span style={{marginLeft:6,background:"rgba(168,85,247,0.12)",color:"#a855f7",borderRadius:20,padding:"0 6px",fontSize:10}}>#{(lead.followUpHistory||[]).length+1}</span>}</div>}
      {lead.stage==="Appointment Booked"&&lead.appointment?.date&&<div style={{fontSize:11,color:isOverdueAppt?"#ef4444":"#10b981",marginTop:3}}>📅 Appt: {lead.appointment.date}{lead.appointment.time&&` at ${lead.appointment.time}`}</div>}
      {lead.deal?.amount&&<div style={{fontSize:11,color:"#36f2af",marginTop:3,fontWeight:600}}>💰 ${Number(lead.deal.amount).toLocaleString()}</div>}
      <div style={{display:"flex",gap:5,marginTop:7}}>
        {lead.linkedinUrl&&<a href={lead.linkedinUrl.startsWith("http")?lead.linkedinUrl:"https://"+lead.linkedinUrl} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} style={{background:"rgba(35,161,221,0.1)",color:"#23a1dd",borderRadius:5,padding:"2px 7px",fontSize:10,fontWeight:600}}>LinkedIn ↗</a>}
        {lead.website&&<a href={lead.website.startsWith("http")?lead.website:"https://"+lead.website} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} style={{background:"rgba(255,255,255,0.04)",color:"rgba(174,220,255,0.55)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:5,padding:"2px 7px",fontSize:10,fontWeight:600}}>Web ↗</a>}
      </div>
    </div>
  );
}

function EmailCampaignGate({search="",setSearch=()=>{},onRevenue=()=>{}}){
  const [leads,setLeads]=useState([]);const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState("Kanban");const [stageTab,setStageTab]=useState("All");
  const [modal,setModal]=useState(null);const [addModal,setAddModal]=useState(null);const [uploadModal,setUploadModal]=useState(null);
  const [templates,setTemplates]=useState([]);const [copiedTpl,setCopiedTpl]=useState(null);const [newTplModal,setNewTplModal]=useState(false);
  const [connectedPending,setConnectedPending]=useState(null);
  const [fuPending,setFuPending]=useState(null);const [lostPending,setLostPending]=useState(null);
  const [apptPending,setApptPending]=useState(null);const [wonPending,setWonPending]=useState(null);
  const [reviewPending,setReviewPending]=useState(null);
  const [dragId,setDragId]=useState(null);const [dragOver,setDragOver]=useState(null);
  const [saving,setSaving]=useState(false);
  const today=todayStr();

  useEffect(()=>{setLoading(true);Promise.all([sbGetAll("email_campaign"),sbGetAll("ec_templates")]).then(([rows,tpl])=>{if(Array.isArray(rows))setLeads(rows.map(rowToEC));if(Array.isArray(tpl))setTemplates(tpl);setLoading(false);}).catch(()=>setLoading(false));},[]);

  const stageCounts=useMemo(()=>{const m={All:leads.length};EC_STAGES.forEach(s=>m[s]=leads.filter(l=>l.stage===s).length);return m;},[leads]);
  const filtered=useMemo(()=>{const q=search.toLowerCase();return leads.filter(l=>(stageTab==="All"||l.stage===stageTab)&&(!q||[l.firstName,l.lastName,l.companyName,l.email,l.industry,l.emailAccount].join(" ").toLowerCase().includes(q)));},[leads,search,stageTab]);
  const byStage=useMemo(()=>{const m={};EC_STAGES.forEach(s=>m[s]=filtered.filter(l=>l.stage===s));return m;},[filtered]);
  const stats=useMemo(()=>{const won=leads.filter(l=>l.stage==="Won");return{total:leads.length,won:won.length,lost:leads.filter(l=>l.stage==="Lost").length,dnd:leads.filter(l=>l.stage==="DND").length,connected:leads.filter(l=>l.stage==="Connected").length,revenue:won.reduce((s,l)=>s+(parseFloat(l.deal?.amount)||0),0)};},[leads]);
  useEffect(()=>{onRevenue({val:stats.revenue,label:"Revenue Won",color:"#36f2af"});},[stats.revenue]);

  const overdueFU=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date&&l.followUp.date<today),[leads,today]);
  const todayFU=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date===today),[leads,today]);
  const upcomingFU=useMemo(()=>leads.filter(l=>l.stage==="Follow Up"&&l.followUp?.date&&l.followUp.date>today&&l.followUp.date<=addDays(7)),[leads,today]);
  const overdueAppt=useMemo(()=>leads.filter(l=>l.stage==="Appointment Booked"&&l.appointment?.date&&l.appointment.date<today),[leads,today]);
  const todayAppt=useMemo(()=>leads.filter(l=>l.stage==="Appointment Booked"&&l.appointment?.date===today),[leads,today]);
  const upcomingAppt=useMemo(()=>leads.filter(l=>l.stage==="Appointment Booked"&&l.appointment?.date&&l.appointment.date>today&&l.appointment.date<=addDays(7)),[leads,today]);
  const reminderCount=overdueFU.length+todayFU.length+overdueAppt.length+todayAppt.length;

  const onDragStart=useCallback((e,id)=>{setDragId(id);e.dataTransfer.effectAllowed="move";},[]);
  const onDragOver=useCallback(stage=>setDragOver(stage),[]);
  const onDragLeave=useCallback(()=>setDragOver(null),[]);

  const updateLead=useCallback(async(id,patch)=>{const lead=leads.find(l=>l.id===id);if(!lead)return;const res=await sbUpdate("email_campaign",id,ecToRow({...lead,...patch}));if(Array.isArray(res)&&res[0])setLeads(p=>p.map(l=>l.id===id?rowToEC(res[0]):l));},[leads]);

  const onDrop=useCallback((e,stage)=>{
    e.preventDefault();setDragOver(null);if(dragId==null)return;
    const lead=leads.find(l=>l.id===dragId);if(!lead||lead.stage===stage){setDragId(null);return;}
    if(stage==="Connected")setConnectedPending(lead);
    else if(stage==="Follow Up")setFuPending(lead);
    else if(stage==="Lost")setLostPending(lead);
    else if(stage==="Appointment Booked")setApptPending(lead);
    else if(stage==="Won")setWonPending(lead);
    else updateLead(dragId,{stage});
    setDragId(null);
  },[dragId,leads,updateLead]);

  async function saveLead(form){setSaving(true);const row=ecToRow(form);if(form.id){const res=await sbUpdate("email_campaign",form.id,row);if(Array.isArray(res)&&res[0])setLeads(p=>p.map(l=>l.id===form.id?rowToEC(res[0]):l));}else{const res=await sbInsert("email_campaign",row);if(Array.isArray(res)&&res[0])setLeads(p=>[...p,rowToEC(res[0])]);} setSaving(false);setModal(null);setAddModal(null);}
  async function deleteLead(id){await sbDelete("email_campaign",id);setLeads(p=>p.filter(l=>l.id!==id));setModal(null);}
  async function importLeads(rows){const inserted=await Promise.all(rows.map(r=>sbInsert("email_campaign",ecToRow(r))));inserted.forEach(res=>{if(Array.isArray(res)&&res[0])setLeads(p=>[...p,rowToEC(res[0])]);});setUploadModal(null);}
  async function addTemplate(name,body){const res=await sbInsert("ec_templates",{name,body});if(Array.isArray(res)&&res[0])setTemplates(p=>[...p,res[0]]);}
  async function deleteTemplate(id){await sbDelete("ec_templates",id);setTemplates(p=>p.filter(t=>t.id!==id));}

  function saveConnected(date,emailAccount){
    if(!connectedPending)return;
    updateLead(connectedPending.id,{stage:"Connected",emailAccount,connectedDate:date});
    setConnectedPending(null);
  }
  function saveFU(date,time,notes){if(!fuPending)return;const lead=fuPending;const nh=[...(lead.followUpHistory||[]),{date:lead.followUp?.date||date,time:lead.followUp?.time||"",notes:lead.followUp?.notes||"",attempt:(lead.followUpHistory||[]).length+1}];updateLead(lead.id,{stage:"Follow Up",followUp:{date,time,notes},followUpHistory:nh});setFuPending(null);}
  function saveLost(date,reason){if(!lostPending)return;updateLead(lostPending.id,{stage:"Lost",lost:{date,reason}});setLostPending(null);}
  function saveAppt(date,time,notes){if(!apptPending)return;const lead=apptPending;const nh=[...(lead.appointmentHistory||[]),{date:lead.appointment?.date||date,time:lead.appointment?.time||"",notes:lead.appointment?.notes||"",attempt:(lead.appointmentHistory||[]).length+1}];updateLead(lead.id,{stage:"Appointment Booked",appointment:{date,time,notes},appointmentHistory:nh});setApptPending(null);}

  async function saveWon(date,amount){
    if(!wonPending)return;
    updateLead(wonPending.id,{stage:"Won",deal:{date,amount:parseFloat(amount)||0}});
    await sbInsert("hot_pipeline",hpToRow({
      firstName:wonPending.firstName,lastName:wonPending.lastName,
      linkedinUrl:"",website:wonPending.website||"",industry:wonPending.industry||"",
      email:wonPending.email||"",accountName:wonPending.emailAccount||wonPending.companyName||"",
      source:"Email",stage:"Email",
      saleValue:parseFloat(amount)||0,tags:[],followUp:null,deal:null,followUpHistory:[]
    }));
    setWonPending(null);
  }

  if(loading)return <Spinner text="Loading Email Campaign..."/>;

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
      <div style={{background:"rgba(6,14,28,0.6)",backdropFilter:"blur(16px)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",gap:0,overflowX:"auto"}}>
          {["All",...EC_STAGES].map(s=>(
            <button key={s} onClick={()=>setStageTab(s)} style={{background:"none",color:stageTab===s?"#04bee7":"rgba(174,220,255,0.5)",border:"none",borderBottom:stageTab===s?"2px solid #23a1dd":"2px solid transparent",padding:"12px 10px",cursor:"pointer",fontWeight:stageTab===s?600:500,fontSize:12,transition:"all .15s",marginBottom:-1,display:"flex",alignItems:"center",gap:4,whiteSpace:"nowrap"}}>
              {s}<span style={{background:stageTab===s?"rgba(35,161,221,0.15)":"rgba(255,255,255,0.06)",color:stageTab===s?"#23a1dd":"rgba(174,220,255,0.38)",borderRadius:20,padding:"1px 6px",fontSize:10,fontWeight:600}}>{stageCounts[s]||0}</span>
            </button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0,paddingLeft:10}}>
          <button style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:8,width:32,height:32,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,position:"relative"}}>🔔{reminderCount>0&&<span style={{position:"absolute",top:-3,right:-3,background:"#ef4444",color:"#fff",borderRadius:"50%",width:15,height:15,fontSize:8,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center"}}>{reminderCount}</span>}</button>
        </div>
      </div>
      <div style={{background:"rgba(255,255,255,0.05)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"10px 20px",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        {[{label:"Total Leads",val:stats.total,c:"#04bee7"},{label:"Connected",val:stats.connected,c:"#01d9dd"},{label:"Follow Up",val:stageCounts["Follow Up"]||0,c:"#a855f7"},{label:"Appointment",val:stageCounts["Appointment Booked"]||0,c:"#10b981"},{label:"Won",val:stats.won,c:"#36f2af"},{label:"DND",val:stats.dnd,c:"#94a3b8"}].map(s=>(
          <div key={s.label} style={{background:"rgba(255,255,255,0.04)",backdropFilter:"blur(10px)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"8px 14px",display:"flex",flexDirection:"column",gap:2,minWidth:100,boxShadow:"0 4px 16px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05)"}}>

            ))}

        {tab==="Contacts"&&(
          <div>

            {upcomingAppt.length>0&&<div style={{background:"rgba(54,242,175,0.07)",border:"1px solid rgba(54,242,175,0.2)",borderRadius:12,padding:"12px 16px",marginBottom:18}}>

        {tab==="Templates"&&(

            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12}}>
              {[{label:"Total",val:stats.total,c:"#04bee7"},{label:"Connected",val:stats.connected,c:"#01d9dd"},{label:"Won",val:stats.won,c:"#36f2af"},{label:"Lost",val:stats.lost,c:"#ef4444"},{label:"DND",val:stats.dnd,c:"#94a3b8"},{label:"Win Rate",val:stats.total?Math.round(stats.won/stats.total*100)+"%":"0%",c:"#a855f7"},{label:"Revenue",val:"$"+stats.revenue.toLocaleString(undefined,{maximumFractionDigits:0}),c:"#f59e0b"}].map(k=><div key={k.label} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:12,padding:"14px 16px",boxShadow:"0 4px 20px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.05)"}}><div style={{fontWeight:700,fontSize:22,color:k.c}}>{k.val}</div><div style={{fontSize:12,color:"rgba(174,220,255,0.55)",marginTop:2}}>{k.label}</div></div>)}
            </div>
            <div style={{background:"rgba(6,14,28,0.6)",backdropFilter:"blur(16px)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:20}}>
              <div style={{fontWeight:700,color:"#daeeff",marginBottom:16,fontSize:14}}>Pipeline by Stage</div>
              {EC_STAGES.map(s=>{const count=leads.filter(l=>l.stage===s).length;const max=Math.max(...EC_STAGES.map(st=>leads.filter(l=>l.stage===st).length),1);return(<div key={s} style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:EC_COLORS[s],fontWeight:600}}>{s}</span><span style={{color:"rgba(174,220,255,0.38)"}}>{count}</span></div><div style={{background:"rgba(255,255,255,0.03)",borderRadius:6,height:8,overflow:"hidden"}}><div style={{width:`${(count/max)*100}%`,background:EC_COLORS[s],height:"100%",borderRadius:6}}/></div></div>);})}

      </div>
      {addModal&&<ECAddModal stage={addModal.stage} onClose={()=>setAddModal(null)} onSave={saveLead}/>}

      {lostPending&&<ECLostModal lead={lostPending} onClose={()=>setLostPending(null)} onSave={saveLost}/>}
      {apptPending&&<ECAppointmentModal lead={apptPending} onClose={()=>setApptPending(null)} onSave={saveAppt}/>}
      {wonPending&&<ECWonModal lead={wonPending} onClose={()=>setWonPending(null)} onSave={saveWon}/>}

                <button key={o.label} onClick={o.action} style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.09)",borderRadius:10,padding:"12px 8px",cursor:"pointer",textAlign:"center"}}>
                  <div style={{fontSize:20,marginBottom:4}}>{o.emoji}</div>

              ))}
            </div>
            <div style={{display:"flex",justifyContent:"flex-end"}}><Btn variant="ghost" onClick={()=>setReviewPending(null)}>Later</Btn></div>
          </Modal>
        ):(
          <Modal title={`📅 Appointment Review — ${reviewPending.lead.firstName} ${reviewPending.lead.lastName}`} onClose={()=>setReviewPending(null)}>

    </div>
  );
}

// ── CLIENT PAYMENTS ───────────────────────────────────────────────────────────

const CP_PAYMENT_SOURCES=["PayPal","Upwork","Fiverr","Wise","Remitly","Stripe","Payoneer","Other"];
const CP_ENTRY_STATUS_COLOR={Paid:"#36f2af",Hold:"#fb923c",Decline:"#ef4444",Pending:"#f59e0b","Balance Lost":"#94a3b8"};

function CPContractEditModal({record,onClose,onSave,saving}){
  const [form,setForm]=useState({paymentSource:record?.paymentSource||"",paymentCondition:record?.paymentCondition||"Before Service",remarks:record?.remarks||""});
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  return(
    <Modal title={`Edit Contract — ${record?.clientName||""}`} onClose={onClose}>
      <Sel label="Payment Source" value={form.paymentSource} onChange={e=>f("paymentSource",e.target.value)}>
        <option value="">— Select Source —</option>
        {CP_PAYMENT_SOURCES.map(s=><option key={s} value={s}>{s}</option>)}
      </Sel>
      <Sel label="Payment Condition" value={form.paymentCondition} onChange={e=>f("paymentCondition",e.target.value)}>
        <option value="Before Service">Before Service</option>
        <option value="After Service">After Service</option>
      </Sel>
      <Tex label="Remarks (if any)" value={form.remarks} onChange={e=>f("remarks",e.target.value)} style={{minHeight:60}}/>
      <div style={{display:"flex",gap:8,marginTop:12,justifyContent:"flex-end"}}>
        <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
        <Btn onClick={()=>onSave(form)} disabled={saving}>{saving?"Saving…":"Save"}</Btn>
      </div>
    </Modal>
  );
}

function CPEntryModal({entry,contracts,selectedDate,onClose,onSave,onDelete,saving}){
  const [form,setForm]=useState({contractKey:entry?.contractKey||"",scheduledDate:entry?.scheduledDate||selectedDate||"",amount:entry?.amount||"",status:entry?.status||"Pending",receivedPkr:entry?.receivedPkr||"",receivedFrom:entry?.receivedFrom||""});
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const sel=contracts.find(c=>c.key===form.contractKey);
  const isEdit=!!(entry?.id);
  return(
    <Modal title={isEdit?"Edit Payment Entry":"Schedule Payment"} onClose={onClose}>
      <Sel label="Client *" value={form.contractKey} onChange={e=>f("contractKey",e.target.value)}>
        <option value="">— Select Client —</option>
        {contracts.map(c=><option key={c.key} value={c.key}>{c.clientName}{c.companyName?` — ${c.companyName}`:""}</option>)}
      </Sel>
      {sel&&<div style={{background:"rgba(35,161,221,0.08)",border:"1px solid rgba(35,161,221,0.14)",borderRadius:8,padding:"7px 12px",fontSize:12,color:"rgba(174,220,255,0.65)",marginBottom:8}}>Contract total: <strong style={{color:"#36f2af"}}>${sel.amountClosed.toLocaleString()}</strong></div>}
      <Inp label="Date *" type="date" value={form.scheduledDate} onChange={e=>f("scheduledDate",e.target.value)}/>
      <Inp label="Amount ($) *" type="number" value={form.amount} onChange={e=>f("amount",e.target.value)} placeholder="Enter payment amount…"/>
      <Sel label="Status" value={form.status} onChange={e=>f("status",e.target.value)}>
        <option value="Pending">Pending</option>
        <option value="Paid">Paid</option>
        <option value="Hold">Hold</option>
        <option value="Decline">Decline</option>
        <option value="Balance Lost">Balance Lost</option>
      </Sel>
      <Inp label="Received in (PKR)" type="number" value={form.receivedPkr} onChange={e=>f("receivedPkr",e.target.value)} placeholder="Enter PKR amount manually…"/>
      <Sel label="Received From" value={form.receivedFrom} onChange={e=>f("receivedFrom",e.target.value)}>
        <option value="">— Select Source —</option>
        {CP_PAYMENT_SOURCES.map(s=><option key={s} value={s}>{s}</option>)}
      </Sel>
      <div style={{display:"flex",gap:8,marginTop:14,justifyContent:"space-between",alignItems:"center"}}>
        <div>{isEdit&&<Btn variant="danger" onClick={()=>onDelete(entry.id)} disabled={saving}>Delete</Btn>}</div>
        <div style={{display:"flex",gap:8}}>
          <Btn variant="ghost" onClick={onClose}>Cancel</Btn>
          <Btn onClick={()=>onSave(form)} disabled={saving||!form.contractKey||!form.scheduledDate||!form.amount}>{saving?"Saving…":"Save"}</Btn>
        </div>
      </div>
    </Modal>
  );
}

function CPCalendarUI({entries,contracts,selectedMonth,onAddEntry,onEditEntry}){
  const [y,m]=selectedMonth.split('-').map(Number);
  const firstDay=new Date(y,m-1,1).getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  const today=new Date().toISOString().slice(0,10);
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:3}}>
        {DAYS.map(d=><div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"rgba(174,220,255,0.32)",padding:"6px 0",textTransform:"uppercase",letterSpacing:"0.07em"}}>{d}</div>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        {cells.map((d,i)=>{
          if(!d)return <div key={`e${i}`}/>;
          const ds=`${selectedMonth}-${String(d).padStart(2,'0')}`;
          const de=entries.filter(e=>e.scheduledDate===ds);
          const isToday=ds===today;
          return(
            <div key={d} onClick={()=>onAddEntry(ds)}
              style={{minHeight:76,background:isToday?"rgba(35,161,221,0.1)":"rgba(255,255,255,0.025)",border:`1px solid ${isToday?"rgba(35,161,221,0.38)":"rgba(255,255,255,0.065)"}`,borderRadius:8,padding:"6px 7px",cursor:"pointer",transition:"all .13s"}}
              onMouseEnter={e=>{e.currentTarget.style.background="rgba(35,161,221,0.07)";e.currentTarget.style.borderColor="rgba(35,161,221,0.22)";}}
              onMouseLeave={e=>{e.currentTarget.style.background=isToday?"rgba(35,161,221,0.1)":"rgba(255,255,255,0.025)";e.currentTarget.style.borderColor=isToday?"rgba(35,161,221,0.38)":"rgba(255,255,255,0.065)";}}>
              <div style={{fontSize:12,fontWeight:isToday?700:500,color:isToday?"#23a1dd":"rgba(174,220,255,0.55)",marginBottom:3}}>{d}</div>
              {de.slice(0,3).map(e=>(
                <div key={e.id} onClick={ev=>{ev.stopPropagation();onEditEntry(e);}}
                  style={{fontSize:10,background:`${CP_ENTRY_STATUS_COLOR[e.status]||"#64748b"}1a`,borderLeft:`2px solid ${CP_ENTRY_STATUS_COLOR[e.status]||"#64748b"}`,borderRadius:"0 4px 4px 0",padding:"2px 5px",marginBottom:2,color:CP_ENTRY_STATUS_COLOR[e.status]||"rgba(174,220,255,0.45)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",cursor:"pointer"}}
                  title={`${e.clientName} — $${e.amount}`}>
                  {e.clientName.split(" ")[0]} ${Number(e.amount).toLocaleString()}
                </div>
              ))}
              {de.length>3&&<div style={{fontSize:9,color:"rgba(174,220,255,0.35)",marginTop:1}}>+{de.length-3} more</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ClientPaymentsGate({search="",setSearch=()=>{},onRevenue=()=>{}}){
  const [clients,setClients]=useState([]);
  const [statuses,setStatuses]=useState([]);
  const [hpContacts,setHpContacts]=useState([]);
  const [cpMeta,setCpMeta]=useState([]);
  const [entries,setEntries]=useState([]);
  const [loading,setLoading]=useState(true);
  const [activeTab,setActiveTab]=useState("contracts");
  const [contractEditModal,setContractEditModal]=useState(null);
  const [entryModal,setEntryModal]=useState(null);
  const [showPendingModal,setShowPendingModal]=useState(false);
  const [showConfirmPaymentModal,setShowConfirmPaymentModal]=useState(false);
  const [saving,setSaving]=useState(false);
  const currentMonth=useMemo(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;},[]);
  const [selectedMonth,setSelectedMonth]=useState(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;});

  useEffect(()=>{
    setLoading(true);
    Promise.all([
      sbGetAll("active_clients"),
      sbGetAll("active_clients_monthly_status"),
      sbGetAll("hot_pipeline"),
      sbGetAll("client_payments").catch(()=>[]),
      sbGetAll("payment_entries").catch(()=>[])
    ]).then(([ac,st,hp,cp,pe])=>{
      if(Array.isArray(ac))setClients(ac.map(rowToAC));
      if(Array.isArray(st))setStatuses(st.map(rowToStatus));
      if(Array.isArray(hp))setHpContacts(hp.map(rowToHP));
      if(Array.isArray(cp))setCpMeta(cp.map(rowToCP));
      if(Array.isArray(pe))setEntries(pe.map(rowToPE));
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);

  // Silent refresh when month changes to pick up new data
  useEffect(()=>{
    Promise.all([
      sbGetAll("active_clients"),
      sbGetAll("active_clients_monthly_status"),
      sbGetAll("hot_pipeline"),
      sbGetAll("client_payments").catch(()=>[]),
      sbGetAll("payment_entries").catch(()=>[])
    ]).then(([ac,st,hp,cp,pe])=>{
      if(Array.isArray(ac))setClients(ac.map(rowToAC));
      if(Array.isArray(st))setStatuses(st.map(rowToStatus));
      if(Array.isArray(hp))setHpContacts(hp.map(rowToHP));
      if(Array.isArray(cp))setCpMeta(cp.map(rowToCP));
      if(Array.isArray(pe))setEntries(pe.map(rowToPE));
    }).catch(()=>{});
  },[selectedMonth]);

  const allContracts=useMemo(()=>{
    // Build most-recent status per client up to selectedMonth
    const latestStatus={};
    statuses.filter(s=>s.month<=selectedMonth).forEach(s=>{
      if(!latestStatus[s.clientId]||s.month>latestStatus[s.clientId].month)latestStatus[s.clientId]=s;
    });
    const activeList=clients
      .filter(c=>{
        const addedMonth=(c.createdAt||"").slice(0,7);
        if(!addedMonth||addedMonth>selectedMonth)return false;
        // Exclude if their most recent status (up to this month) is "lost"
        return latestStatus[c.id]?.status!=="lost";
      })
      .map(c=>({
        key:`ac_${c.id}`,sourceType:"active",sourceId:c.id,
        clientName:`${c.firstName} ${c.lastName}`.trim(),
        companyName:c.company||"",
        contractDate:c.createdAt?c.createdAt.slice(0,10):"",
        amountClosed:c.revenue||0
      }));
    // HP "Won" contacts won on or before the selected month, not yet converted to active_clients
    const acHpIds=new Set(clients.map(c=>c.hotPipelineId).filter(Boolean).map(String));
    const winningList=hpContacts
      .filter(c=>c.stage==="Won"&&!acHpIds.has(String(c.id))&&(c.wonAt||c.createdAt||"").slice(0,7)<=selectedMonth)
      .map(c=>({
        key:`hp_${c.id}`,sourceType:"winning",sourceId:c.id,
        clientName:`${c.firstName} ${c.lastName}`.trim(),
        companyName:c.accountName||"",
        contractDate:c.wonAt?c.wonAt.slice(0,10):(c.createdAt?c.createdAt.slice(0,10):""),
        amountClosed:c.saleValue||0
      }));
    return [...activeList,...winningList];
  },[clients,statuses,hpContacts,selectedMonth]);

  const monthEntries=useMemo(()=>entries.filter(e=>e.month===selectedMonth),[entries,selectedMonth]);

  // Previous month pending entries carried forward into this month
  const prevMonthStr=useMemo(()=>{
    const[y,m]=selectedMonth.split('-').map(Number);
    const pm=m===1?12:m-1; const py=m===1?y-1:y;
    return `${py}-${String(pm).padStart(2,'0')}`;
  },[selectedMonth]);
  const carriedOverEntries=useMemo(()=>
    entries.filter(e=>e.month===prevMonthStr&&e.status==="Pending").map(e=>({...e,carriedOver:true}))
  ,[entries,prevMonthStr]);
  const effectiveEntries=useMemo(()=>[...monthEntries,...carriedOverEntries],[monthEntries,carriedOverEntries]);

  const mergedContracts=useMemo(()=>allContracts.map(c=>{
    const meta=cpMeta.find(m=>m.sourceType===c.sourceType&&String(m.sourceId)===String(c.sourceId));
    return{...c,paymentSource:meta?.paymentSource||"",paymentCondition:meta?.paymentCondition||"Before Service",remarks:meta?.remarks||"",metaId:meta?.id||null};
  }),[allContracts,cpMeta]);

  const availableMonths=useMemo(()=>{
    const s=new Set([
      ...entries.map(e=>e.month).filter(Boolean),
      ...statuses.map(s=>s.month).filter(Boolean),
      ...hpContacts.filter(c=>c.stage==="Won").map(c=>(c.wonAt||c.createdAt||"").slice(0,7)).filter(Boolean),
      currentMonth
    ]);
    return [...s].sort().reverse();
  },[entries,statuses,hpContacts,currentMonth]);

  const filteredContracts=useMemo(()=>{
    if(!search.trim())return mergedContracts;
    const q=search.toLowerCase();
    return mergedContracts.filter(c=>[c.clientName,c.companyName,c.paymentSource].some(f=>f&&f.toLowerCase().includes(q)));
  },[mergedContracts,search]);

  const filteredEntries=useMemo(()=>{
    const base=effectiveEntries.slice().sort((a,b)=>a.scheduledDate.localeCompare(b.scheduledDate));
    if(!search.trim())return base;
    const q=search.toLowerCase();
    return base.filter(e=>[e.clientName,e.companyName,e.receivedFrom,e.status].some(f=>f&&f.toLowerCase().includes(q)));
  },[effectiveEntries,search]);

  const stats=useMemo(()=>{
    const contractsTotal=mergedContracts.reduce((s,c)=>s+c.amountClosed,0);
    const carriedOverTotal=carriedOverEntries.reduce((s,e)=>s+e.amount,0);
    const totalRevenue=contractsTotal+carriedOverTotal;
    const clientPaid=effectiveEntries.filter(e=>e.status==="Paid").reduce((s,e)=>s+e.amount,0);
    const balanceLost=effectiveEntries.filter(e=>e.status==="Balance Lost").reduce((s,e)=>s+e.amount,0);
    const pendingBalance=effectiveEntries.filter(e=>e.status==="Pending").reduce((s,e)=>s+e.amount,0);
    const confirmPayment=monthEntries.reduce((s,e)=>s+e.amount,0);
    const amountReceivedPkr=effectiveEntries.reduce((s,e)=>s+(e.receivedPkr||0),0);
    return{totalRevenue,clientPaid,pendingBalance,balanceLost,amountReceivedPkr,confirmPayment};
  },[mergedContracts,effectiveEntries,carriedOverEntries,monthEntries]);

  useEffect(()=>{onRevenue({val:stats.totalRevenue,label:"Total Revenue",color:"#36f2af"});},[stats.totalRevenue]);

  async function saveContractMeta(record,form){
    setSaving(true);
    const data=cpToRow({...record,...form});
    if(record.metaId){
      const res=await sbUpdate("client_payments",record.metaId,data);
      if(Array.isArray(res)&&res[0])setCpMeta(p=>p.map(x=>x.id===record.metaId?rowToCP(res[0]):x));
      else alert("Save failed:\n"+(res?.message||JSON.stringify(res)));
    }else{
      const res=await sbInsert("client_payments",data);
      if(Array.isArray(res)&&res[0])setCpMeta(p=>[...p,rowToCP(res[0])]);
      else alert("Save failed:\n"+(res?.message||JSON.stringify(res)));
    }
    setSaving(false);setContractEditModal(null);
  }

  async function saveEntry(form){
    setSaving(true);
    const contract=allContracts.find(c=>c.key===form.contractKey);
    const month=(form.scheduledDate||"").slice(0,7)||selectedMonth;
    const data=peToRow({...form,clientName:contract?.clientName||"",companyName:contract?.companyName||"",month});
    if(entryModal?.entry?.id){
      const res=await sbUpdate("payment_entries",entryModal.entry.id,data);
      if(Array.isArray(res)&&res[0])setEntries(p=>p.map(x=>x.id===entryModal.entry.id?rowToPE(res[0]):x));
      else alert("Save failed:\n"+(res?.message||JSON.stringify(res)));
    }else{
      const res=await sbInsert("payment_entries",data);
      if(Array.isArray(res)&&res[0])setEntries(p=>[...p,rowToPE(res[0])]);
      else alert("Save failed:\n"+(res?.message||JSON.stringify(res)));
    }
    setSaving(false);setEntryModal(null);
  }

  async function deleteEntry(id){
    await sbDelete("payment_entries",id);
    setEntries(p=>p.filter(e=>e.id!==id));
    setEntryModal(null);
  }

  if(loading)return <Spinner text="Loading Client Payments…"/>;

  const TH=({children})=><th style={{textAlign:"left",padding:"10px 12px",color:"rgba(174,220,255,0.45)",fontWeight:700,fontSize:11,textTransform:"uppercase",letterSpacing:"0.07em",whiteSpace:"nowrap",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>{children}</th>;
  const TD=({children,style={}})=><td style={{padding:"10px 12px",verticalAlign:"middle",...style}}>{children}</td>;
  const monthLabel=mo=>{const[y,m]=mo.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('default',{month:'long',year:'numeric'});};

  return(
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>

      {/* Header: month picker + 4 stat boxes */}
      <div style={{background:"rgba(255,255,255,0.03)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"12px 20px"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
          <MonthPicker selectedMonth={selectedMonth} currentMonth={currentMonth} availableMonths={availableMonths} onChange={setSelectedMonth}/>
          {selectedMonth!==currentMonth&&<>
            <span style={{background:"rgba(35,161,221,0.12)",color:"#23a1dd",border:"1px solid rgba(35,161,221,0.2)",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:600}}>📅 {monthLabel(selectedMonth)}</span>
            <button onClick={()=>setSelectedMonth(currentMonth)} style={{background:"rgba(54,242,175,0.08)",color:"#36f2af",border:"1px solid rgba(54,242,175,0.2)",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:11,fontWeight:600}}>↩ Current Month</button>
          </>}
        </div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <div style={{background:"rgba(54,242,175,0.08)",border:"1px solid rgba(54,242,175,0.2)",borderRadius:12,padding:"12px 20px",minWidth:155}}>
            <div style={{fontSize:10,color:"rgba(174,220,255,0.45)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:4}}>Total Revenue ($)</div>
            <div style={{fontSize:22,fontWeight:800,color:"#36f2af"}}>${stats.totalRevenue.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
          </div>
          <div onClick={()=>setShowConfirmPaymentModal(true)} style={{background:"rgba(6,182,212,0.08)",border:"1px solid rgba(6,182,212,0.2)",borderRadius:12,padding:"12px 20px",minWidth:155,cursor:"pointer",transition:"all .15s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="rgba(6,182,212,0.15)";e.currentTarget.style.borderColor="rgba(6,182,212,0.45)";}}
            onMouseLeave={e=>{e.currentTarget.style.background="rgba(6,182,212,0.08)";e.currentTarget.style.borderColor="rgba(6,182,212,0.2)";}}>
            <div style={{fontSize:10,color:"rgba(174,220,255,0.45)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:4}}>Confirm Payment ($)</div>
            <div style={{fontSize:22,fontWeight:800,color:"#06b6d4"}}>${stats.confirmPayment.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
            <div style={{fontSize:10,color:"rgba(6,182,212,0.5)",marginTop:2}}>Click to view entries →</div>
          </div>
          <div style={{background:"rgba(35,161,221,0.08)",border:"1px solid rgba(35,161,221,0.2)",borderRadius:12,padding:"12px 20px",minWidth:155}}>
            <div style={{fontSize:10,color:"rgba(174,220,255,0.45)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:4}}>Client Paid ($)</div>
            <div style={{fontSize:22,fontWeight:800,color:"#23a1dd"}}>${stats.clientPaid.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
          </div>
          <div onClick={()=>setShowPendingModal(true)} style={{background:"rgba(245,158,11,0.08)",border:"1px solid rgba(245,158,11,0.2)",borderRadius:12,padding:"12px 20px",minWidth:155,cursor:"pointer",transition:"all .15s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="rgba(245,158,11,0.15)";e.currentTarget.style.borderColor="rgba(245,158,11,0.45)";}}
            onMouseLeave={e=>{e.currentTarget.style.background="rgba(245,158,11,0.08)";e.currentTarget.style.borderColor="rgba(245,158,11,0.2)";}}>
            <div style={{fontSize:10,color:"rgba(174,220,255,0.45)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:4}}>Pending Balance ($)</div>
            <div style={{fontSize:22,fontWeight:800,color:"#f59e0b"}}>${stats.pendingBalance.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
            <div style={{fontSize:10,color:"rgba(245,158,11,0.5)",marginTop:2}}>Click to view breakdown →</div>
          </div>
          <div style={{background:"rgba(148,163,184,0.08)",border:"1px solid rgba(148,163,184,0.25)",borderRadius:12,padding:"12px 20px",minWidth:155}}>
            <div style={{fontSize:10,color:"rgba(174,220,255,0.45)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:4}}>Balance Lost ($)</div>
            <div style={{fontSize:22,fontWeight:800,color:"#94a3b8"}}>${stats.balanceLost.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
          </div>
          <div style={{background:"linear-gradient(135deg,rgba(168,85,247,0.18),rgba(192,132,252,0.08))",border:"2px solid rgba(168,85,247,0.45)",borderRadius:12,padding:"12px 20px",minWidth:190,boxShadow:"0 0 24px rgba(168,85,247,0.18),inset 0 1px 0 rgba(255,255,255,0.04)"}}>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
              <span style={{fontSize:10,color:"rgba(192,132,252,0.85)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.09em"}}>Amount Received (PKR)</span>
              <span style={{background:"rgba(168,85,247,0.35)",color:"#c084fc",borderRadius:20,padding:"1px 7px",fontSize:9,fontWeight:700}}>★</span>
            </div>
            <div style={{fontSize:22,fontWeight:800,color:"#c084fc"}}>₨ {stats.amountReceivedPkr.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
          </div>
        </div>
      </div>

      {/* Sub-tabs */}
      <div style={{background:"rgba(255,255,255,0.02)",borderBottom:"1px solid rgba(255,255,255,0.07)",padding:"0 20px",display:"flex",alignItems:"center",flexShrink:0}}>
        {[{key:"contracts",label:"Client Contracts"},{key:"payment_status",label:"Payment Status"},{key:"calendar",label:"Payment Calendar"}].map(t=>(
          <button key={t.key} onClick={()=>setActiveTab(t.key)}
            style={{padding:"11px 18px",background:"transparent",border:"none",borderBottom:`2px solid ${activeTab===t.key?"#23a1dd":"transparent"}`,color:activeTab===t.key?"#23a1dd":"rgba(174,220,255,0.42)",cursor:"pointer",fontSize:13,fontWeight:activeTab===t.key?700:500,transition:"all .15s",marginBottom:-1}}>
            {t.label}
          </button>
        ))}
      </div>

      {/* Content */}
      <div style={{flex:1,overflow:"auto",padding:"14px 16px"}}>

        {/* ── Client Contracts ── */}
        {activeTab==="contracts"&&(
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr><TH>Client Name</TH><TH>Company Name</TH><TH>Payment Source</TH><TH>Payment Condition</TH><TH>Date of Contract</TH><TH>Amount Closed</TH><TH>Remarks</TH><TH></TH></tr>
            </thead>
            <tbody>
              {filteredContracts.length===0&&<tr><td colSpan={8} style={{textAlign:"center",padding:"48px 0",color:"rgba(174,220,255,0.25)",fontSize:14}}>No contracts found.</td></tr>}
              {filteredContracts.map((c,i)=>(
                <tr key={c.key} style={{borderBottom:"1px solid rgba(255,255,255,0.045)",background:i%2===0?"transparent":"rgba(255,255,255,0.018)",transition:"background .12s"}}
                  onMouseEnter={e=>e.currentTarget.style.background="rgba(35,161,221,0.07)"}
                  onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"transparent":"rgba(255,255,255,0.018)"}>
                  <TD><span style={{color:"#daeeff",fontWeight:600}}>{c.clientName||"—"}</span></TD>
                  <TD><span style={{color:"rgba(174,220,255,0.75)"}}>{c.companyName||"—"}</span></TD>
                  <TD>{c.paymentSource?<span style={{background:"rgba(35,161,221,0.14)",color:"#23a1dd",borderRadius:20,padding:"3px 11px",fontSize:12,fontWeight:600}}>{c.paymentSource}</span>:<span style={{color:"rgba(174,220,255,0.25)",fontSize:12}}>Not set</span>}</TD>
                  <TD><span style={{background:c.paymentCondition==="Before Service"?"rgba(54,242,175,0.1)":"rgba(245,158,11,0.1)",color:c.paymentCondition==="Before Service"?"#36f2af":"#f59e0b",borderRadius:20,padding:"3px 11px",fontSize:12,fontWeight:600}}>{c.paymentCondition}</span></TD>
                  <TD><span style={{color:"rgba(174,220,255,0.65)",whiteSpace:"nowrap"}}>{c.contractDate||"—"}</span></TD>
                  <TD><span style={{color:"#36f2af",fontWeight:700}}>${(c.amountClosed||0).toLocaleString(undefined,{maximumFractionDigits:0})}</span></TD>
                  <TD style={{maxWidth:160}}><span style={{color:"rgba(174,220,255,0.5)",display:"block",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:160}}>{c.remarks||"—"}</span></TD>
                  <TD><button onClick={()=>setContractEditModal(c)} style={{background:"rgba(35,161,221,0.12)",color:"#23a1dd",border:"1px solid rgba(35,161,221,0.22)",borderRadius:7,padding:"5px 13px",cursor:"pointer",fontSize:12,fontWeight:600}}>Edit</button></TD>
                </tr>
              ))}
            </tbody>
          </table>
        )}

        {/* ── Payment Status ── */}
        {activeTab==="payment_status"&&(
          <div>
            <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
              <button onClick={()=>setEntryModal({mode:"add",date:new Date().toISOString().slice(0,10)})}
                style={{background:"#36f2af",color:"#082018",border:"none",borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:12,fontWeight:700}}>+ Add Payment</button>
            </div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead>
                <tr><TH>Date</TH><TH>Client Name</TH><TH>Company Name</TH><TH>Amount ($)</TH><TH>Status</TH><TH>Received in (PKR)</TH><TH>Received From</TH><TH></TH></tr>
              </thead>
              <tbody>
                {filteredEntries.length===0&&<tr><td colSpan={8} style={{textAlign:"center",padding:"48px 0",color:"rgba(174,220,255,0.25)",fontSize:14}}>No payment entries for {monthLabel(selectedMonth)}.<br/><span style={{fontSize:12,marginTop:4,display:"block"}}>Schedule payments via the Payment Calendar tab.</span></td></tr>}
                {filteredEntries.map((e,i)=>(
                  <tr key={`${e.id}_${e.carriedOver?"co":""}` } onClick={()=>setEntryModal({mode:"edit",entry:e})}
                    style={{borderBottom:"1px solid rgba(255,255,255,0.045)",background:e.carriedOver?"rgba(245,158,11,0.06)":i%2===0?"transparent":"rgba(255,255,255,0.018)",transition:"background .12s",cursor:"pointer"}}
                    onMouseEnter={ev=>ev.currentTarget.style.background=e.carriedOver?"rgba(245,158,11,0.12)":"rgba(35,161,221,0.07)"}
                    onMouseLeave={ev=>ev.currentTarget.style.background=e.carriedOver?"rgba(245,158,11,0.06)":i%2===0?"transparent":"rgba(255,255,255,0.018)"}>
                    <TD><span style={{color:"rgba(174,220,255,0.65)",whiteSpace:"nowrap"}}>{e.scheduledDate||"—"}{e.carriedOver&&<span style={{marginLeft:6,fontSize:10,color:"#f59e0b",background:"rgba(245,158,11,0.15)",border:"1px solid rgba(245,158,11,0.3)",borderRadius:10,padding:"1px 6px",fontWeight:600}}>carried</span>}</span></TD>
                    <TD><span style={{color:"#daeeff",fontWeight:600}}>{e.clientName||"—"}</span></TD>
                    <TD><span style={{color:"rgba(174,220,255,0.75)"}}>{e.companyName||"—"}</span></TD>
                    <TD><span style={{color:"#36f2af",fontWeight:700}}>${Number(e.amount||0).toLocaleString(undefined,{maximumFractionDigits:0})}</span></TD>
                    <TD><span style={{background:`${CP_ENTRY_STATUS_COLOR[e.status]||"#64748b"}20`,color:CP_ENTRY_STATUS_COLOR[e.status]||"#64748b",borderRadius:20,padding:"3px 11px",fontSize:12,fontWeight:700,border:`1px solid ${CP_ENTRY_STATUS_COLOR[e.status]||"#64748b"}40`}}>{e.status}</span></TD>
                    <TD><span style={{color:"#c084fc",fontWeight:600}}>{e.receivedPkr>0?`₨ ${Number(e.receivedPkr).toLocaleString(undefined,{maximumFractionDigits:0})}`:"—"}</span></TD>
                    <TD>{e.receivedFrom?<span style={{background:"rgba(35,161,221,0.14)",color:"#23a1dd",borderRadius:20,padding:"3px 11px",fontSize:12,fontWeight:600}}>{e.receivedFrom}</span>:<span style={{color:"rgba(174,220,255,0.25)",fontSize:12}}>—</span>}</TD>
                    <TD><button onClick={ev=>{ev.stopPropagation();setEntryModal({mode:"edit",entry:e});}} style={{background:"rgba(35,161,221,0.12)",color:"#23a1dd",border:"1px solid rgba(35,161,221,0.22)",borderRadius:7,padding:"5px 13px",cursor:"pointer",fontSize:12,fontWeight:600}}>Edit</button></TD>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        {/* ── Payment Calendar ── */}
        {activeTab==="calendar"&&(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <span style={{fontSize:15,fontWeight:700,color:"#daeeff"}}>{monthLabel(selectedMonth)}</span>
              <button onClick={()=>setEntryModal({mode:"add",date:new Date().toISOString().slice(0,10)})}
                style={{background:"#36f2af",color:"#082018",border:"none",borderRadius:8,padding:"7px 16px",cursor:"pointer",fontSize:12,fontWeight:700}}>+ Schedule Payment</button>
            </div>
            <CPCalendarUI entries={monthEntries} contracts={allContracts} selectedMonth={selectedMonth}
              onAddEntry={date=>setEntryModal({mode:"add",date})}
              onEditEntry={entry=>setEntryModal({mode:"edit",entry})}/>
          </div>
        )}

      </div>

      {showConfirmPaymentModal&&<ConfirmPaymentModal monthEntries={monthEntries} monthLabel={monthLabel} selectedMonth={selectedMonth} onClose={()=>setShowConfirmPaymentModal(false)}/>}
      {showPendingModal&&<PendingBalanceModal effectiveEntries={effectiveEntries} monthLabel={monthLabel} selectedMonth={selectedMonth} onClose={()=>setShowPendingModal(false)}/>}
      {contractEditModal&&<CPContractEditModal record={contractEditModal} onClose={()=>setContractEditModal(null)} onSave={form=>saveContractMeta(contractEditModal,form)} saving={saving}/>}
      {entryModal&&<CPEntryModal
        entry={entryModal.mode==="edit"?entryModal.entry:null}
        contracts={allContracts}
        selectedDate={entryModal.mode==="add"?entryModal.date:null}
        onClose={()=>setEntryModal(null)}
        onSave={saveEntry}
        onDelete={deleteEntry}
        saving={saving}
      />}
    </div>
  );
}
